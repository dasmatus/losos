[package]
name = "losos-registrar"
version = "0.1.0"
edition = "2021"
publish = false
description = "losos edge registration + Traefik/rathole config reconciler (serve) and appliance registration client (announce)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "process"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
serde_yaml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Crate-wide lint policy: forbid unsafe, surface stray pub items and stale
# extern crates. Per-contributor clippy config is intentionally NOT used.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "losos-registrar"
path = "src/main.rs"
