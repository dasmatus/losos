[package]
name = "losos-registrar"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Matus Mastena <shadiness9530+ou1rlygj@pm.me>"]
description = "losos edge registration + Traefik/rathole config reconciler (serve) and appliance registration client (announce)"
license = "AGPL-3.0-or-later"

[dependencies]
# "signal": the serve loop installs a SIGTERM/SIGINT handler for graceful
# shutdown. "process": `lab` drives libvirt through the `virsh` CLI and
# nothing else in this crate spawns a child.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
# "ws": `lab` bridges a guest's serial console and network cards to the
# browser over WebSockets.
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
serde_yaml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Token comparison. `subtle` is the audited primitive; the previous
# hand-rolled byte loop was correct but is not the thing to hand-roll on a
# route the public internet can reach. Already in the lock tree (rustls pulls
# it), so making it direct adds no vendored crate.
subtle = "2"
# HMAC-SHA256 for Stripe webhook signatures, and the CSPRNG for order ids.
# Already in the lock tree (rustls uses it), so — like `subtle` — making it
# direct vendors no new crate.
ring = "0.17"
# `stream::unfold` turns a buyer's stored disk image into a response body
# (`server/vm.rs`). Already in the lock tree through axum's "ws".
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# tests/lab.rs talks to the helper's console and NIC WebSockets as the
# browser would. Both are already in the lock tree through axum's "ws" and
# reqwest, so the test client vendors nothing new.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Crate-wide lint policy: forbid unsafe, surface stray pub items and stale
# extern crates. Per-contributor clippy config is intentionally NOT used.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "losos-registrar"
path = "src/main.rs"
