<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
  </defs>
  <rect width="640" height="530" fill="#fff"/>
  <rect x="20" y="16" width="600" height="112" rx="10" fill="#f3f6f6" stroke="#9ab" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="40" y="44" text-anchor="start" fill="#18212a" font-weight="600">Gone at every boot</text>
  <text x="40" y="70" text-anchor="start" fill="#5c6a77" font-size="13">/ is tmpfs: it lives in memory and is rebuilt from the box&#x27;s</text>
  <text x="40" y="88" text-anchor="start" fill="#5c6a77" font-size="13">description. Anything written outside the list below is gone.</text>
  <rect x="20" y="176" width="600" height="338" rx="10" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="40" y="204" text-anchor="start" fill="#18212a" font-weight="600">Kept on /persist, the encrypted volume</text>
  <text x="40" y="238" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/home/notshared</text>
  <text x="200" y="238" text-anchor="start" fill="#5c6a77" font-size="13">your files, LosOS cloud&#x27;s data</text>
  <text x="40" y="268" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/home/shared</text>
  <text x="200" y="268" text-anchor="start" fill="#5c6a77" font-size="13">room lent to the mesh</text>
  <text x="40" y="298" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/var</text>
  <text x="200" y="298" text-anchor="start" fill="#5c6a77" font-size="13">LosOS Git, state, secrets, clusters</text>
  <text x="40" y="328" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/nix</text>
  <text x="200" y="328" text-anchor="start" fill="#5c6a77" font-size="13">the system, every kept version</text>
  <text x="40" y="358" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/etc/nixos</text>
  <text x="200" y="358" text-anchor="start" fill="#5c6a77" font-size="13">the box&#x27;s description, your settings</text>
  <text x="40" y="388" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/etc/keys</text>
  <text x="200" y="388" text-anchor="start" fill="#5c6a77" font-size="13">the disk key&#x27;s recovery copy</text>
  <text x="40" y="418" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/etc/ssh</text>
  <text x="200" y="418" text-anchor="start" fill="#5c6a77" font-size="13">host keys, the box&#x27;s identity</text>
  <text x="40" y="448" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/etc/rancher</text>
  <text x="200" y="448" text-anchor="start" fill="#5c6a77" font-size="13">the mesh node&#x27;s password</text>
  <text x="40" y="478" text-anchor="start" fill="#0e6e7d" font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">/etc/machine-id</text>
  <text x="200" y="478" text-anchor="start" fill="#5c6a77" font-size="13">the machine&#x27;s identity</text>
  <line x1="320" y1="176" x2="320" y2="130" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <text x="332" y="158" text-anchor="start" fill="#5c6a77" font-size="12">bind-mounted back at every boot</text>
</svg>
