<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc" stroke-width="3"/></pattern>
  </defs>
  <rect width="640" height="500" fill="#fff"/>
  <rect x="20" y="24" width="150" height="48" rx="24.0" fill="#f3f6f6" stroke="#9ab"/>
  <text x="95" y="53" text-anchor="middle" fill="#5c6a77" font-size="13">the internet</text>
  <rect x="230" y="16" width="170" height="64" rx="8" fill="#f3f6f6" stroke="#9ab" stroke-width="1"/>
  <text x="315.0" y="40" text-anchor="middle" fill="#18212a" font-size="12" font-weight="600">Edge</text>
  <text x="315.0" y="59" text-anchor="middle" fill="#5c6a77" font-size="12">faces the internet</text>
  <rect x="500" y="22" width="56" height="36" rx="4" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="494" y="58" width="68" height="5" rx="2" fill="#f3f6f6" stroke="#0e6e7d" stroke-width="1"/>
  <text x="528" y="82" text-anchor="middle" fill="#5c6a77" font-size="12">a browser on the LAN</text>
  <rect x="20" y="120" width="600" height="220" rx="12" fill="none" stroke="#0e6e7d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="142" text-anchor="start" fill="#0e6e7d" font-size="12" font-weight="700">THE BOX</text>
  <rect x="36" y="154" width="568" height="50" rx="8" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="320.0" y="178" text-anchor="middle" fill="#5c6a77" font-size="13">nginx and lososd: admin pages LAN-only, API on loopback</text>
  <rect x="36" y="222" width="268" height="100" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="170.0" y="246" text-anchor="middle" fill="#18212a" font-size="12" font-weight="600">notshared</text>
  <text x="170.0" y="265" text-anchor="middle" fill="#5c6a77" font-size="12">your files</text>
  <text x="170.0" y="282" text-anchor="middle" fill="#5c6a77" font-size="12">mode 700</text>
  <rect x="336" y="222" width="268" height="100" rx="8" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="346" y="232" width="248" height="80" rx="6" fill="#fff" stroke="none" stroke-width="1"/>
  <text x="470" y="252" text-anchor="middle" fill="#18212a" font-size="12" font-weight="600">shared</text>
  <text x="470" y="272" text-anchor="middle" fill="#5c6a77" font-size="12">the mesh&#x27;s copies, its own key,</text>
  <text x="470" y="289" text-anchor="middle" fill="#5c6a77" font-size="12">loaded only while sharing is on</text>
  <line x1="170" y1="48" x2="228" y2="48" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="152" x2="316" y2="82" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <line x1="528" y1="92" x2="528" y2="152" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="199" cy="34" r="11" fill="#0e6e7d"/>
  <text x="199" y="38" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
  <circle cx="322" cy="118" r="11" fill="#0e6e7d"/>
  <text x="322" y="122" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
  <circle cx="548" cy="122" r="11" fill="#0e6e7d"/>
  <text x="548" y="126" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
  <circle cx="320" cy="272" r="11" fill="#0e6e7d"/>
  <text x="320" y="276" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4</text>
  <circle cx="412" cy="16" r="11" fill="#0e6e7d"/>
  <text x="412" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">5</text>
  <text x="20" y="372" text-anchor="start" fill="#5c6a77" font-size="13">1  Internet to edge: only the edge listens; the box tunnels out.</text>
  <text x="20" y="396" text-anchor="start" fill="#5c6a77" font-size="13">2  Edge to box: encrypted end to end; the box pins the edge&#x27;s key.</text>
  <text x="20" y="420" text-anchor="start" fill="#5c6a77" font-size="13">3  LAN to box: HTTPS with the box&#x27;s certificate, trusted once.</text>
  <text x="20" y="444" text-anchor="start" fill="#5c6a77" font-size="13">4  Your files and the mesh&#x27;s copies: neither reads the other.</text>
  <text x="20" y="468" text-anchor="start" fill="#5c6a77" font-size="13">5  Official or not: the project&#x27;s root key decides the market.</text>
</svg>
