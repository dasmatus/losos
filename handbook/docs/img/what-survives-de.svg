<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" fill="#18212a">
  <title>Was einen Neustart übersteht: die Wurzel im RAM wird neu gebaut, neun Verzeichnisse kommen vom verschlüsselten Volume zurück</title>
  <defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6e7d"/></marker></defs>
  <rect x="0.5" y="0.5" width="999" height="459" rx="12" fill="#ffffff" stroke="#dce1e6"/>
  <rect x="40" y="40" width="380" height="380" rx="10" fill="#f3f5f7" stroke="#dce1e6"/>
  <text x="58" y="70" font-weight="650">/   die Systemplatte, im RAM</text>
  <text x="58" y="92" fill="#5c6a77" font-size="13">bei jedem Start aus der Beschreibung neu gebaut</text>
  <rect x="58" y="120" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="137" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/home/notshared</text>
  <line x1="404" y1="132" x2="578" y2="132" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="150" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="167" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/home/shared</text>
  <line x1="404" y1="162" x2="578" y2="162" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="180" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="197" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/var</text>
  <line x1="404" y1="192" x2="578" y2="192" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="210" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="227" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/nix</text>
  <line x1="404" y1="222" x2="578" y2="222" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="240" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="257" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/etc/nixos</text>
  <line x1="404" y1="252" x2="578" y2="252" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="270" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="287" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/etc/keys</text>
  <line x1="404" y1="282" x2="578" y2="282" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="300" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="317" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/etc/ssh</text>
  <line x1="404" y1="312" x2="578" y2="312" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="330" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="347" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/etc/rancher</text>
  <line x1="404" y1="342" x2="578" y2="342" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <rect x="58" y="360" width="344" height="24" rx="5" fill="#ffffff" stroke="#9cc5cc"/>
  <text x="70" y="377" font-size="13" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">/etc/machine-id</text>
  <line x1="404" y1="372" x2="578" y2="372" stroke="#0e6e7d" stroke-width="1.2" marker-start="url(#ac)"/>
  <text x="58" y="412" fill="#a8443c" font-size="13">alles andere: beim Neustart um 00:07 weg</text>
  <rect x="580" y="40" width="380" height="380" rx="10" fill="#0e6e7d"/>
  <text x="598" y="70" font-weight="650" fill="#ffffff">/persist   verschlüsselt, vom TPM entsperrt</text>
  <text x="598" y="92" fill="#e2eff1" font-size="13">jedes Verzeichnis wird per Bind-Mount zurückgeholt</text>
  <text x="598" y="137" font-size="13" fill="#ffffff">LosOS Cloud: deine Dateien, Fotos, Datenbank</text>
  <text x="598" y="167" font-size="13" fill="#ffffff">ans Mesh verliehener Platz, getrennt verschlüsselt</text>
  <text x="598" y="197" font-size="13" fill="#ffffff">LosOS Git, Zustand der Box, beide Cluster, Logs</text>
  <text x="598" y="227" font-size="13" fill="#ffffff">das System selbst, jede Version im Bootmenü</text>
  <text x="598" y="257" font-size="13" fill="#ffffff">die Beschreibung der Box und deine Einstellungen</text>
  <text x="598" y="287" font-size="13" fill="#ffffff">die Wiederherstellungskopie des Plattenschlüssels</text>
  <text x="598" y="317" font-size="13" fill="#ffffff">Host-Schlüssel, die die Box ausweisen</text>
  <text x="598" y="347" font-size="13" fill="#ffffff">das Node-Passwort der Mesh-Mitgliedschaft</text>
  <text x="598" y="377" font-size="13" fill="#ffffff">die Identität der Box</text>
  </svg>
