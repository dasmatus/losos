<svg xml:lang="sk" xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" fill="#18212a">
  <title>Noc v LosOS: reštart o 00:07, aktualizácia o 03:00, upratovanie o 04:30</title>
  <rect x="0.5" y="0.5" width="999" height="319" rx="12" fill="#ffffff" stroke="#dce1e6"/>
  <text x="40" y="40" font-weight="650">Každú noc, na každom zariadení</text>
  <text x="40" y="62" fill="#5c6a77" font-size="13">Cez deň sa nič ďalšie nereštartuje. Zariadenie, ktoré bolo o 00:07 vypnuté, sa reštartuje hneď po zapnutí.</text>
  <rect x="40" y="174" width="920" height="12" rx="6" fill="#eaedf0"/>
  <line x1="40.0" y1="190" x2="40.0" y2="198" stroke="#8c98a4"/>
