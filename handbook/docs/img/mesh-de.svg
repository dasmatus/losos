<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" fill="#18212a">
  <title>Das Mesh: Boxen verleihen freien Platz an einen replizierten Pool und freie Zeit innerhalb eines Zeitfensters</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6a77"/></marker>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e2eff1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9cc5cc" stroke-width="2.5"/></pattern>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="559" rx="12" fill="#ffffff" stroke="#dce1e6"/>

  <rect x="230" y="28" width="540" height="74" rx="8" fill="#f3f5f7" stroke="#5c6a77" stroke-width="1.5"/>
  <text x="500" y="56" text-anchor="middle" font-weight="650">Edge</text>
  <text x="500" y="79" text-anchor="middle" fill="#5c6a77" font-size="13">betreibt den Cluster des Mesh · verteilt die Kopien · entscheidet, wann verliehen wird</text>

  <g stroke="#5c6a77" stroke-width="1.5" fill="none">
    <line x1="180" y1="148" x2="380" y2="104" marker-end="url(#ar)"/>
    <line x1="500" y1="148" x2="500" y2="104" marker-end="url(#ar)"/>
    <line x1="820" y1="148" x2="620" y2="104" marker-end="url(#ar)"/>
  </g>
  <text x="250" y="118" fill="#5c6a77" font-size="12" text-anchor="end">tritt als Agent bei</text>

  <!-- three boxes -->
  <g>
    <rect x="40" y="150" width="280" height="190" rx="10" fill="#ffffff" stroke="#0e6e7d" stroke-width="1.5"/>
    <text x="56" y="176" font-weight="650">Box 1</text>
    <rect x="56" y="190" width="248" height="56" rx="6" fill="#0e6e7d"/>
    <text x="72" y="214" fill="#ffffff" font-size="13" font-weight="650">Die eigenen Dateien</text>
    <text x="72" y="233" fill="#e2eff1" font-size="12">verlassen diese Box nie</text>
    <rect x="56" y="256" width="248" height="68" rx="6" fill="url(#h)" stroke="#9cc5cc"/>
    <text x="72" y="282" font-size="13" font-weight="650">Platz, der nicht genutzt wird</text>
    <text x="72" y="302" font-size="12" fill="#5c6a77">an den Pool, getrennt verschlüsselt</text>
  </g>
  <g>
    <rect x="360" y="150" width="280" height="190" rx="10" fill="#ffffff" stroke="#0e6e7d" stroke-width="1.5"/>
    <text x="376" y="176" font-weight="650">Box 2</text>
    <rect x="376" y="190" width="248" height="80" rx="6" fill="#0e6e7d"/>
    <text x="392" y="214" fill="#ffffff" font-size="13" font-weight="650">Die eigenen Dateien</text>
    <text x="392" y="233" fill="#e2eff1" font-size="12">verlassen diese Box nie</text>
    <rect x="376" y="280" width="248" height="44" rx="6" fill="url(#h)" stroke="#9cc5cc"/>
    <text x="392" y="307" font-size="13" font-weight="650">Freier Platz, verliehen</text>
  </g>
  <g>
    <rect x="680" y="150" width="280" height="190" rx="10" fill="#ffffff" stroke="#0e6e7d" stroke-width="1.5"/>
    <text x="696" y="176" font-weight="650">Box 3</text>
    <rect x="696" y="190" width="248" height="44" rx="6" fill="#0e6e7d"/>
    <text x="712" y="217" fill="#ffffff" font-size="13" font-weight="650">Die eigenen Dateien</text>
    <rect x="696" y="244" width="248" height="80" rx="6" fill="url(#h)" stroke="#9cc5cc"/>
    <text x="712" y="270" font-size="13" font-weight="650">Freier Platz, verliehen</text>
  </g>

  <!-- pool -->
  <g stroke="#9cc5cc" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <line x1="180" y1="326" x2="180" y2="364"/>
    <line x1="500" y1="326" x2="500" y2="364"/>
    <line x1="820" y1="326" x2="820" y2="364"/>
  </g>
  <rect x="40" y="366" width="920" height="46" rx="8" fill="url(#h)" stroke="#0e6e7d"/>
  <text x="500" y="394" text-anchor="middle" font-weight="650">Ein Pool: jede Kopie liegt auf mehr als einer Box, also kann eine Box gehen</text>

  <!-- compute window -->
  <text x="40" y="448" font-weight="650">Freie Zeit</text>
  <text x="140" y="448" fill="#5c6a77" font-size="13">Fremde Arbeit läuft auf einer Box nur in den dafür freigegebenen Stunden und nur, solange die Box nichts zu tun hat.</text>
  <rect x="40" y="464" width="920" height="30" rx="6" fill="#f3f5f7" stroke="#dce1e6"/>
  <!-- 24h: 0..24 maps to 40..960 (38.33 px/h). Window 23:00 to 07:00 -->
  <rect x="40" y="464" width="268.3" height="30" rx="6" fill="url(#h)" stroke="#0e6e7d"/>
  <rect x="921.7" y="464" width="38.3" height="30" fill="url(#h)" stroke="#0e6e7d"/>
  <g fill="#5c6a77" font-size="12" text-anchor="middle">
    <text x="40" y="514">00:00</text><text x="270" y="514">06:00</text><text x="500" y="514">12:00</text><text x="730" y="514">18:00</text><text x="960" y="514">24:00</text>
  </g>
  <text x="174" y="484" text-anchor="middle" font-size="12">verliehen, wenn frei</text>
  <text x="615" y="484" text-anchor="middle" font-size="12" fill="#5c6a77">der eigene Tag: nie verliehen</text>
  <text x="40" y="540" fill="#5c6a77" font-size="12">Ein Fenster von 23:00 bis 07:00 in der Zeitzone der Box. Der Edge prüft es pro Box, also verschiebt es sich bei der Zeitumstellung nicht.</text>
</svg>
