  <text x="598" y="70" font-weight="650" fill="#ffffff">/persist   šifrovaný, odomyká ho TPM</text>
  <text x="598" y="92" fill="#e2eff1" font-size="13">každý adresár sa pripojí späť na svoje miesto</text>
  <text x="598" y="137" font-size="13" fill="#ffffff">LosOS cloud: vaše súbory, fotky, databáza</text>
