<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc" stroke-width="3"/></pattern>
  </defs>
  <rect width="640" height="370" fill="#fff"/>
  <text x="20" y="30" text-anchor="start" fill="#18212a" font-weight="600">Kept to itself (the default)</text>
  <rect x="20" y="42" width="330.0" height="30" rx="0" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <text x="185.0" y="90" text-anchor="middle" fill="#5c6a77" font-size="12">room in use</text>
  <rect x="350.0" y="42" width="210.0" height="30" rx="0" fill="#fff" stroke="#9ab" stroke-width="1"/>
  <text x="455.0" y="90" text-anchor="middle" fill="#5c6a77" font-size="12">free</text>
  <rect x="560.0" y="42" width="60.0" height="30" rx="0" fill="#f3f6f6" stroke="#9ab" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="590.0" y="90" text-anchor="middle" fill="#5c6a77" font-size="12">reserve</text>
  <text x="20" y="126" text-anchor="start" fill="#18212a" font-weight="600">Shared with the mesh</text>
  <rect x="20" y="138" width="270.0" height="30" rx="0" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <text x="155.0" y="186" text-anchor="middle" fill="#5c6a77" font-size="12">in use</text>
  <rect x="290.0" y="138" width="180.0" height="30" rx="0" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <text x="380.0" y="186" text-anchor="middle" fill="#5c6a77" font-size="12">lent to the mesh</text>
  <rect x="470.0" y="138" width="90.0" height="30" rx="0" fill="#fff" stroke="#9ab" stroke-width="1"/>
  <text x="515.0" y="186" text-anchor="middle" fill="#5c6a77" font-size="12">free</text>
  <rect x="560.0" y="138" width="60.0" height="30" rx="0" fill="#f3f6f6" stroke="#9ab" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="590.0" y="186" text-anchor="middle" fill="#5c6a77" font-size="12">reserve</text>
  <text x="20" y="212" text-anchor="start" fill="#5c6a77" font-size="13">Lent room lives in /home/shared, with its own key.</text>
  <text x="20" y="262" text-anchor="start" fill="#18212a" font-weight="600">Lending spare CPU</text>
  <rect x="20" y="278" width="170" height="28" rx="14" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="105" y="297" text-anchor="middle" fill="#0e6e7d" font-size="13" font-weight="600">inside your hours</text>
  <text x="212" y="297" text-anchor="middle" fill="#5c6a77" font-size="13">and</text>
  <rect x="234" y="278" width="140" height="28" rx="14" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="304" y="297" text-anchor="middle" fill="#0e6e7d" font-size="13" font-weight="600">the box is idle</text>
  <line x1="378" y1="292" x2="418" y2="292" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <text x="424" y="297" text-anchor="start" fill="#18212a" font-size="13">others&#x27; work runs</text>
  <text x="20" y="340" text-anchor="start" fill="#5c6a77" font-size="12">Anything unknown counts as busy. The hours are judged on the edge,</text>
  <text x="20" y="358" text-anchor="start" fill="#5c6a77" font-size="12">in the box&#x27;s own time zone.</text>
</svg>
