<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc" stroke-width="3"/></pattern>
  </defs>
  <rect width="640" height="560" fill="#fff"/>
  <rect x="20" y="16" width="600" height="330" rx="12" fill="none" stroke="#0e6e7d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="38" text-anchor="start" fill="#0e6e7d" font-size="12" font-weight="700">THE BOX</text>
  <rect x="36" y="50" width="568" height="128" rx="8" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="320" y="76" text-anchor="middle" fill="#18212a" font-weight="600">k3s server: the box&#x27;s own cluster</text>
  <rect x="60" y="92" width="250" height="60" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="185.0" y="116" text-anchor="middle" fill="#18212a" font-size="12" font-weight="600">LosOS cloud</text>
  <text x="185.0" y="135" text-anchor="middle" fill="#5c6a77" font-size="12">a pod</text>
  <rect x="330" y="92" width="250" height="60" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="455.0" y="116" text-anchor="middle" fill="#18212a" font-size="12" font-weight="600">LosOS Git</text>
  <text x="455.0" y="135" text-anchor="middle" fill="#5c6a77" font-size="12">a pod</text>
  <rect x="36" y="196" width="568" height="134" rx="8" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="46" y="206" width="548" height="114" rx="6" fill="#fff" stroke="none" stroke-width="1"/>
  <text x="320" y="232" text-anchor="middle" fill="#18212a" font-weight="600">rke2 agent: the mesh</text>
  <text x="320" y="258" text-anchor="middle" fill="#5c6a77" font-size="13">others&#x27; work, in your hours; the replicated pool</text>
  <text x="320" y="276" text-anchor="middle" fill="#5c6a77" font-size="13">cannot start while its server is unreachable</text>
  <rect x="220" y="384" width="200" height="70" rx="8" fill="#f3f6f6" stroke="#9ab" stroke-width="1"/>
  <text x="320.0" y="408" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">Edge</text>
  <text x="320.0" y="428" text-anchor="middle" fill="#5c6a77" font-size="13">rke2 server, Longhorn</text>
  <line x1="320" y1="330" x2="320" y2="382" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <text x="432" y="424" text-anchor="start" fill="#5c6a77" font-size="12">may be down at midnight</text>
  <rect x="20" y="476" width="600" height="66" rx="8" fill="#f3f6f6" stroke="none" stroke-width="1"/>
  <circle cx="44" cy="500" r="9" fill="#2e7357"/>
  <path d="M39.5 500l3 3 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="505" text-anchor="start" fill="#18212a" font-size="13">Restart at 00:07 with the edge down:</text>
  <text x="62" y="526" text-anchor="start" fill="#18212a" font-size="13">your files and repositories come back on their own.</text>
</svg>
