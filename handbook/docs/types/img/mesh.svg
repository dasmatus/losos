<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc" stroke-width="3"/></pattern>
  </defs>
  <rect width="640" height="470" fill="#fff"/>
  <rect x="120" y="12" width="400" height="30" rx="15.0" fill="#f3f6f6" stroke="#9ab"/>
  <text x="320" y="32" text-anchor="middle" fill="#5c6a77" font-size="12">the internet, or a company&#x27;s own network</text>
  <rect x="170" y="54" width="300" height="112" rx="8" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="320.0" y="78" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">Edge</text>
  <text x="320.0" y="98" text-anchor="middle" fill="#5c6a77" font-size="13">tunnel server and registrar</text>
  <text x="320.0" y="116" text-anchor="middle" fill="#5c6a77" font-size="13">rke2 server and Longhorn</text>
  <text x="320.0" y="134" text-anchor="middle" fill="#5c6a77" font-size="13">market: official edge only</text>
  <rect x="20" y="236" width="190" height="150" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="34" y="262" text-anchor="start" fill="#18212a" font-weight="600">Box A</text>
  <rect x="34" y="276" width="162" height="20" rx="4" fill="#fff" stroke="#9ab" stroke-width="1"/>
  <rect x="34" y="276" width="81.0" height="20" rx="4" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="115.0" y="276" width="48.6" height="20" rx="0" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <text x="34" y="314" text-anchor="start" fill="#0e6e7d" font-size="12" font-weight="600">own</text>
  <text x="119.0" y="314" text-anchor="start" fill="#5c6a77" font-size="12">lent</text>
  <text x="34" y="342" text-anchor="start" fill="#5c6a77" font-size="13">CPU: 23:00 to 07:00</text>
  <text x="34" y="364" text-anchor="start" fill="#5c6a77" font-size="13">and only while idle</text>
  <line x1="115" y1="236" x2="260" y2="166" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <rect x="225" y="236" width="190" height="150" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="239" y="262" text-anchor="start" fill="#18212a" font-weight="600">Box B</text>
  <rect x="239" y="276" width="162" height="20" rx="4" fill="#fff" stroke="#9ab" stroke-width="1"/>
  <rect x="239" y="276" width="61.56" height="20" rx="4" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="300.56" y="276" width="64.8" height="20" rx="0" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <text x="239" y="314" text-anchor="start" fill="#0e6e7d" font-size="12" font-weight="600">own</text>
  <text x="304.56" y="314" text-anchor="start" fill="#5c6a77" font-size="12">lent</text>
  <text x="239" y="342" text-anchor="start" fill="#5c6a77" font-size="13">CPU: never</text>
  <text x="239" y="364" text-anchor="start" fill="#5c6a77" font-size="13">and only while idle</text>
  <line x1="320" y1="236" x2="320" y2="166" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <rect x="430" y="236" width="190" height="150" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="444" y="262" text-anchor="start" fill="#18212a" font-weight="600">Box C</text>
  <rect x="444" y="276" width="162" height="20" rx="4" fill="#fff" stroke="#9ab" stroke-width="1"/>
  <rect x="444" y="276" width="100.44" height="20" rx="4" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <rect x="544.44" y="276" width="32.4" height="20" rx="0" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <text x="444" y="314" text-anchor="start" fill="#0e6e7d" font-size="12" font-weight="600">own</text>
  <text x="548.44" y="314" text-anchor="start" fill="#5c6a77" font-size="12">lent</text>
  <text x="444" y="342" text-anchor="start" fill="#5c6a77" font-size="13">CPU: 01:00 to 06:00</text>
  <text x="444" y="364" text-anchor="start" fill="#5c6a77" font-size="13">and only while idle</text>
  <line x1="525" y1="236" x2="380" y2="166" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <text x="20" y="190" text-anchor="start" fill="#5c6a77" font-size="12">each box opens its</text>
  <text x="20" y="206" text-anchor="start" fill="#5c6a77" font-size="12">tunnel outwards</text>
  <rect x="20" y="404" width="14" height="14" rx="3" fill="#0e6e7d" stroke="#0e6e7d" stroke-width="1"/>
  <text x="42" y="416" text-anchor="start" fill="#5c6a77" font-size="13">this box&#x27;s own files, never in the pool</text>
  <rect x="20" y="432" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#0e6e7d" stroke-width="1"/>
  <text x="42" y="444" text-anchor="start" fill="#5c6a77" font-size="13">lent to the mesh: spare room, replicated across boxes</text>
</svg>
