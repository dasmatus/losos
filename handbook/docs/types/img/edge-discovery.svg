<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#355"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fff"/>
  <rect x="200" y="16" width="240" height="70" rx="8" fill="#e6f2f3" stroke="#0e6e7d" stroke-width="1"/>
  <text x="320.0" y="40" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">This box</text>
  <text x="320.0" y="60" text-anchor="middle" fill="#5c6a77" font-size="13">looks every 20 seconds</text>
  <rect x="20" y="140" width="290" height="100" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="165.0" y="164" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">On this network</text>
  <text x="165.0" y="184" text-anchor="middle" fill="#5c6a77" font-size="13">mDNS: _losos-edge._tcp</text>
  <text x="165.0" y="202" text-anchor="middle" fill="#5c6a77" font-size="13">finds a company edge</text>
  <text x="165.0" y="220" text-anchor="middle" fill="#5c6a77" font-size="13">on the LAN</text>
  <rect x="330" y="140" width="290" height="100" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="475.0" y="164" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">At the configured address</text>
  <text x="475.0" y="184" text-anchor="middle" fill="#5c6a77" font-size="13">losos.proxy.registrarUrl,</text>
  <text x="475.0" y="202" text-anchor="middle" fill="#5c6a77" font-size="13">the LosOS edge unless</text>
  <text x="475.0" y="220" text-anchor="middle" fill="#5c6a77" font-size="13">you change it</text>
  <path d="M260 86 C 260 112, 165 112, 165 138" fill="none" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 86 C 380 112, 475 112, 475 138" fill="none" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="290" width="240" height="70" rx="8" fill="#fff" stroke="#0e6e7d" stroke-width="1"/>
  <text x="320.0" y="314" text-anchor="middle" fill="#18212a" font-size="13" font-weight="600">Found</text>
  <text x="320.0" y="334" text-anchor="middle" fill="#5c6a77" font-size="13">once its /health answers</text>
  <circle cx="420" cy="310" r="9" fill="#2e7357"/>
  <path d="M415.5 310l3 3 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 240 C 165 266, 260 264, 260 288" fill="none" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <path d="M475 240 C 475 266, 380 264, 380 288" fill="none" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="384" text-anchor="middle" fill="#a8443c" font-size="13">None found: sharing cannot be turned on until one is.</text>
</svg>
