<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#355"/>
    </marker>
  </defs>
  <rect width="920" height="250" fill="#fff"/>
  <g>
    <rect x="20" y="40" width="160" height="90" rx="8" fill="#e6f2f3" stroke="#0e6e7d"/>
    <text x="100" y="66" text-anchor="middle" font-weight="600">Popis systému</text>
    <text x="100" y="88" text-anchor="middle" fill="#345">flake + overrides.nix</text>
    <text x="100" y="108" text-anchor="middle" fill="#345">+ install-target.nix</text>

    <rect x="240" y="40" width="160" height="90" rx="8" fill="#fff" stroke="#0e6e7d"/>
    <text x="320" y="66" text-anchor="middle" font-weight="600">Zostavenie</text>
    <text x="320" y="88" text-anchor="middle" fill="#345">nixos-rebuild</text>
    <text x="320" y="108" text-anchor="middle" fill="#345">(z cache alebo lokálne)</text>

    <rect x="460" y="40" width="160" height="90" rx="8" fill="#fff" stroke="#0e6e7d"/>
    <text x="540" y="66" text-anchor="middle" font-weight="600">Prepnutie</text>
    <text x="540" y="88" text-anchor="middle" fill="#345">nová generácia</text>
    <text x="540" y="108" text-anchor="middle" fill="#345">stará ostáva v boot menu</text>

    <rect x="680" y="40" width="220" height="90" rx="8" fill="#fff" stroke="#0e6e7d"/>
    <text x="790" y="66" text-anchor="middle" font-weight="600">Reštart 00:07</text>
    <text x="790" y="88" text-anchor="middle" fill="#345">koreň tmpfs nanovo,</text>
    <text x="790" y="108" text-anchor="middle" fill="#345">/persist pripojený späť</text>

    <line x1="180" y1="85" x2="240" y2="85" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
    <line x1="400" y1="85" x2="460" y2="85" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
    <line x1="620" y1="85" x2="680" y2="85" stroke="#355" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g fill="#345">
    <text x="20" y="175" font-weight="600" fill="#0e6e7d">Rovnaká cesta pre tri udalosti:</text>
    <text x="20" y="200">• majiteľ stlačí Použiť v administrácii (lososd spustí losos-rebuild-&lt;job&gt;)</text>
    <text x="20" y="222">• nočná aktualizácia o 03:00 (system.autoUpgrade zo zdroja losos.upgradeFlakeUri)</text>
    <text x="20" y="244">• obnovenie továrenského nastavenia (prázdny overrides.nix)</text>
  </g>
</svg>
