# Keeps the newest release's download link alive.
#
# buzzheavier's free tier keeps a file for 8 days, adds 2 days per download
# (capped at 60), and only makes it permanent after 30 downloads inside 60
# days. An appliance ISO will not see 30 downloads, so without this workflow
# every published download link dies about a week after the release.
#
# So: re-upload the newest release's image and rewrite that release's body with
# the new link. Older releases are left to expire; their bodies keep the
# sha256, so an old release stays verifiable even once it stops being
# downloadable.
#
# Twice a week, NOT weekly. The floor is 8 days and a weekly run leaves one day
# of margin, so one failed run kills the link. Mon+Thu leaves 3-4 day gaps.
#
# Separate file rather than a job in ci.yml because ci.yml's schedule is the
# weekly lane; a shared cron would run that twice, and telling two crons apart
# inside one workflow needs github.event.schedule, whose Forgejo support is
# unverified here.
#
# This workflow NEVER builds. It reads the store path recorded in the release's
# release.json and substitutes it, so the cost is one download plus one upload
# — which is the least this can take from a shared, donation-funded runner.
# The 3.5-minute rebuild would also fit, but it would spend CPU to reproduce
# bytes the cache already has.
name: refresh

on:
  schedule:
    - cron: "57 3 * * 1,4"
  workflow_dispatch:

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://losos.cachix.org
    extra-trusted-public-keys = losos.cachix.org-1:4t3mjPiiE7RZHBk3znPi0mq4uP5RY630YXAapAWe708=
    connect-timeout = 5
    fallback = true
  BUZZ_PARENT_ID: ${{ vars.BUZZ_PARENT_ID }}
  BUZZ_LOCATION_ID: ${{ vars.BUZZ_LOCATION_ID }}

jobs:
  refresh:
    name: "refresh: re-upload the newest release image"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    timeout-minutes: 120
    steps:
      # The nix image ships neither node nor jq: node for actions/checkout,
      # jq for the release API and the buzzheavier responses.
      - run: nix profile install nixpkgs#nodejs nixpkgs#jq
      - uses: actions/checkout@v4
      - name: assert the buzzheavier credentials are present
        env:
          TOKEN: ${{ secrets.BUZZHEAVIER_TOKEN }}
        run: |
          set -eu
          test -n "${TOKEN:-}" || {
            echo "::error::BUZZHEAVIER_TOKEN is unset — the refresh would silently do nothing and the live download link would expire" >&2
            exit 1
          }
          test -n "${BUZZ_PARENT_ID:-}" || {
            echo "::error::BUZZ_PARENT_ID is unset" >&2
            exit 1
          }
      - name: find the newest release
        id: rel
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          T="${TOKEN:-$TOKEN_ALT}"
          curl -fsS -H "authorization: token $T" "$API/releases?limit=1" -o /tmp/rels.json
          if [ "$(jq 'length' /tmp/rels.json)" = "0" ]; then
            echo "::notice::no releases yet — nothing to refresh"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(jq -r '.[0].tag_name' /tmp/rels.json)
          url=$(jq -r '.[0].assets[]? | select(.name == "release.json") | .browser_download_url' /tmp/rels.json | head -1)
          if [ -z "$url" ]; then
            echo "::error::release $tag has no release.json asset — it predates this workflow, or the release lane failed to attach it. Re-run the release lane for $tag, or refresh it by hand." >&2
            exit 1
          fi
          curl -fsSL "$url" -o /tmp/release.json
          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "iso=$(jq -r .iso /tmp/release.json)"
            echo "sha256=$(jq -r .sha256 /tmp/release.json)"
            echo "storePath=$(jq -r .storePath /tmp/release.json)"
          } >> "$GITHUB_OUTPUT"
          echo "refreshing ${tag}"
      # `nix copy --from` substitutes or fails; it never builds. If this errors
      # the image has been evicted from the cache, and the fix is to re-run the
      # release lane for that tag.
      - name: substitute the image from the cache
        if: steps.rel.outputs.skip != 'true'
        env:
          STORE_PATH: ${{ steps.rel.outputs.storePath }}
          WANT_SUM: ${{ steps.rel.outputs.sha256 }}
          ISO_NAME: ${{ steps.rel.outputs.iso }}
        run: |
          set -euo pipefail
          nix copy --from https://losos.cachix.org "$STORE_PATH"
          cp -L "$STORE_PATH"/iso/*.iso "./${ISO_NAME}"
          got=$(sha256sum "$ISO_NAME" | cut -d' ' -f1)
          if [ "$got" != "$WANT_SUM" ]; then
            echo "::error::substituted image does not match the release: want $WANT_SUM, got $got" >&2
            exit 1
          fi
          echo "substituted ${ISO_NAME}, sha256 verified against the release"
      - id: publish
        if: steps.rel.outputs.skip != 'true'
        uses: ./.forgejo/actions/publish-buzz
        with:
          file: ${{ steps.rel.outputs.iso }}
          filename: ${{ steps.rel.outputs.iso }}
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          location-id: ${{ env.BUZZ_LOCATION_ID }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}
      - name: compose the release body
        id: body
        if: steps.rel.outputs.skip != 'true'
        env:
          ISO_NAME: ${{ steps.rel.outputs.iso }}
          ISO_URL: ${{ steps.publish.outputs.url }}
          ISO_SUM: ${{ steps.publish.outputs.sha256 }}
          ISO_SIZE: ${{ steps.publish.outputs.size }}
        run: |
          set -euo pipefail
          human=$(awk -v b="$ISO_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          {
            echo "body<<RELEASE_BODY_EOF"
            cat <<BODY
          ### Download

          **[${ISO_NAME}](${ISO_URL})** — ${human}

          \`\`\`
          sha256  ${ISO_SUM}
          \`\`\`

          Verify against the \`.sha256\` attached below:

          \`\`\`sh
          sha256sum -c ${ISO_NAME}.sha256
          \`\`\`

          Write it to a USB stick and boot the target machine; the installer
          partitions, encrypts and installs unattended.

          ---

          The image is hosted off-forge rather than attached here, because one
          ISO is Codeberg's entire recommended allowance for packages, LFS and
          attachments. That link is refreshed automatically and may still lapse
          — if it has, build the same image from this tag with
          \`nix build .#nixosConfigurations.iso.config.system.build.isoImage\`.
          BODY
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      # patch mode replaces the body outright, so the dead link is gone from the
      # page rather than left above the new one.
      - if: steps.rel.outputs.skip != 'true'
        uses: ./.forgejo/actions/forgejo-release
        with:
          tag: ${{ steps.rel.outputs.tag }}
          body: ${{ steps.body.outputs.body }}
          mode: patch
          token: ${{ secrets.FORGEJO_TOKEN }}
          token-alt: ${{ secrets.GITHUB_TOKEN }}
      # keep: 1 — the previous upload of this same image is a dead duplicate.
      - if: steps.rel.outputs.skip != 'true'
        uses: ./.forgejo/actions/prune-buzz
        with:
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          prefix: ${{ steps.rel.outputs.iso }}
          keep: "1"
          keep-id: ${{ steps.publish.outputs.id }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}
