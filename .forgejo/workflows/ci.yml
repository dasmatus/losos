on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ~03:57 UTC Mondays (off the :00 mark).
    - cron: "57 3 * * 1"
  workflow_dispatch:

# Codeberg's hosted runners hard-cap every job at 10 minutes of wall clock
# (codeberg-medium: 4 CPU / 8 GB RAM, and the RAM quota *includes filesystem
# writes* — https://codeberg.org/actions/meta). The installer ISO build
# (~300 derivations, 1.9 GiB fetched, >4 GiB written) cannot fit that
# envelope on time or on disk-as-RAM, so it stays a local gate alongside the
# four VM tests, which need /dev/kvm the runners do not provide:
#   devenv shell build-iso
#   devenv shell vm-tests
#
# Every job runs through devenv (devenv.nix), so CI and a developer's shell
# execute byte-identical commands — the `lint`, `test-rust`, `check-flake`,
# `check-eval` and `build-pkgs` scripts are defined once and invoked from
# both. devenv is wired through the flake, so there is a single flake.lock
# and no separate devenv.lock pinning its own nixpkgs.
#
# Every job repeats the nodejs install because each gets a fresh container:
# the runner execs JS actions (actions/checkout) with `node` from inside the
# container, and the nix image ships none — without it, checkout itself
# fails. Not used by the repo's own code.
#
# NOTE ON COST: routing the build jobs through the devenv shell means each
# one realises the dev toolchain (rustc, cargo, clippy, rustfmt,
# rust-analyzer, nodejs, bun, the three Nix linters) before it does any
# work. That is a real addition to jobs that previously fetched only what
# `nix build` needed. If a job starts timing out at 10 minutes, the fix is to
# split the dev toolchain out of the CI path rather than to raise the cap —
# the cap is not raisable.

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  devenv-test:
    name: "devenv test: lint + unit tests + eval gates"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      - run: nix profile install nixpkgs#devenv
      # Runs enterTest from devenv.nix: rustfmt --check and clippy
      # -D warnings on both crates, both unit-test suites, `nix flake check`,
      # and a forced module merge of both nixosConfigurations.
      #
      # That last one is the gate this repo lacked entirely: `flake check`
      # only forces each nixosConfiguration's toplevel *derivation*, so an
      # option conflict, a type error or a failed assertion inside the module
      # merge passed CI unnoticed.
      #
      # The lint half is also new. Until it existed nothing anywhere ran the
      # two commands CLAUDE.md documents as gates — buildRustPackage's
      # doCheck runs the test suite, not the linters — and backend-registrar
      # had drifted to 17 rustfmt hunks plus a clippy error as a result.
      - run: devenv test

  packages:
    name: "devenv: build all three flake packages"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      - run: nix profile install nixpkgs#devenv
      # `build-pkgs` builds losos-ctl, losos-registrar and losos-admin-ui.
      # Both Rust crates run their full `cargo test` suite inside the build
      # (buildRustPackage doCheck), which is the slow part: losos-ctl alone
      # was ~8 of the 10 minutes with a cold store. Keep this job lean, and
      # re-time it before adding any heavy dependency to either Cargo.toml.
      - run: devenv shell build-pkgs

  iso-eval:
    name: "nix: ISO derivation evaluates"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # Deliberately NOT through devenv: this forces one derivation and needs
      # no toolchain, so paying for the dev shell here would buy nothing.
      # `flake check` does not reach the ISO image derivation, so without
      # this an eval-reachable regression in the iso block or isoImage.*
      # would only surface in the local-only ISO build.
      - run: nix path-info --derivation .#nixosConfigurations.iso.config.system.build.isoImage
