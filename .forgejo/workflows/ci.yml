on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ~03:57 UTC Mondays (off the :00 mark; see Justfile ethos)
    - cron: "57 3 * * 1"
  workflow_dispatch:

jobs:
  nix-eval:
    name: "nix: flake check + ISO build"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      # Evaluates every output incl. both VM test derivations; builds nothing.
      - run: nix --experimental-features 'nix-command flakes' flake check --no-build -L
      # Build the installer ISO (the reinstall medium); skip the slow
      # losos-install VM test (`nix build .#checks.x86_64-linux.losos-install`).
      - run: nix --experimental-features 'nix-command flakes' build .#nixosConfigurations.iso.config.system.build.isoImage -L
      - name: Release
        uses: https://github.com/softprops/action-gh-release@v3
        if: forgejo.ref_type == 'rel'
