on:
  push:
    branches: [main]
    # Tags build and publish the installer ISO; see the iso job. Pushes to
    # main build it too, as a gate, but do not publish it.
    tags: ["v*"]
  pull_request:
  schedule:
    # ~03:57 UTC Mondays (off the :00 mark).
    - cron: "57 3 * * 1"
  workflow_dispatch:

# Codeberg's hosted runners hard-cap every job at 10 minutes of wall clock
# (codeberg-medium: 4 CPU / 8 GB RAM, and the RAM quota *includes filesystem
# writes* — https://codeberg.org/actions/meta).
#
# CI does NOT go through devenv, and that is a measured decision rather than a
# preference. Routing these jobs through `devenv shell` was tried and failed:
# every job first realises the whole dev toolchain — rustc, cargo, clippy,
# rustfmt, rust-analyzer, nodejs, bun, nixfmt, deadnix, statix, plus the
# interactive shell packages — before doing any work of its own. Measured on
# this repo:
#
#   devenv test                      9m31s  failed
#   devenv shell build-pkgs         10m05s  cancelled at the cap
#   nix path-info (no devenv)        1m32s  success
#
# So the commands below are spelled out directly. They are the same commands
# devenv.nix defines as `lint`, `test-rust`, `check-flake`, `check-eval`,
# `build-pkgs` and — for two of its three images — `build-images`, and the two
# must be kept in step by hand. That duplication is the price of fitting the
# cap. `devenv test` remains the local one-shot equivalent, and the pre-commit
# hooks run the lint half before a commit ever reaches here.
#
# The nixos-test VMs stay local-only — they need /dev/kvm, which these runners
# do not provide:
#   devenv shell vm-tests
#
# Neither this file nor devenv.nix names those VMs any more: `vm-tests` reads
# the list out of `.#checks.x86_64-linux`, because the hand-kept version of it
# had drifted to four names against six checks and skipped the two that the
# k3s/fscrypt rework broke. Do not reintroduce a literal list in either place.
#
# The installer ISO used to be local-only too, on the grounds that it fit
# "neither the time nor the disk-as-RAM budget". Measured, that was wrong on
# both counts: writes come to ~4.7 GiB against a 10 GiB quota (8 GiB RAM plus
# 2 GiB temp), and squashfs + xorriso take 50 s on four cores. The original
# figure was taken against the default zstd level 19, which OOM-killed the
# job; flake.nix already drops it to level 6 with a 1 GiB cap.
#
# What actually made it impossible was one path. The ISO closure is 769 store
# paths: 766 stock nixpkgs that cache.nixos.org serves, and three of ours, of
# which losos-ctl is the only expensive one — 9 minutes to compile. The iso
# job therefore takes it from the losos-ctl job as a 12 MiB artifact rather
# than building it, and each job stays inside its own 10-minute budget.
#
# The iso job publishes the image as an artifact on a tag or a manual run,
# never on an ordinary push. The image is ~1.5 GB and Codeberg asks that you
# request resources before exceeding "1.5 GiB of packages, LFS and
# attachments", so one ISO is the entire recommended budget; uploading one per
# commit would be antisocial on a donation-funded host. The build still runs
# on every push as a gate — only the upload is rationed.
#
# clippy and test are separate jobs. As one they ran 9.9-10.1 minutes and were
# cancelled at the cap on about half of all pushes: clippy type-checks and
# emits .rmeta while cargo test needs linked binaries, so a single job compiles
# the local crates twice. Apart, each pays the toolchain realisation once plus
# one compile. Do not merge them again to "save a job" — the runners charge by
# the job's wall clock, not by the number of jobs.
#
# fmt-bot reformats and pushes back on every push to main, so rustfmt is
# never something a human has to fix by hand. Its commit carries [skip ci] —
# one of Forgejo's SKIP_WORKFLOW_STRINGS defaults — because otherwise the
# push retriggers this whole workflow to reformat nothing. Consequently the
# clippy job only *checks* rustfmt on pull requests: checking it on a push too
# would leave a red job on a commit the bot repairs seconds later.
#
# clippy is deliberately NOT auto-fixed the same way. `cargo clippy --fix`
# rewrites code rather than whitespace, so it can change behaviour and
# sometimes wants human judgement; it stays a gate that fails loudly.
#
# Every nix job repeats the nodejs install because each gets a fresh
# container: the runner execs JS actions (actions/checkout) with `node` from
# inside the container, and the nix image ships none — without it, checkout
# itself fails. Not used by the repo's own code.

# CI both fills losos.cachix.org and reads from it. The push half is per-job
# (see .forgejo/actions/cachix-push); this is the pull half, and it is worth as
# much: without it every job rebuilds our own paths from source even when an
# earlier run already pushed an identical one, which for losos-ctl alone is
# ~9 minutes against a 10-minute cap.
#
# `extra-substituters`, never plain `substituters` — replacing the list would
# drop cache.nixos.org, which serves the overwhelming majority of any closure
# here, and trade a small win for a very large loss. Same reasoning, and the
# same key, as modules/cache.nix on the appliance; if they ever disagree the
# appliance's copy is the one that matters and this is the stale one.
#
# Reaching the daemon is not a concern in this container: docker.io/nixos/nix
# runs single-user as root, so settings arriving by NIX_CONFIG are applied
# rather than discarded as coming from an untrusted client. On a runner that
# DID have a daemon, a substituter set this late would be ignored with a
# warning and the job would quietly build from source instead — which is why
# the losos-ctl job prints `nix config show` before it builds.
env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://losos.cachix.org
    extra-trusted-public-keys = losos.cachix.org-1:4t3mjPiiE7RZHBk3znPi0mq4uP5RY630YXAapAWe708=
    connect-timeout = 5
    fallback = true
  # Not secret: a buzzheavier directory id is meaningless without the account
  # token, and the region id is public (GET /api/locations). Set both under
  # Settings -> Actions -> Variables.
  BUZZ_PARENT_ID: ${{ vars.BUZZ_PARENT_ID }}
  BUZZ_LOCATION_ID: ${{ vars.BUZZ_LOCATION_ID }}

jobs:
  clippy:
    name: "rust: clippy (+ rustfmt on PRs)"
    runs-on: codeberg-medium
    # clippy and the test suites are two jobs, not one, and the split is
    # measured rather than cosmetic. Together they ran 9.9-10.1 minutes and
    # were cancelled at the cap on roughly half of all pushes, because clippy
    # and cargo test do not share build artifacts: clippy type-checks and
    # emits .rmeta, test needs linked binaries, so one job compiles the local
    # crates twice. Apart, each pays the toolchain realisation once plus a
    # single compile.
    #
    # Runs in devShells.ci — a lean cargo/rustc/clippy/rustfmt shell from this
    # flake's pinned nixpkgs, i.e. the SAME rustc buildRustPackage compiles
    # with. This job first ran on docker.io/rust:latest and went red in 42
    # seconds on a tree that both the pinned toolchain and the maintainer's
    # local one call clean. `latest` floats, so an upstream Rust release could
    # turn CI red with no change here, and the linter would disagree with the
    # compiler that actually ships.
    #
    # Not devenv: it realises the entire dev toolchain (rust-analyzer, node,
    # bun, three Nix linters, shell UX) and blew the cap at 9m31s.
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # Check-only, always. `cargo clippy --fix` rewrites code rather than
      # whitespace, so it can change behaviour and sometimes wants human
      # judgement; unreviewed code changes have no business landing on main by
      # robot. Contrast fmt-bot below, which only reformats.
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path backend-registrar/Cargo.toml --all-targets -- -D warnings
          '
      # rustfmt is only *checked* on pull requests. On a push to main fmt-bot
      # fixes it instead — checking it here too would mean this job goes red
      # for something another job repairs a minute later, leaving a permanent
      # failure on a commit that is already fine.
      - name: rustfmt (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo fmt --manifest-path backend/Cargo.toml --check
            cargo fmt --manifest-path backend-registrar/Cargo.toml --check
          '

  test:
    name: "rust: test both crates"
    runs-on: codeberg-medium
    # The suites live here rather than inside buildRustPackage. doCheck used to
    # run them, but it also recompiles each crate in test configuration and
    # links a binary per test target, which pushed `nix build .#losos-ctl` to
    # 7.7-10.3 minutes against the cap. Mirrors devenv.nix's `test-rust`.
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo test --manifest-path backend/Cargo.toml
            cargo test --manifest-path backend-registrar/Cargo.toml
          '

  eval:
    name: "nix: flake check + module merge + ISO derivation"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # Mirrors devenv.nix's `check-flake`. Evaluates every output — every VM
      # test derivation, both nixosConfigurations and every package, the three
      # OCI images among them; builds nothing. Which is the limit of it: an
      # image whose entrypoint fails shellcheck evaluates perfectly happily,
      # and only the images job below catches that.
      - run: nix flake check --no-build -L
      # Mirrors devenv.nix's `check-eval`, and this is the gate the repo
      # lacked entirely: `flake check` only forces each nixosConfiguration's
      # toplevel *derivation*, so an option conflict, a type error or a failed
      # assertion inside the module merge passed CI unnoticed. Forcing the
      # drvPath forces the merge.
      - run: nix eval --raw .#nixosConfigurations.install.config.system.build.toplevel.drvPath
      - run: nix eval --raw .#nixosConfigurations.iso.config.system.build.toplevel.drvPath
      # `flake check` does not reach the ISO *image* derivation, so without
      # this an eval-reachable regression in the iso block or isoImage.* would
      # surface only in the local-only ISO build.
      - run: nix path-info --derivation .#nixosConfigurations.iso.config.system.build.isoImage

  losos-ctl:
    name: "rust: lososd + losos-ctl build & tests"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # Proof the substituter in this workflow's NIX_CONFIG was actually taken,
      # printed in the one job where losing it is most expensive (~9 minutes of
      # rustc). Nix does not fail when it declines a substituter from an
      # untrusted client — it warns and builds from source — so "the cache is
      # configured" and "the cache is in use" are different claims, and only
      # this step distinguishes them. Never a gate: a missing cache must slow
      # the build, not fail it.
      - name: show effective nix config
        run: nix config show | grep -E 'substituters|trusted-public-keys|trusted-users' || true
      # Compiles the shipping binaries only — doCheck is off, and the suite
      # runs in the lint job instead (see flake/packages.nix for why). Even
      # so this is the longest job here; keep it to one package and re-time it
      # before adding any heavy dependency to backend/Cargo.toml.
      - run: nix build .#losos-ctl -L
      # Hand losos-ctl to the iso job. Of the 769 store paths in the ISO's
      # closure, 766 are stock nixpkgs that cache.nixos.org serves, and three
      # are ours; losos-ctl is the only one that costs anything to produce.
      # Exporting its closure to a file:// binary cache is 12 MiB and ~13 s,
      # which is what lets the iso job exist at all: without it that job would
      # have to compile this crate itself and blow the 10-minute cap.
      # Publish to the binary cache the appliance substitutes from.
      #
      # modules/cache.nix points every installed box AND every installer medium at
      # https://losos.cachix.org, and the things it cannot get from cache.nixos.org
      # are exactly ours: losos-ctl, the registrar, the admin UI and the three images. Until something pushed them
      # that substituter was an empty promise, and a fresh install fell back to
      # building them on a repurposed mini-PC.
      #
      # Skipping rather than failing when the secret is absent is the
      # action's behaviour now; see .forgejo/actions/cachix-push.
      - uses: ./.forgejo/actions/cachix-push
        with:
          installables: ".#losos-ctl"
          token: ${{ secrets.CACHIX_KEY }}
      - run: nix copy --to "file://$PWD/ctl-cache" --no-check-sigs .#losos-ctl
      - uses: actions/upload-artifact@v3
        with:
          name: losos-ctl-store
          path: ctl-cache
          retention-days: 1

  registrar-and-ui:
    name: "rust: losos-registrar + admin UI"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # Compiles only; the registrar's 42 tests run in the lint job.
      # losos-admin-ui is a buildNpmPackage: `npm ci` from the committed
      # package-lock.json, then `tsc --noEmit && vite build`. So this step is
      # also the typecheck gate for admin-ui/app, and the one place in CI that
      # proves the npm dependency fetch still resolves.
      - run: nix build .#losos-registrar .#losos-admin-ui -L
      # Publish to the binary cache the appliance substitutes from.
      #
      # modules/cache.nix points every installed box AND every installer medium at
      # https://losos.cachix.org, and the things it cannot get from cache.nixos.org
      # are exactly ours: losos-registrar and losos-admin-ui. Until something pushed them
      # that substituter was an empty promise, and a fresh install fell back to
      # building them on a repurposed mini-PC.
      #
      # Skipping rather than failing when the secret is absent is the
      # action's behaviour now; see .forgejo/actions/cachix-push.
      - uses: ./.forgejo/actions/cachix-push
        with:
          installables: ".#losos-registrar .#losos-admin-ui"
          token: ${{ secrets.CACHIX_KEY }}
      # Export the built SPA for the `iso` job, exactly as the losos-ctl job
      # exports its crate and for the same reason. flake.nix puts
      # losos-admin-ui in isoImage.storeContents, so before this existed the
      # ISO job would have run `npm ci` + vite itself — a second npm fetch
      # inside a ten-minute cap, on a job that already spends 3.5 minutes.
      #
      # Cheap to carry: a dist/ tree with no store references, ~1 MiB against
      # losos-ctl's 12 MiB, so the copy is seconds.
      #
      # This artifact, unlike the cachix push above, is NOT gated on a secret:
      # a fork's ISO job must still get the bundle, or it goes red for want of
      # a key the contributor cannot have.
      - run: nix copy --to "file://$PWD/ui-cache" --no-check-sigs .#losos-admin-ui
      - uses: actions/upload-artifact@v3
        with:
          name: losos-admin-ui-store
          path: ui-cache
          retention-days: 1


  images:
    name: "nix: OCI images for the local cluster"
    runs-on: codeberg-medium
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # The cheap two thirds of devenv.nix's `build-images`.
      #
      # These are the images modules/defaults.nix wires into losos.workloads.*,
      # and the appliance is *required* to substitute them: it never builds an
      # image itself. A broken one therefore surfaces during
      # system.autoUpgrade at 03:00 on a repurposed mini-PC with a tmpfs root
      # and no shell, three hours before an unconditional reboot — which is to
      # say it surfaces as a box that stopped serving, with nothing to read.
      # The eval job cannot catch it: evaluation does not run the shellcheck
      # that writeShellApplication performs at build time, and does not notice
      # a buildEnv whose paths collide.
      #
      # Measured on a dev machine: losos-image-pause is a 51 MiB tarball over a
      # handful of paths, losos-image-forgejo a 585 MiB tarball over a 647 MiB
      # / 126-path content closure. Both sit far inside the ISO job's measured
      # 4.7 GiB of writes against the 10 GiB quota (8 GiB RAM + 2 GiB temp; on
      # these runners filesystem writes count as RAM).
      - run: nix build .#losos-image-pause .#losos-image-forgejo -L
      # Publish to the binary cache the appliance substitutes from.
      #
      # modules/cache.nix points every installed box AND every installer medium at
      # https://losos.cachix.org, and the things it cannot get from cache.nixos.org
      # are exactly ours: the OCI images the local cluster runs. Until something pushed them
      # that substituter was an empty promise, and a fresh install fell back to
      # building them on a repurposed mini-PC.
      #
      # Skipping rather than failing when the secret is absent is the
      # action's behaviour now; see .forgejo/actions/cachix-push.
      - uses: ./.forgejo/actions/cachix-push
        with:
          installables: ".#losos-image-pause .#losos-image-forgejo"
          token: ${{ secrets.CACHIX_KEY }}

      # losos-image-nextcloud is NOT built here, and since it is the image most
      # likely to break, that is a real hole and not an oversight.
      #
      # Measured, not estimated: the tarball is 606 MiB, built in 34 s from a
      # warm store. That is within a rounding error of losos-image-forgejo's
      # 585 MiB, which this job does build, so the earlier guess here that it
      # would add "~2 GiB of tarball" was wrong by a factor of three and is
      # corrected rather than left standing.
      #
      # Size is therefore not the objection. The objection is the download: the
      # content closure is 2.3 GiB across 244 store paths (nextcloud34 with
      # ~30 apps, php-with-extensions, apacheHttpd) against Forgejo's 647 MiB,
      # so on a cold runner this job fetches roughly 3.5x what it fetches today,
      # from cache.nixos.org, inside a 10-minute cap. That number cannot be
      # measured on a machine that already has the closure, and it is the one
      # that decides whether this fits.
      #
      # Guessing that number is how this repository got burned twice already,
      # once in each direction: doCheck stayed on until `nix build .#losos-ctl`
      # turned out to be a 7.7-10.3 minute coin flip that cancelled runs on
      # unmodified main, and the ISO was excluded as fitting "neither the time
      # nor the disk-as-RAM budget" on a figure measured against zstd level 19,
      # when at level 6 it builds in 3.5 minutes. So: time it on a branch with
      # workflow_dispatch before adding it to this run, rather than landing a
      # job that may cancel every push at the cap.
      #
      # Until then the Nextcloud image's only gate is local:
      #   devenv shell build-images

  # ── The Nextcloud image, on request ───────────────────────────────────────
  #
  # workflow_dispatch only, and that is the whole design rather than a
  # compromise.
  #
  # The appliance is *required* to substitute this image: it never builds one.
  # So a cache that does not have it is worse than no cache at all — the box
  # discovers the gap during system.autoUpgrade at 03:00, on a mini-PC with a
  # tmpfs root and no shell, three hours before an unconditional reboot. The
  # `images` job cannot close that, because it runs on every push and this
  # image's content closure is 2.3 GiB from a cold runner against a 10-minute
  # cap — the number nobody has measured, and the note in that job explains at
  # length why this repository does not guess it again.
  #
  # But the image does not need building on every push. It changes only when
  # modules/nextcloud-stack.nix or flake/images.nix changes, which is rarely,
  # and once it is in the cache every appliance substitutes it. So this runs
  # when somebody asks for it, and prints its own timing so the number that
  # decides whether it could ever join the `images` job gets measured rather
  # than estimated.
  #
  # If it times out, that is the answer: it does not fit, and the local
  # `devenv shell build-images` plus a manual `cachix push` is the path.
  image-nextcloud:
    name: "nix: Nextcloud image -> cachix (manual)"
    runs-on: codeberg-medium
    if: ${{ github.event_name == 'workflow_dispatch' }}
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
      # require-token, unlike the three lanes above: there is no point
      # spending ten minutes building an image with nowhere to put it.
      - uses: ./.forgejo/actions/cachix-push
        with:
          installables: ".#losos-image-nextcloud"
          build-args: "-L"
          require-token: "true"
          token: ${{ secrets.CACHIX_KEY }}

  fmt-bot:
    name: "bot: cargo fmt, push back"
    runs-on: codeberg-medium
    # Pushes to a BRANCH only. Two exclusions, both deliberate:
    #
    # Not pull requests: on one from a fork the automatic token is read-only,
    # and pushing to somebody else's branch is not this job's business anyway
    # — the lint job checks formatting there instead.
    #
    # Not tags: a tag push is also a push event, and github.ref_name is then
    # the tag, so the commit-and-push below would try to move a tag rather
    # than a branch. Reformatting a released tag would be wrong even if it
    # worked.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    container:
      image: docker.io/nixos/nix:latest
    steps:
      - run: nix profile install nixpkgs#nodejs
      - uses: actions/checkout@v4
        with:
          # Check out the branch, not the detached commit: a detached HEAD has
          # nothing to commit onto.
          ref: ${{ github.ref_name }}
          # Forgejo creates this per run and it carries write access on push
          # events, so no hand-made secret is needed.
          token: ${{ secrets.FORGEJO_TOKEN }}
      # Same toolchain as the lint job and as buildRustPackage — devShells.ci
      # from this flake's pinned nixpkgs. Formatting with a different rustfmt
      # than CI checks with is how you get a bot that fights its own linter.
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo fmt --manifest-path backend/Cargo.toml
            cargo fmt --manifest-path backend-registrar/Cargo.toml
          '
      - name: commit and push if anything changed
        env:
          # FORGEJO_TOKEN is the documented name; GITHUB_TOKEN is the
          # compatibility alias. Take whichever this instance populates.
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already formatted; nothing to do"
            exit 0
          fi
          echo "rustfmt changed:"
          git --no-pager diff --stat

          git config user.name  "losos-fmt-bot"
          git config user.email "losos-fmt-bot@noreply.codeberg.org"

          # [skip ci] is load-bearing: without it this push retriggers the
          # workflow, which reformats nothing, finds no diff and exits — but
          # burns a full set of runners every time. With a rule that did keep
          # producing a diff it would be an endless loop. The string is one of
          # Forgejo's SKIP_WORKFLOW_STRINGS defaults ([skip ci], [ci skip],
          # [no ci], [skip actions], [actions skip]).
          git commit -am "style: cargo fmt [skip ci]"

          T="${TOKEN:-$TOKEN_ALT}"
          if [ -z "$T" ]; then
            echo "no write token in the secrets context; cannot push" >&2
            exit 1
          fi
          # set-url rather than echoing a URL, so the token never reaches the log.
          git remote set-url origin \
            "https://x-access-token:${T}@codeberg.org/${GITHUB_REPOSITORY}.git"
          # A human push landing between checkout and here makes this a
          # non-fast-forward. Rebasing our one mechanical commit on top is
          # always safe: it touches only formatting.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  iso:
    name: "nix: build the installer ISO"
    runs-on: codeberg-medium
    # Needs losos-ctl's store export. Without it this job would rebuild that
    # crate from source — 9 minutes on its own — and never finish in time.
    #
    # And registrar-and-ui's, for the same reason at smaller scale: flake.nix
    # carries losos-admin-ui in isoImage.storeContents, and since that stopped
    # being a file copy it is the second path in this closure cache.nixos.org
    # cannot serve.
    needs: [losos-ctl, registrar-and-ui]
    container:
      image: docker.io/nixos/nix:latest
    steps:
      # jq parses the release API responses in the last step; the nix
      # image ships neither it nor node.
      - run: nix profile install nixpkgs#nodejs nixpkgs#jq
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: losos-ctl-store
          path: ctl-cache
      - uses: actions/download-artifact@v3
        with:
          name: losos-admin-ui-store
          path: ui-cache
      # --no-check-sigs because the exporting job signed nothing; the artifacts
      # came from sibling jobs in this same workflow run, not from a public
      # cache, so there is no third party to authenticate.
      - run: nix copy --from "file://$PWD/ctl-cache" --no-check-sigs --all
      - run: nix copy --from "file://$PWD/ui-cache" --no-check-sigs --all
      # NOT --offline. The other 766 paths come from cache.nixos.org, and
      # blocking the network would force nix to build them from source —
      # precisely the opposite of what the import above buys us.
      #
      # Measured locally, with everything else substituted and throttled to
      # this runner's 4 cores, squashfs + xorriso take 50 s and the build
      # writes ~4.7 GiB against a 10 GiB quota (8 GiB RAM + 2 GiB temp; on
      # these runners filesystem writes count as RAM). The old claim that the
      # ISO "fits neither the time nor the disk-as-RAM budget" was measured
      # against the default zstd level 19, which OOM-killed the job; level 6
      # with a 1 GiB cap is already set in flake.nix and changes the picture.
      - run: nix build .#nixosConfigurations.iso.config.system.build.isoImage -L

      # Publishing is gated on tags, NOT on every push. The original reason
      # was Codeberg's "1.5 GiB of packages, LFS and attachments" ceiling,
      # which a single ISO spent in full. That argument is retired: the image
      # goes to buzzheavier now and only the ~100-byte checksum and a small
      # release.json are attached here. What remains is the plainer reason —
      # a 1.5 GB upload per commit to any free host is antisocial.
      #
      # The build above still runs on every push: that is the gate, and it is
      # cheap (3.5 min). Only the upload is rationed.
      #
      # The download link is NOT permanent. buzzheavier's free tier keeps a
      # file for 8 days, adds 2 days per download, and only makes it permanent
      # after 30 downloads inside 60 days — which an appliance ISO will not
      # see. .forgejo/workflows/refresh.yml re-uploads the newest release's
      # image twice a week to keep its link alive. Delete that workflow and
      # every published download link dies within about a week.
      - name: stage the image
        id: stage
        if: startsWith(github.ref, 'refs/tags/')
        # cp -L dereferences: `result` is a symlink into /nix/store, and the
        # upload would otherwise send the link rather than the image. The tag
        # goes in the filename because the prune step matches on a prefix and
        # because two releases must not collide in one buzzheavier directory.
        run: |
          set -euo pipefail
          name="losos-installer-${GITHUB_REF_NAME}.iso"
          cp -L result/iso/*.iso "./${name}"
          ls -lh "$name"
          sha256sum "$name" | tee "${name}.sha256"
          {
            echo "name=${name}"
            echo "storePath=$(readlink -f result)"
          } >> "$GITHUB_OUTPUT"

      - id: publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.forgejo/actions/publish-buzz
        with:
          file: ${{ steps.stage.outputs.name }}
          filename: ${{ steps.stage.outputs.name }}
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          location-id: ${{ env.BUZZ_LOCATION_ID }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}

      - name: compose the release body
        id: body
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ISO_NAME: ${{ steps.stage.outputs.name }}
          ISO_URL: ${{ steps.publish.outputs.url }}
          ISO_SUM: ${{ steps.publish.outputs.sha256 }}
          ISO_SIZE: ${{ steps.publish.outputs.size }}
          STORE_PATH: ${{ steps.stage.outputs.storePath }}
        run: |
          set -euo pipefail
          human=$(awk -v b="$ISO_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          # refresh.yml reads this back to re-upload the same bytes without
          # rebuilding. Keep the field names stable: changing one silently
          # breaks the refresh for every release already published.
          jq -n --arg iso "$ISO_NAME" --arg sum "$ISO_SUM" \
                --argjson size "$ISO_SIZE" --arg path "$STORE_PATH" \
            '{iso:$iso, sha256:$sum, size:$size, storePath:$path}' > release.json
          cat release.json
          {
            echo "body<<RELEASE_BODY_EOF"
            cat <<BODY
          ### Download

          **[${ISO_NAME}](${ISO_URL})** — ${human}

          \`\`\`
          sha256  ${ISO_SUM}
          \`\`\`

          Verify against the \`.sha256\` attached below:

          \`\`\`sh
          sha256sum -c ${ISO_NAME}.sha256
          \`\`\`

          Write it to a USB stick and boot the target machine; the installer
          partitions, encrypts and installs unattended.

          ---

          The image is hosted off-forge rather than attached here, because one
          ISO is Codeberg's entire recommended allowance for packages, LFS and
          attachments. That link is refreshed automatically and may still lapse
          — if it has, build the same image from this tag with
          \`nix build .#nixosConfigurations.iso.config.system.build.isoImage\`.
          BODY
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # A tag makes a release; the API and curl do it, refactored into a local
      # action shared with the refresh workflow. Only the checksum and the
      # release.json manifest are attached — the image itself is a link.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: ./.forgejo/actions/forgejo-release
        with:
          tag: ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          assets: |
            ${{ steps.stage.outputs.name }}.sha256
            release.json
          token: ${{ secrets.FORGEJO_TOKEN }}
          token-alt: ${{ secrets.GITHUB_TOKEN }}

      - if: startsWith(github.ref, 'refs/tags/')
        uses: ./.forgejo/actions/prune-buzz
        with:
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          prefix: losos-installer-
          keep: "5"
          keep-id: ${{ steps.publish.outputs.id }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}
