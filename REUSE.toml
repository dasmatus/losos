# REUSE compliance metadata (https://reuse.software, spec 3.3).
# The entire tree is AGPL-3.0-or-later; the license text lives in
# LICENSES/AGPL-3.0-or-later.txt. `precedence = "closest"` means any
# per-file SPDX header added later wins over this blanket annotation.
version = 1
SPDX-PackageName = "losos"
SPDX-PackageDownloadLocation = "https://github.com/dasmatus/losos"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matus Mastena"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# IBM Plex Sans SemiBold and IBM Plex Mono Regular, unmodified from IBM's
# releases, compiled into the Lab's canvas (admin-ui/lab/render).
[[annotations]]
path = "admin-ui/lab/render/assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"
