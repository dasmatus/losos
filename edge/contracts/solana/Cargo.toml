[package]
name = "losos-escrow-solana"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
publish = false
description = "The Solana twin of LososEscrow: USDC held for the period a buyer paid for"

[lib]
crate-type = ["cdylib", "lib"]
name = "losos_escrow"

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi", "copy", "sha2"] }

# Off chain the program address search needs the curve; on chain it is a
# syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = { version = "0.18", features = ["precompiles"] }
solana-account = "4.3"
solana-address = { version = "2", features = ["curve25519", "decode", "atomic"] }
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3.4"
