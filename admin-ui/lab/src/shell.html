<title>LosOS Lab</title>
<!--HEAD-->
</head>
<body>
<div id="splash" role="status" aria-label="Loading LosOS Lab">
  <div class="sp-top">
    <img class="sp-meme" id="memeNo" alt="" hidden>
    <div class="sp-pane">
    <svg class="sp-mark" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fb6e8"/><stop offset=".55" stop-color="#0a7fc2"/><stop offset="1" stop-color="#05508f"/></linearGradient>
        <radialGradient id="sph" cx=".35" cy=".28" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="60" cy="60" r="54" fill="url(#spg)"/>
      <circle cx="60" cy="60" r="54" fill="url(#sph)"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
      <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.4" stroke-linecap="round">
        <path d="M30 78 60 40 90 72 30 78"/><path d="M60 40v-14"/>
      </g>
      <g fill="#fff"><circle cx="30" cy="78" r="6"/><circle cx="90" cy="72" r="6"/><circle cx="60" cy="26" r="5"/></g>
      <g transform="translate(43 44)">
        <rect width="34" height="24" rx="3" fill="#fff"/>
        <path d="M2 3l15 11 15-11" fill="none" stroke="#0a7fc2" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="sp-word"><span class="sp-light">Packet</span> <span class="sp-bold">Tracer</span></div>
    <div class="sp-sub">style network simulation</div>
    </div>
  </div>
  <div class="sp-bottom">
    <img class="sp-meme" id="memeYes" alt="" hidden>
    <div class="sp-pane">
    <img id="splashLogo" alt="" width="84" height="84">
    <div class="sp-los">LosOS <span>Lab</span></div>
    <div class="sp-load"><span id="splashMsg">Loading the canvas</span><i class="sp-bar"><b></b></i></div>
    </div>
  </div>
</div>
<div id="app">
  <header class="top">
    <a class="back" id="back" href="/" hidden>Admin</a>
    <div class="brand"><img id="logo" alt="" width="26" height="26">LosOS Lab</div>
    <div class="seg" role="group" aria-label="Workspace">
      <button data-view="logical" aria-pressed="true">Logical</button>
      <button data-view="physical" aria-pressed="false">Physical</button>
    </div>
    <select id="scenario" aria-label="Setup"></select>
    <div class="files" role="group" aria-label="Setup file">
      <button class="btn" id="saveSetup" title="Download this setup as a file">Save</button>
      <button class="btn" id="openSetup" title="Open a setup saved earlier">Open</button>
      <input type="file" id="openFile" accept=".llf,.json" hidden>
    </div>
    <div class="seg" role="group" aria-label="Mode">
      <button data-mode="realtime" aria-pressed="true">Realtime</button>
      <button data-mode="simulation" aria-pressed="false">Simulation</button>
    </div>
    <span class="spacer"></span>
    <span class="engine" id="engine"></span>
  </header>
  <main class="work">
    <div class="canvas-wrap">
      <svg class="canvas" id="canvas" aria-label="Network canvas"></svg>
      <div class="mode-hint" id="hint" hidden></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" class="zfit" aria-label="Fit">⤢</button></div>
      <div class="legend" id="legend"></div>
    </div>
    <section class="simpanel" aria-label="Traffic">
      <div class="simbar" id="simbar"></div>
      <div class="evlist" id="evlist"></div>
    </section>
  </main>
  <aside class="side" id="side" aria-label="Inspector"></aside>
  <nav class="tray" aria-label="Devices and connections">
    <div class="tray-cats" id="trayCats"></div>
    <div class="tray-items" id="trayItems"></div>
  </nav>
</div>
<!--SCRIPT-->
</body>
