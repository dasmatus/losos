# losos, the terminal client: the web UI's panes over the signed and
# encrypted envelope of docs/terminal-access.md, for a box or an edge.
[package]
name = "losos"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Matus Mastena <shadiness9530+ou1rlygj@pm.me>"]
description = "Manage LosOS boxes and edges from a terminal, without SSH"
license = "AGPL-3.0-or-later"
build = "build.rs"

# Its own lock and its own workspace, like every crate in this repository.
[workspace]

[[bin]]
name = "losos"
path = "src/main.rs"

[dependencies]
# The envelope's two halves, shared with lososd and losos-registrar so the
# three cannot disagree on it.
losos-access = { path = "../../backend/access" }
clap = { version = "4.5", features = ["derive", "string", "wrap_help"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Blocking HTTPS with rustls on ring; the certificate check is ours
# (src/http.rs), so a box's self-signed certificate can be pinned.
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
url = "2"
# The versions losos-access and rPGP already use.
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

# The browser build (nix/packages.nix, losos-tui-wasm). On wasm32, getrandom
# — the randomness rand and rustls' ring both draw from — refuses to compile
# without a shim turned on, and features are additive across the graph: this
# entry enables that shim on the same getrandom version. Native targets stay
# untouched; nothing here is compiled on them.
#
# ratatui and crossterm drop their default features under wasm32: the header
# is the unix/windows terminal sys half (terminal raw mode, cursor probes,
# and the event backend), and wasm32-unknown-unknown is neither family, so
# the default tree cannot compile there at all. crossterm 0.29's
# src/event/sys.rs has only unix and windows arms (event-stream included),
# so even event-stream fails on wasm32; both crates carry no features here.
# The browser page owns its own input — the src tree does not touch
# ratatui::crossterm::* nor crossterm::event::* under wasm32 (term.rs gates
# the crossterm event translation and the TTY run loop). Features are
# additive per platform and the native dependencies above keep theirs, so
# the desktop CrosstermBackend tree is untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
ratatui = { version = "0.30", default-features = false, features = [] }
crossterm = { version = "0.29", default-features = false, features = [] }
# rustls reads the clock through rustls-pki-types' UnixTime: which under
# wasm32 needs that crate's web feature (web-time's clock; there is no
# unix family to ask). The feature rides the direct page edge — rustls's
# own table has only alloc — and features are additive across the graph,
# so a tree entry on the same version turns it on for the whole wasm32
# closure and none of the native lines.
rustls-pki-types = { version = "1", default-features = false, features = ["web", "alloc"] }

[build-dependencies]
png = "0.17"

[dev-dependencies]
# The screenshots example crops what Chromium shoots.
png = "0.17"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
