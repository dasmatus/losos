<!doctype html>
<!--
  The widget frame: where a widget the owner wrote by hand runs.

  The admin page is served under `script-src 'self'` with no 'unsafe-inline'
  and no 'unsafe-eval' (modules/containers.nix), so the text an owner types
  into the editor can never run inside that page. It runs here instead, in a
  real URL the board embeds as

      <iframe sandbox="allow-scripts" src="/widget-frame/">

  Three things make that safe, and every one of them is load-bearing:

    1. `sandbox` WITHOUT `allow-same-origin`. The frame is an opaque origin:
       it cannot read the page's sessionStorage (the admin token), its
       cookies or its DOM, and a fetch to /api from in here carries no token
       and gets no CORS answer. It is not this page's choice — the attribute
       is on the embedding element, which the widget cannot reach.
    2. Its own CSP, from nginx, for this directory only (the `~^/widget-frame/`
       arm of the header map). Permissive for itself: inline script and
       style, pictures and fetches off the box. An `<iframe srcdoc>` would
       have inherited the page's strict policy, which is why this is a file.
    3. `frame-ancestors 'self'` in that policy, and no X-Frame-Options, so
       only the box's own pages may embed it.

  Everything the widget gets from the box comes through postMessage: the
  parent sends the widget's files and the readings asked for, this file
  answers with its height and any error. The contract is the `losos` object
  below, documented in the editor's Help tab (i18n/look.ts).

  A widget is `index.html` plus the files it links. They are not served at
  URLs of their own: `render` below puts a linked stylesheet or script inline
  and a picture in a data: URL, and `fetch` of a file name answers from the
  widget's own files. Every file is text the owner wrote, so this is the
  same trust as one long index.html.

  Plain script on purpose — nothing here is built by Vite, so it stays in
  sync with nothing and depends on nothing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Widget</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--ink, #18212a);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13.5px;
        line-height: 1.45;
      }
      body {
        overflow: hidden;
      }
      a {
        color: var(--accent, #0e6e7d);
      }
    </style>
  </head>
  <body>
    <script>
      (() => {
        "use strict";
        const parentWindow = window.parent;
        const send = (message) => parentWindow.postMessage(message, "*");

        // ── The bridge ────────────────────────────────────────────────
        let seq = 0;
        const pending = new Map();
        const themeListeners = new Set();
        // What the admin page last sent. Read through the getters below, so
        // the frozen `losos` object follows the page and the widget cannot
        // write it.
        const current = { theme: "light", lang: "en", palette: {} };
        // The widget's files, by name, as the last `load` sent them.
        let files = new Map();
        const losos = {
          /** "light" or "dark", following the admin page. */
          get theme() {
            return current.theme;
          },
          /** "en", "sk" or "de": the language the admin page is in. */
          get lang() {
            return current.lang;
          },
          /** The box's colours, also set as CSS variables on <html>. */
          get palette() {
            return current.palette;
          },
          /** One of the box's readings, by name. Resolves with its document. */
          metric(name, opts) {
            return new Promise((resolve, reject) => {
              seq += 1;
              const id = seq;
              pending.set(id, { resolve, reject });
              send({ losos: "metric", id, name: String(name), opts: opts || {} });
            });
          },
          /** Called with the new theme whenever the admin page switches. */
          onTheme(fn) {
            themeListeners.add(fn);
            return () => themeListeners.delete(fn);
          },
          /** Ask the board to re-measure now, after a change it cannot see. */
          resize() {
            report();
          },
          /** The names of the widget's files. */
          get files() {
            return Array.from(files.keys());
          },
          /** One of the widget's files, as text, or undefined. */
          file(name) {
            return files.get(fileName(name));
          },
          /** One of the widget's files as a data: URL, for an <img> or a CSS
           *  url() set from script. */
          asset(name) {
            const found = fileName(name);
            return found === undefined ? undefined : dataUrl(found);
          },
        };
        Object.freeze(losos);
        window.losos = losos;

        // ── Height ────────────────────────────────────────────────────
        let last = -1;
        let queued = false;
        const report = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.documentElement.scrollHeight),
            );
            if (height !== last) {
              last = height;
              send({ losos: "size", height });
            }
          });
        };
        if (typeof ResizeObserver === "function") {
          const observer = new ResizeObserver(report);
          observer.observe(document.documentElement);
          observer.observe(document.body);
        }

        // ── Errors ────────────────────────────────────────────────────
        const sayError = (message) => send({ losos: "error", message: String(message) });
        window.addEventListener("error", (event) => {
          sayError(event.message || "The widget threw an error.");
        });
        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          sayError(reason && reason.message ? reason.message : String(reason));
        });

        // ── The widget's files ────────────────────────────────────────
        const KINDS = {
          html: "text/html",
          css: "text/css",
          js: "text/javascript",
          mjs: "text/javascript",
          json: "application/json",
          svg: "image/svg+xml",
          txt: "text/plain",
          md: "text/markdown",
        };
        const typeOf = (name) => KINDS[name.slice(name.lastIndexOf(".") + 1)] || "text/plain";
        /* A reference names a file when, without a leading "./", a query or
         * a fragment, it is exactly one of the names. Anything else (an
         * https: URL, a data: URL) is left for the browser. */
        const fileName = (ref) => {
          if (typeof ref !== "string") return undefined;
          const name = ref.trim().replace(/^\.\//, "").replace(/[?#].*$/, "");
          return files.has(name) ? name : undefined;
        };
        const dataUrl = (name) =>
          `data:${typeOf(name)};charset=utf-8,${encodeURIComponent(files.get(name))}`;
        const linkUrls = (css) =>
          String(css).replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (whole, quote, ref) => {
            const name = fileName(ref);
            return name === undefined ? whole : `url("${dataUrl(name)}")`;
          });

        /* `fetch("data.json")` answers from the widget's files, so a widget
         * can keep its data beside its script. Everything else is the
         * browser's own fetch. */
        const realFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const name = typeof input === "string" ? fileName(input) : undefined;
          if (name === undefined) return realFetch(input, init);
          return Promise.resolve(
            new Response(files.get(name), { status: 200, headers: { "Content-Type": typeOf(name) } }),
          );
        };

        // ── Rendering ─────────────────────────────────────────────────
        const applyTheme = (message) => {
          if (message.theme === "light" || message.theme === "dark") {
            current.theme = message.theme;
            document.documentElement.setAttribute("data-theme", message.theme);
            document.documentElement.style.colorScheme = message.theme;
          }
          if (typeof message.lang === "string") {
            current.lang = message.lang;
            document.documentElement.lang = message.lang;
          }
          if (message.palette && typeof message.palette === "object") {
            const palette = {};
            for (const [name, value] of Object.entries(message.palette)) {
              if (!/^--[a-z0-9-]+$/.test(name) || typeof value !== "string") continue;
              document.documentElement.style.setProperty(name, value);
              palette[name] = value;
            }
            current.palette = Object.freeze(palette);
          }
        };

        /* Scripts parsed out of innerHTML never run; a script element made
         * fresh and given the same text does. So index.html is parsed into a
         * template, the files it links are put in place, every <script> is
         * rebuilt, and the lot is appended. */
        const render = (message) => {
          files = new Map();
          if (Array.isArray(message.files)) {
            for (const file of message.files) {
              if (file && typeof file.name === "string" && typeof file.content === "string") {
                files.set(file.name, file.content);
              }
            }
          } else if (typeof message.source === "string") {
            files.set("index.html", message.source);
          }
          const template = document.createElement("template");
          template.innerHTML = String(files.get("index.html") || "");
          const content = template.content;
          for (const link of Array.from(content.querySelectorAll("link[href]"))) {
            const name = fileName(link.getAttribute("href"));
            if (name === undefined || !/(^|\s)stylesheet(\s|$)/i.test(link.rel)) continue;
            const style = document.createElement("style");
            style.textContent = linkUrls(files.get(name));
            link.replaceWith(style);
          }
          for (const style of Array.from(content.querySelectorAll("style"))) {
            style.textContent = linkUrls(style.textContent);
          }
          for (const element of Array.from(content.querySelectorAll("[src]:not(script), image[href], use[href]"))) {
            const attribute = element.hasAttribute("src") ? "src" : "href";
            const name = fileName(element.getAttribute(attribute));
            if (name !== undefined) element.setAttribute(attribute, dataUrl(name));
          }
          for (const old of Array.from(content.querySelectorAll("script"))) {
            const fresh = document.createElement("script");
            const linked = old.hasAttribute("src") ? fileName(old.getAttribute("src")) : undefined;
            for (const attribute of Array.from(old.attributes)) {
              if (linked !== undefined && attribute.name === "src") continue;
              fresh.setAttribute(attribute.name, attribute.value);
            }
            fresh.textContent = linked !== undefined ? files.get(linked) : old.textContent;
            old.replaceWith(fresh);
          }
          document.body.replaceChildren(content);
          report();
        };

        window.addEventListener("message", (event) => {
          if (event.source !== parentWindow) return;
          const message = event.data;
          if (!message || typeof message !== "object") return;
          switch (message.losos) {
            case "load":
              applyTheme(message);
              render(message);
              break;
            case "theme":
              applyTheme(message);
              for (const fn of themeListeners) {
                try {
                  fn(current.theme);
                } catch (error) {
                  sayError(error && error.message ? error.message : String(error));
                }
              }
              break;
            case "metric:result": {
              const waiting = pending.get(message.id);
              if (waiting === undefined) return;
              pending.delete(message.id);
              waiting.resolve(message.value);
              break;
            }
            case "metric:error": {
              const waiting = pending.get(message.id);
              if (waiting === undefined) return;
              pending.delete(message.id);
              waiting.reject(new Error(String(message.message)));
              break;
            }
            default:
              break;
          }
        });

        // The board may have sent `load` before this listener existed; say
        // hello and it sends it again.
        send({ losos: "hello" });
      })();
    </script>
  </body>
</html>
