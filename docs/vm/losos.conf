#!/usr/bin/quickemu --vm
# LosOS in quickemu: https://github.com/quickemu-project/quickemu
#
# Put the installer ISO from a LosOS release next to this file as
# losos/losos-installer.iso, then run `quickemu --vm docs/vm/losos.conf`.
# The disk, the firmware variables and the TPM state land in losos/ too.
#
# The install minimum is 4 GiB of memory and a 40 GiB disk. These sizes are
# above it because the box runs two Kubernetes nodes with LosOS Cloud and
# LosOS Git, and rebuilds itself every night onto the disk that holds the data.
guest_os="linux"
disk_img="losos/disk.qcow2"
iso="losos/losos-installer.iso"
cpu_cores="4"
ram="8G"
disk_size="64G"
# UEFI, so the installer takes the UEFI path. Secure Boot stays off: the
# installed box's own loader is not signed.
boot="efi"
secureboot="off"
# An emulated TPM 2.0 (swtpm), so the disk key is sealed to it the way it
# would be on a mini-PC. Its state stays in losos/ between boots.
tpm="on"
# The box answers on 80 and 443. Open http://localhost:8080 on the host.
port_forwards=("8080:80" "8443:443")
