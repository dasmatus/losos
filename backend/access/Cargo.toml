# The terminal client's credentials, shared by both servers: lososd on a box
# (backend/) and losos-registrar on an edge (edge/registrar/). One crate,
# so the two cannot disagree on the envelope, the token format or the checks.
# The wire contract is docs/terminal-access.md.
[package]
name = "losos-access"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Matus Mastena <shadiness9530+ou1rlygj@pm.me>"]
description = "losos personal access tokens and the OpenPGP envelope the losos terminal client speaks"
license = "AGPL-3.0-or-later"

# Not a member of a workspace: the repository is deliberately not a Cargo
# workspace (each crate has its own lock), and backend/ is a package, not a
# workspace root, so without this table cargo would go looking for one.
[workspace]

[dependencies]
# rPGP, pure Rust. bzip2 (its only default feature) is off: openpgp.js does
# not compress, and a bzip2 bomb is one more way to spend the server's memory.
pgp = { version = "0.21", default-features = false }
# The versions rPGP itself uses, so neither adds a second copy to the tree.
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# A gateway's checks (src/gateway): the TPM's credential activation (RSA-OAEP,
# AES-CFB, HMAC), its quote (P-256 ECDSA), the maker's EK certificate chain
# (X.509, RSA or ECDSA) and the gateway's Ed25519 nonce signature. All of
# them are already in the tree through rPGP; x509-cert is the one new crate.
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
cfb-mode = "0.8"
cipher = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = "2"
x509-cert = { version = "0.2", default-features = false }
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
