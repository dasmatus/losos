[package]
name = "losos-ctl"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Matus Mastena <shadiness9530+ou1rlygj@pm.me>"]
description = "losos appliance control plane: the lososd daemon (D-Bus + admin HTTP API) and the losos-ctl facade CLI + auto-installer"
license = "AGPL-3.0-or-later"

# The whole dependency set is declared up front, even for modules that land in
# later phases, so Cargo.lock — and therefore the `cargoHash` in
# nix/packages.nix — settles once instead of churning every phase.
[dependencies]
# CLI. The surface is user-facing (losos-ctl is root's login shell on the
# installer ISO), so it earns real --help and parse-time validation.
clap = { version = "4", features = ["derive"] }

# Wire formats. Every response is JSON with a field order fixed by schema.json.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Errors: thiserror for typed library errors, anyhow for context chains at the
# binary edge (the CLI book's split).
thiserror = "2"
anyhow = "1"

# Daemon transports.
actix-web = { version = "4", default-features = false, features = ["macros"] }
# "blocking-api" is what the facade CLI uses: a one-shot D-Bus call needs no
# runtime. The daemon uses the async side on tokio.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "process", "io-util"] }

# Job ids are "%Y%m%d%H%M%S-<pid>-<counter>"; the counter is what keeps two
# jobs queued in the same second apart.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

tracing = "0.1"

# poll(2) on stdin, so the installer ISO's firmware menu can time out without
# leaving a reader thread on the terminal. A safe wrapper, because the crate
# forbids unsafe code; already in the lock file through tempfile.
rustix = { version = "1", features = ["event", "fs", "rand"] }

# Ed25519 verification of an edge's identity (`edge.rs`): is the edge the box
# found one LosOS runs, or a company's own? Verification only — the box never
# holds a signing key — and the same crate edge/registrar signs with, so
# the two sides cannot disagree on the primitive.
ring = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The `Stream` trait, to read an uploaded disk image off the request a chunk
# at a time (`vm_upload.rs`) rather than holding gigabytes in memory. Already
# in the lock file through actix-web.
futures-core = { version = "0.3", default-features = false }

# Personal access tokens and the OpenPGP envelope of the losos terminal
# client (src/access.rs). Shared with edge/registrar by path, so the box
# and the edge speak one contract (docs/terminal-access.md).
losos-access = { path = "access" }
# The path rule, which edge to use (src/edge.rs re-exports it): its own crate
# so that LosOS Desktop's network machine picks an edge the same way.
losos-edge-path = { path = "edge-path" }
# Problem reports (src/install_report.rs): the installer writes and sends
# them with the same crate the box's problems plugin uses, so the two read
# alike and the same failure is one GitHub issue.
losos-report = { path = "plugins/report" }
# The secret of a gateway check's TPM credential (crate::edge::Vetter) and
# keys for the mail key store's tests; the version losos-access and rPGP use.
rand = "0.8"

# What a hand-written widget may hold, shared with the look plugin so the
# builder and the store refuse the same things in the same words.
losos-widget = { path = "plugins/widget" }
# The names the pins plugin takes as well (release, Git owner and repository,
# LosOS Cloud path), so the two cannot drift apart.
losos-names = { path = "plugins/names" }

# The Monero key check (`monero_key.rs`): the key the owner pasted must be
# the address's view key, never its spend key, before it goes to the edge.
# The access crate's pgp keeps dalek 4 in the lock file beside this one.
curve25519-dalek = "5"

# Text inside the owner's files for the admin pages' palette
# (src/textsearch/, the losos-search binary). SQLite's FTS5 is the index: one
# file on disk, nothing resident between searches, and an update is a row
# replaced in a transaction. Bundled so the index does not depend on the
# system's sqlite build having FTS5 compiled in.
rusqlite = { version = "0.41", features = ["bundled"] }
# The text of ODF and Office Open XML documents is XML inside a zip. Only
# deflate, the one method office suites write.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The walk over the owner's files. Already in the lock file.
walkdir = "2"
# Password hashes for the people file Authelia signs people in against
# (src/people.rs): argon2id in PHC form, the format Authelia reads. Already
# in the lock file through the access crate.
argon2 = "0.6"
# Apps the builder writes are JSX (src/jsx.rs): parsed for the mistakes a
# small model makes, then compiled to a plain script for the app frame, once,
# on the box.
oxc = { version = "0.155", default-features = false, features = ["transformer", "codegen", "semantic"] }

# Profile pictures and banners (src/profiles.rs): decoded, turned upright,
# cropped, scaled and encoded again, so no camera tag (a photo's position
# among them) is ever stored. PNG, JPEG, GIF and WebP in; PNG and JPEG out.
# The `image` dependency itself is declared once, below with LosOS Cloud's
# thumbnails, whose decoders are a superset of these.
# Live editing in LosOS Cloud (src/cloud/collab/): yrs is the Rust port of
# Yjs, the CRDT the editor runs in the browser, and speaks its binary
# format and sync protocol. similar diffs a file written outside the editor
# into line edits.
yrs = "0.28"
similar = { version = "3", default-features = false, features = ["std", "text"] }
# The mesh link between boxes (src/cloud/mesh/): WebSockets on both sides,
# actix-ws where the box answers and tokio-tungstenite where it dials, over
# rustls with ring (the crypto crate already here) and the system's roots.
actix-ws = "0.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# LosOS Cloud (src/cloud/, the losos-cloud binary): WebDAV bodies are XML,
# read with namespaces resolved, and downloads go through actix-files for
# ranges and conditional requests.
quick-xml = "0.42"
actix-files = "0.7"
# Uploads land in a temporary file beside the owner's files and are renamed
# into place; all three are already in the lock file.
tempfile = "3"
httpdate = "1"
percent-encoding = "2"
base64 = "0.23"
url = "2"
mime = "0.3"
# Thumbnails of pictures (src/cloud/preview.rs), turned the way the camera
# held them, and profile pictures and banners (src/profiles.rs): decoded,
# turned upright, cropped, scaled and encoded again, so no camera tag (a
# photo's position among them) is ever stored. Decoders only for the formats
# phones and cameras write.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Photos (src/cloud/photos/): every tag a camera writes, read from the EXIF
# block the image decoder hands over, and faces found and told apart on the
# box by two small ONNX models (YuNet and SFace, nix/face-models.nix) that
# tract runs in plain Rust, with no native runtime to ship.
kamadak-exif = "0.6"
tract-onnx = "0.23"

# Calls (src/calls/, the losos-calls binary): a forwarding SFU on str0m, a
# sans-IO WebRTC stack, with its pure-Rust DTLS and SRTP so nothing links
# OpenSSL. The browsers encrypt every frame end to end before it reaches
# the SFU; str0m only ever sees that ciphertext inside SRTP.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# The call page's signalling socket is actix-ws, declared above.
# Which addresses the SFU offers as ICE host candidates.
if-addrs = "0.15"
# Media through the edge (src/calls/relay.rs): one QUIC connection the
# edge hands the browsers' datagrams down, TLS 1.3 on ring like the rest.
# rustls is declared above with the mesh link.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# The plugin runtime (src/plugin/): lososd's areas are WebAssembly
# components written against plugins/wit/plugin.wit, loaded from the
# read-only directory the NixOS module names. Component model for typed
# imports and exports, Cranelift to compile them once at start. No WASI:
# a plugin reaches the box only through the host functions in
# src/plugin/host.rs, each checked against its manifest.
wasmtime = { version = "50", default-features = false, features = ["anyhow", "runtime", "cranelift", "component-model", "std", "parallel-compilation"] }

# LosOS Git (src/forge/, the losos-git binary): git's smart HTTP requests
# may come gzipped (futures-util and base64 above serve it too). Already in
# the lock file through zip.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# Mesh CI (src/ci/, the losos-ci binary) reads GitHub Actions workflows,
# which are YAML, out of a commit's tree, which LosOS Git hands over as a
# gzipped tar. serde_yaml is the crate edge/registrar already reads with.
serde_yaml = "0.9"
tar = { version = "0.4", default-features = false }

# OpenPGP in LosOS Mail (src/mail_pgp.rs): the box checks the public half of
# a person's key before it publishes it (WKD, Autocrypt), learns the keys
# other people's mail carries, and makes sure a private key it keeps is
# locked with a passphrase it never sees. The same rPGP the access crate
# uses, so the tree keeps one copy; bzip2 off for the same reason. SHA-1 is
# what WKD hashes an address's local part with (RFC draft-koch-openpgp-webkey).
pgp = { version = "0.21", default-features = false }
sha1 = "0.11"

[dev-dependencies]
# The CLI book's integration-testing trio: run the real binary, assert on its
# output, and give it a throwaway filesystem.
assert_cmd = "2"
predicates = "3"
assert_fs = "1"
# tests/plugins.rs builds the plugins for wasm32 and wraps them as
# components the way `wasm-tools component new` does in nix/packages.nix.
wit-component = "0.262"
# Paused time, for the mesh link's heartbeat test.
tokio = { version = "1", features = ["test-util"] }

# Crate-wide lint policy, matching edge/registrar/Cargo.toml.
[lints.rust]
# deny, not forbid: wasmtime's bindgen! emits `unsafe` blocks, and
# src/plugin/bindings.rs is the one module allowed them. Everything else
# still may not write one.
unsafe_code = "deny"
unreachable_pub = "warn"

[lib]
name = "losos_ctl"
path = "src/lib.rs"

[[bin]]
name = "losos-ctl"
path = "src/bin/losos-ctl.rs"

[[bin]]
name = "lososd"
path = "src/bin/lososd.rs"

[[bin]]
name = "losos-app-shape"
path = "src/bin/losos-app-shape.rs"

[[bin]]
name = "losos-cloud"
path = "src/bin/losos-cloud.rs"

[[bin]]
name = "losos-search"
path = "src/bin/losos-search.rs"

[[bin]]
name = "losos-calls"
path = "src/bin/losos-calls.rs"

[[bin]]
name = "losos-office"
path = "src/bin/losos-office.rs"

[[bin]]
name = "losos-git"
path = "src/bin/losos-git.rs"

[[bin]]
name = "losos-ci"
path = "src/bin/losos-ci.rs"
