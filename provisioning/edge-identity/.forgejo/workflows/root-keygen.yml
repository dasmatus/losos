# Make the LosOS root key on this box, once. Runs on the box's own runner
# (label `losos`, host mode: no container, the box's tools on PATH).
#
# Secrets this needs on the repository:
#   FORGEJO_TOKEN        an access token of the repository owner (repository
#                        read/write): writes the LOSOS_ROOT_KEY secret through
#                        the API and pushes root.pub back
#   GITHUB_TOKEN_LOSOS   optional: a GitHub token with contents + pull-requests
#                        write on the LosOS repository, to publish the public
#                        key as a PR
#
# The clone goes over loopback (LOSOS_FORGEJO_URL, set by the runner's config
# on the box) so a job on the box itself never depends on resolving the box's
# own .local name.
name: root-keygen
on:
  workflow_dispatch:
    inputs:
      publish:
        description: also open the GitHub PR that ships the public key with LosOS
        type: boolean
        default: true
jobs:
  keygen:
    runs-on: losos
    steps:
      - name: Check out the provisioning repository
        run: |
          set -eu
          base="${LOSOS_FORGEJO_URL:-$GITHUB_SERVER_URL}"
          git clone --depth 1 "$(printf '%s' "${base%/}" | sed "s#://#://oauth2:${JOB_TOKEN}@#")/${GITHUB_REPOSITORY}.git" .
        env:
          JOB_TOKEN: ${{ github.token }}
      - name: Make the root key and keep it as the LOSOS_ROOT_KEY secret
        run: ./root-keygen.sh --forgejo-url "${LOSOS_FORGEJO_URL:-$GITHUB_SERVER_URL}" --repo "$GITHUB_REPOSITORY" --public-out root.pub
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      - name: Commit the public key
        run: |
          set -eu
          git config user.name "losos provisioning"
          git config user.email "provisioning@losos.local"
          git add root.pub
          git commit -m "root public key" || true
          base="${LOSOS_FORGEJO_URL:-$GITHUB_SERVER_URL}"
          git push "$(printf '%s' "${base%/}" | sed "s#://#://oauth2:${FORGEJO_TOKEN}@#")/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      - name: Publish the public key to LosOS (pull request)
        if: ${{ inputs.publish }}
        run: |
          set -eu
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN_LOSOS is not set; paste this line into keys/official-edge-root.pub yourself:"
            cat root.pub
            exit 0
          fi
          ./publish-root-key.sh --public-key "$(cat root.pub)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_LOSOS }}
