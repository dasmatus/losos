# Installs Nix with this project's substituters, for the GitHub Actions lane.
#
# The retired Codeberg lane ran every job inside docker.io/nixos/nix and set
# the cache through a workflow-level `NIX_CONFIG`. That worked there only
# because that image runs Nix single-user as root, so settings arriving by
# environment variable are applied rather than discarded as coming from an
# untrusted client.
#
# GitHub's hosted runners are not that. A normal Nix install here is
# multi-user, the workflow user is not in `trusted-users`, and so
# `extra-substituters` in the environment is dropped with a warning — leaving a
# green workflow that compiles losos-ctl from source in every job that touches
# it. The fix is to write the settings into /etc/nix/nix.conf *before* the
# daemon starts, which is what `extra_nix_config` does.
#
# The container approach is not portable here either: GitHub injects its own
# glibc-linked Node into container jobs to exec JavaScript actions, and
# nixos/nix is Alpine/musl, so actions/checkout cannot start. On ubuntu-latest
# both Node and jq are already present, which also retires the
# `nix profile install nixpkgs#nodejs` line that every Forgejo job repeats.
#
# The caller MUST run actions/checkout before using this action.
name: "Set up Nix"
description: "Install Nix with the losos binary cache trusted in /etc/nix/nix.conf."

inputs:
  github-token:
    description: >
      Passed to Nix as an `access-tokens` entry so that fetching the `github:`
      flake inputs does not draw on the shared, unauthenticated rate limit that
      every other job on these runners is also drawing on.
    required: false
    default: ""
  cache-url:
    description: "LOSOS_PROXY_URL from the calling workflow."
    required: false
    default: ""
  public-key:
    description: "NIX_CACHE_PUBLIC_KEY from the calling workflow."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check proxy settings
      shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
        PUBLIC_KEY: ${{ inputs.public-key }}
      run: |
        if { [ -n "$CACHE_URL" ] && [ -z "$PUBLIC_KEY" ]; } ||
           { [ -z "$CACHE_URL" ] && [ -n "$PUBLIC_KEY" ]; }; then
          echo "Set both LOSOS_PROXY_URL and NIX_CACHE_PUBLIC_KEY, or neither" >&2
          exit 1
        fi
        # A cache URL that answers nothing is worse than none: nix only warns
        # ("does not appear to be a binary cache"), deep in every job's log,
        # and builds from source. LOSOS_PROXY_URL pointed at a hostname with
        # no Vercel deployment behind it for a week without anyone noticing.
        # Surface it as an annotation on the run instead. Still not a gate
        # (see the note on the config step below): an outage must slow the
        # build, not fail it.
        if [ -n "$CACHE_URL" ]; then
          info=$(curl -fsS --max-time 15 "$CACHE_URL/nix-cache-info" 2>/dev/null || true)
          case "$info" in
            *StoreDir:*) echo "LosOS cache answers at $CACHE_URL" ;;
            *)
              msg="LOSOS_PROXY_URL ($CACHE_URL) did not answer /nix-cache-info with a StoreDir line, so every job in this run builds this project's own paths from source. Point the variable at the host the losos-cache-proxy Vercel project serves (https://proxy.losos.dasmat.us), or unset both cache variables."
              echo "::warning title=LosOS binary cache not answering::$msg"
              printf '> **LosOS binary cache not answering.** %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        fi
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ inputs.github-token }}
        # `extra-substituters`, never plain `substituters` — replacing the list
        # would drop cache.nixos.org, which serves the overwhelming majority of
        # any closure here, and trade a small win for a very large loss. Same
        # reasoning, and the same key, as modules/cache.nix on the appliance; if
        # they ever disagree the appliance's copy is the one that matters and
        # this is the stale one.
        #
        # This is also the pull half of the cache, and it is worth as much as
        # the push half in .github/actions/proxy-push: without it every job
        # rebuilds our own paths from source even when an earlier run already
        # pushed an identical one, which for losos-ctl alone is ~9 minutes.
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-substituters = ${{ inputs.cache-url }}
          extra-trusted-public-keys = ${{ inputs.public-key }}
          connect-timeout = 5
          fallback = true
    # Answer "was the cache used, and for how much?" per nix invocation.
    # Nix prints `copying path '…' from '<substituter>'…` and
    # `building '…drv'…` once per path on a non-tty stderr, and nothing else
    # in a job says which substituter served what. A `nix` shim ahead of the
    # real binary on PATH tees stderr through a file, counts those lines per
    # substituter when the command exits, and writes one line to the job log
    # and one table row to the step summary. The row with the LosOS column at
    # 0 and "built here" above 0 is the one to look for: this project's own
    # paths were compiled although an earlier run should have pushed them.
    # Nothing here changes nix's behaviour or exit status, and a job that
    # copies and builds nothing (eval only) adds no row.
    - name: install the nix cache-use shim
      shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
      run: |
        real="$(command -v nix)"
        dir="$RUNNER_TEMP/losos-nix-shim"
        mkdir -p "$dir"
        {
          printf '#!/usr/bin/env bash\n'
          printf 'REAL=%q\n' "$real"
          printf 'LOSOS_CACHE=%q\n' "$CACHE_URL"
          printf 'SHIM_DIR=%q\n' "$dir"
          cat <<'SHIM'
        # Run the real nix with stderr teed through a file; report what came from
        # where once it exits. Stdout is untouched (fd 3 keeps it) so `nix eval
        # --raw` and `nix path-info` callers see exactly what they would without the
        # shim, and the exit status is nix's own.
        set -o pipefail
        log="$(mktemp "$SHIM_DIR/stderr.XXXXXX")"
        { "$REAL" "$@" 2>&1 1>&3 | tee -a "$log" >&2; } 3>&1
        status=${PIPESTATUS[0]}
        count() { grep -c -F -- "$1" "$log" 2>/dev/null || true; }
        nixos=$(count "' from 'https://cache.nixos.org'")
        built=$(grep -c -E "^building '/nix/store/" "$log" 2>/dev/null || true)
        fetched=$(grep -c -E "^copying path '/nix/store/[^']*' from '" "$log" 2>/dev/null || true)
        if [ -n "$LOSOS_CACHE" ]; then
          losos=$(count "' from '$LOSOS_CACHE'")
          other=$(( fetched - nixos - losos ))
        else
          losos="n/a"
          other=$(( fetched - nixos ))
        fi
        rm -f "$log"
        if [ "$fetched" -gt 0 ] || [ "$built" -gt 0 ]; then
          # First line only, trimmed: `nix develop -c bash -c '<script>'` callers
          # would otherwise put a whole script into one table cell.
          cmd="nix $*"
          cmd="${cmd%%$'\n'*}"
          [ "${#cmd}" -gt 90 ] && cmd="${cmd:0:87}..."
          echo "LosOS cache: $losos path(s) from ${LOSOS_CACHE:-(no cache configured)}, $nixos from cache.nixos.org, $other elsewhere, $built built here [$cmd]" >&2
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            if [ ! -e "$SHIM_DIR/.summary-header" ]; then
              {
                printf '### Nix binary cache use\n\n'
                printf '| nix command | from LosOS cache (%s) | from cache.nixos.org | elsewhere | built here |\n' "${LOSOS_CACHE:-not configured}"
                printf '|---|---:|---:|---:|---:|\n'
              } >> "$GITHUB_STEP_SUMMARY"
              : > "$SHIM_DIR/.summary-header"
            fi
            printf '| `%s` | %s | %s | %s | %s |\n' "${cmd//|/\\|}" "$losos" "$nixos" "$other" "$built" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        exit "$status"
        SHIM
        } > "$dir/nix"
        chmod +x "$dir/nix"
        echo "$dir" >> "$GITHUB_PATH"
        echo "nix shim at $dir/nix wraps $real"
    # Proof the substituter was actually taken, rather than merely written
    # down. Nix does not fail when it declines one — it warns and builds from
    # source — so "the cache is configured" and "the cache is in use" are
    # different claims, and only reading the effective config distinguishes
    # them. Never a gate: a missing cache must slow the build, not fail it.
    - name: show effective nix config
      shell: bash
      run: nix config show | grep -E 'substituters|trusted-public-keys|trusted-users' || true
