name: "Publish to LosOS proxy"
description: "Sign Nix closures and publish them as GHCR artifacts served by the LosOS Desktop proxy."

inputs:
  installables:
    description: "Space-separated flake installables to publish."
    required: true
  signing-key:
    description: "NIX_CACHE_SIGNING_KEY, matching the configured trusted public key."
    required: true
  build-args:
    description: "Extra nix build arguments."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Publish signed store paths
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
        INSTALLABLES: ${{ inputs.installables }}
        BUILD_ARGS: ${{ inputs.build-args }}
        GHCR_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        if [ -z "$SIGNING_KEY" ]; then
          echo "NIX_CACHE_SIGNING_KEY is required to publish signed store paths" >&2
          exit 1
        fi
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        umask 077
        printf '%s' "$SIGNING_KEY" > "$work/cache.sec"
        # The publisher from LosOS Desktop, pinned to one commit and checked
        # against its SHA-256 before it runs, because it runs beside the cache
        # signing key. It writes one signed narinfo/NAR OCI artifact per store
        # path, as its proxy expects. To take a newer one, set both values from
        # the new commit's tools/nix-cache-push.
        rev=f4f8ecf783192f56ef825cde9e0e3a6203bc19a7
        sha256=a21d8a33b104ee671b40a4a9eb1c7e74047f6d3cf813f5df49f102418c453ced
        echo "nix-cache-push from dasmatus/losos-desktop@$rev"
        curl -fsSL --proto '=https' \
          "https://raw.githubusercontent.com/dasmatus/losos-desktop/$rev/tools/nix-cache-push" \
          -o "$work/nix-cache-push"
        echo "$sha256  $work/nix-cache-push" | sha256sum --check --quiet
        chmod +x "$work/nix-cache-push"
        oras=$(nix build nixpkgs#oras --no-link --print-out-paths)
        printf '%s' "$GHCR_TOKEN" | "$oras/bin/oras" login ghcr.io \
          --username "$ACTOR" --password-stdin
        # Word-split flake installables and arguments supplied by this workflow.
        # shellcheck disable=SC2086
        outputs=$(nix build $BUILD_ARGS $INSTALLABLES --no-link --print-out-paths)
        mapfile -t paths <<< "$outputs"
        [ "${#paths[@]}" -gt 0 ]
        PATH="$oras/bin:$PATH" \
          "$work/nix-cache-push" \
            --repository "ghcr.io/${REPOSITORY,,}/nix-cache" \
            --secret-key-file "$work/cache.sec" "${paths[@]}"
        "$oras/bin/oras" logout ghcr.io
