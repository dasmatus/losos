name: ci

on:
  push:
    branches: [main]
    # Tags publish both release media from GitHub's larger runners; see the
    # release-media job. Pushes to main build only the installer ISO gate.
    tags: ["v*"]
  pull_request:
  schedule:
    # ~04:57 UTC Mondays, off the :00 mark.
    #
    # GitHub runs scheduled workflows only from the default branch, and
    # DISABLES them after 60 days with no repository activity. Be aware that a
    # quiet repository stops running it silently.
    - cron: "57 4 * * 1"
  workflow_dispatch:
    inputs:
      release_tags:
        description: >-
          Publish release media for existing tags: one or more tags separated
          by spaces, or "missing" for every release that has no installer ISO.
          Leave empty for an ordinary CI run.
        required: false
        default: ""

# ── What this is ────────────────────────────────────────────────────────────
#
# The only CI lane. It began as a port of a Codeberg (Forgejo Actions) lane,
# retired on 2026-09-30 when the project left Codeberg; the history below
# explains choices that lane's 10-minute, 8 GB runners forced. It is kept in
# step by hand with devenv.nix's `lint`, `test-rust`, `check-flake`,
# `check-eval`, `build-pkgs` and `build-images` scripts. `devenv test` remains
# the local one-shot equivalent, and the pre-commit hooks run the lint half
# before a commit is pushed.
#
# CI does NOT go through devenv: every job would first realise the whole dev
# toolchain — rustc, cargo, clippy, rustfmt, rust-analyzer, nodejs, bun,
# nixfmt, deadnix, statix, plus the interactive shell packages — before doing
# any work of its own. Measured on Codeberg's runners: `devenv test` 9m31s,
# `devenv shell build-pkgs` 10m05s, plain nix 1m32s. GitHub's 6-hour cap would
# survive that, but paying it in a double-digit job count to run commands that
# do not need it is still waste.
#
# The nixos-test VMs stay local-only — they need /dev/kvm, which GitHub's
# hosted runners do not provide:
#   devenv shell vm-tests
# Neither this file nor devenv.nix names those VMs: `vm-tests` reads the list
# out of `.#checks.x86_64-linux`, because the hand-kept version of it had
# drifted to four names against six checks. Do not reintroduce a literal list.
#
# The substituters are written to /etc/nix/nix.conf before the daemon starts,
# not passed as NIX_CONFIG: a multi-user daemon discards cache settings from an
# untrusted client, with a warning and a green build that compiled everything
# from source. See ./.github/actions/setup-nix.
#
# Tags publish release media. The installer ISO (~1.5 GB) is attached to the
# GitHub release itself. The demo QCOW2 is too large for a GitHub release
# asset, so it and a copy of the ISO go to GHCR as OCI artifacts
# (ghcr.io/<owner>/<repo>-{installer-iso,demo-qcow2}:<tag>). Every push to
# main (and every tag) also publishes the static losos-registrar for the
# operator's machine as ghcr.io/<owner>/<repo>/images:<channel>-x86_64,
# which the LosOS proxy serves as plain files; see publish-tool.
#
# Jobs carry explicit `timeout-minutes`. GitHub's default is 360, which is long
# enough for a wedged job to spend a day of a shared quota. The numbers below
# are the measured runtime with generous headroom, not targets.
#
# What the 10-minute cap bought is kept anyway where it is still worth
# something. clippy and test remain two jobs: they do not share build
# artifacts — clippy type-checks and emits .rmeta, test needs linked binaries —
# so as one job they compile the local crates twice. And the iso job still
# imports losos-ctl from a sibling job as a 12 MiB artifact rather than
# building it: of the 769 store paths in the ISO's closure, 766 are stock
# nixpkgs that cache.nixos.org serves and losos-ctl is the only expensive one,
# at ~9 minutes of rustc. Skipping that is worth a 12 MiB round trip whatever
# the cap is, and on a fork's pull request — which gets no cache signing key — it is
# the only thing that keeps the ISO job affordable.
#
# Both crates set doCheck = false, so `nix build` compiles the shipping
# binaries and runs no suites; the suites run in the `test` job. A bare
# `nix build` is therefore not a test gate.

# Superseded runs are cancelled on pull requests and branches, where only the
# newest push matters. Never on tags or on a run that publishes release media
# for older tags: the release-media job is not something to interrupt half way
# through multi-gigabyte builds and uploads.
concurrency:
  group: ci-${{ github.ref }}${{ inputs.release_tags && format('-release-{0}', inputs.release_tags) || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tags }}

# Read-only by default; the jobs that write ask for contents: write themselves.
# A fork's pull request gets a read-only token and no secrets whatever this
# says.
permissions:
  contents: read

jobs:
  pins:
    name: "pins: flake.lock = devenv.yaml = devenv.lock"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mirrors devenv.nix's `check-pins`, and this is the gate CI did not have:
    # flake.lock pins the nixpkgs that builds the appliance, devenv.yaml and
    # devenv.lock the one that lints and tests it, and nothing but this
    # comparison keeps them on one tree. Dependabot bumped flake.lock alone
    # (PR #4) and `devenv test` failed on main for two weeks before anyone
    # ran it. No nix needed: jq ships on the runner image.
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -eu
          lock=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          yaml=$(grep -oE '[0-9a-f]{40}' devenv.yaml | head -1)
          dlock=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          if [ "$lock" != "$yaml" ] || [ "$lock" != "$dlock" ]; then
            echo "nixpkgs pins disagree:" >&2
            echo "  flake.lock  $lock" >&2
            echo "  devenv.yaml $yaml" >&2
            echo "  devenv.lock $dlock" >&2
            echo "Bump all three together: nix flake update nixpkgs, copy the rev into" >&2
            echo "devenv.yaml, then devenv update." >&2
            exit 1
          fi
          echo "nixpkgs pin agrees across flake.lock, devenv.yaml and devenv.lock ($lock)"

  clippy:
    name: "rust: clippy (+ rustfmt on PRs)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs in devShells.ci — a lean cargo/rustc/clippy/rustfmt shell from this
    # flake's pinned nixpkgs, i.e. the SAME rustc buildRustPackage compiles
    # with. On Codeberg this job first ran on docker.io/rust:latest and went red
    # in 42 seconds on a tree the pinned toolchain calls clean. `latest` floats,
    # so an upstream Rust release could turn CI red with no change here, and the
    # linter would disagree with the compiler that actually ships.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # The compiler caches that devShells.ci carries (flake/fast-build.nix):
      # sccache in front of rustc, ccache in front of gcc. Both write to
      # ~/.cache on the runner, which is a fresh VM every run, so without
      # this step they would start empty every time and cache nothing. Keyed
      # on the lock files: a dependency bump starts from the nearest older
      # cache (restore-keys) rather than from nothing, and an unchanged lock
      # gets its exact cache back. mold needs no cache; it is just faster.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
            ~/.cache/ccache
          key: ${{ runner.os }}-clippy-compiler-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-compiler-cache-
      # Check-only, always. `cargo clippy --fix` rewrites code rather than
      # whitespace, so it can change behaviour and sometimes wants human
      # judgement; unreviewed code changes have no business landing on main by
      # robot. Contrast fmt-bot below, which only reformats.
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path backend-registrar/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path edge-vercel/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path admin-ui/lab/core/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path admin-ui/lab/virt-rpc/Cargo.toml --all-targets -- -D warnings
            cargo clippy --manifest-path admin-ui/lab/render/Cargo.toml --all-targets -- -D warnings
          '
      # rustfmt is only *checked* on pull requests. On a push to main fmt-bot
      # fixes it instead — checking it here too would mean this job goes red
      # for something another job repairs a minute later, leaving a permanent
      # failure on a commit that is already fine.
      - name: rustfmt (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo fmt --manifest-path backend/Cargo.toml --check
            cargo fmt --manifest-path backend-registrar/Cargo.toml --check
            cargo fmt --manifest-path edge-vercel/Cargo.toml --check
            cargo fmt --manifest-path admin-ui/lab/core/Cargo.toml --check
            cargo fmt --manifest-path admin-ui/lab/virt-rpc/Cargo.toml --check
            cargo fmt --manifest-path admin-ui/lab/render/Cargo.toml --check
          '
      # The hit rate, so a cache that stopped being taken is visible in the
      # log rather than as a job that quietly got slower.
      - name: compiler cache statistics
        if: always()
        run: nix develop .#ci -c bash -euo pipefail -c 'sccache --show-stats; ccache --show-stats'

  clippy-wasm:
    name: "rust: clippy the Lab canvas for wasm32"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mirrors devenv.nix's `lint-wasm`. admin-ui/lab/render takes Bevy only
    # on wasm32, so the clippy job above lints its plain Rust and never sees
    # src/app or src/web.rs. This lints both builds the page loads, WebGL2
    # and WebGPU, one after the other, and removes the target directory in
    # between: each is several gigabytes of Bevy and they share none of it.
    # Same toolchain as the clippy job; nixpkgs' rustc carries the wasm32
    # standard library.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            for backend in webgl2 webgpu; do
              echo "── admin-ui/lab/render ($backend, wasm32)"
              cargo clippy --manifest-path admin-ui/lab/render/Cargo.toml \
                --target wasm32-unknown-unknown --all-targets \
                --no-default-features --features $backend -- -D warnings
              cargo clean --manifest-path admin-ui/lab/render/Cargo.toml
            done
          '

  test:
    name: "rust: test the crates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suites live here rather than inside buildRustPackage. doCheck used to
    # run them, but it also recompiles each crate in test configuration and
    # links a binary per test target, which pushed `nix build .#losos-ctl` to
    # 7.7-10.3 minutes. Mirrors devenv.nix's `test-rust`, plus a Postgres for
    # edge-vercel's gated store suite (tests/postgres.rs), which devenv does
    # not start: without LOSOS_TEST_DATABASE_URL that suite passes trivially.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: losos
          POSTGRES_PASSWORD: losos
          POSTGRES_DB: losos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U losos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOSOS_TEST_DATABASE_URL: postgres://losos:losos@127.0.0.1:5432/losos?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Same as in the clippy job, under its own key: the test profile
      # compiles every crate differently (linked test binaries, dev
      # dependencies), so the two jobs' caches share nothing worth sharing.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
            ~/.cache/ccache
          key: ${{ runner.os }}-test-compiler-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-compiler-cache-
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo test --manifest-path backend/Cargo.toml
            cargo test --manifest-path backend-registrar/Cargo.toml
            cargo test --manifest-path edge-vercel/Cargo.toml
            cargo test --manifest-path admin-ui/lab/core/Cargo.toml
            cargo test --manifest-path admin-ui/lab/virt-rpc/Cargo.toml
            cargo test --manifest-path admin-ui/lab/render/Cargo.toml
          '
      # The hit rate, so a cache that stopped being taken is visible in the
      # log rather than as a job that quietly got slower.
      - name: compiler cache statistics
        if: always()
        run: nix develop .#ci -c bash -euo pipefail -c 'sccache --show-stats; ccache --show-stats'

  eval:
    name: "nix: flake check + module merge + ISO derivation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Mirrors devenv.nix's `check-flake`. Evaluates every output — every VM
      # test derivation, both nixosConfigurations and every package, the three
      # OCI images among them; builds nothing. Which is the limit of it: an
      # image whose entrypoint fails shellcheck evaluates perfectly happily,
      # and only the images job below catches that.
      - run: nix flake check --no-build -L
      # Mirrors devenv.nix's `check-eval`, and this is the gate the repo lacked
      # entirely: `flake check` only forces each nixosConfiguration's toplevel
      # *derivation*, so an option conflict, a type error or a failed assertion
      # inside the module merge passed CI unnoticed. Forcing the drvPath forces
      # the merge.
      - run: nix eval --raw .#nixosConfigurations.install.config.system.build.toplevel.drvPath
      - run: nix eval --raw .#nixosConfigurations.iso.config.system.build.toplevel.drvPath
      - run: nix eval --raw .#nixosConfigurations.edge-gateway.config.system.build.toplevel.drvPath
      # `flake check` does not reach the ISO *image* derivation, so without this
      # an eval-reachable regression in the iso block or isoImage.* would
      # surface only in the ISO build.
      - run: nix path-info --derivation .#nixosConfigurations.iso.config.system.build.isoImage
      # The edge gateway image (flake/disk-images.nix), for the same reason.
      - run: nix path-info --derivation .#losos-disk-edge-qcow2

  losos-ctl:
    name: "rust: lososd + losos-ctl build"
    # A run that only publishes media for older tags builds from those
    # tags, not from this commit.
    if: ${{ !inputs.release_tags }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Compiles the shipping binaries only — doCheck is off, and the suite runs
      # in the test job instead (see flake/packages.nix for why). Even so this
      # is the longest job here; re-time it before adding any heavy dependency
      # to backend/Cargo.toml.
      - run: nix build .#losos-ctl -L
      # Hand losos-ctl to the iso job. Exporting its closure to a file://
      # binary cache is 12 MiB and ~13 s, against the ~9 minutes of rustc that
      # job would otherwise spend rebuilding the crate — and it works on a fork
      # pull request, which has no cache signing key to publish with.
      - name: export losos-ctl for the iso job
        run: |
          nix copy --to "file://$PWD/ctl-cache" --no-check-sigs .#losos-ctl
          # The iso job imports by path, not with `--all`; see the note there.
          nix path-info .#losos-ctl > ctl-cache/store-paths
      # v4, not v3: upload-artifact@v3 and download-artifact@v3 were retired on
      # GitHub in January 2025 and now fail outright.
      - uses: actions/upload-artifact@v7
        with:
          name: losos-ctl-store
          path: ctl-cache
          retention-days: 1
          # upload-artifact@v4 silently omits dotfiles. A binary cache that
          # arrives incomplete does not fail the iso job — it makes it rebuild
          # from source instead, quietly, which is the exact failure this
          # export exists to prevent.
          include-hidden-files: true

  registrar-and-ui:
    name: "rust: losos-registrar + admin UI + handbook"
    # A run that only publishes media for older tags builds from those
    # tags, not from this commit.
    if: ${{ !inputs.release_tags }}
    runs-on: ubuntu-latest
    # losos-admin-ui builds losos-lab-render, Bevy for wasm32 twice, which
    # alone takes about 20 minutes from an empty cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Compiles only; the registrar's tests run in the test job.
      # losos-admin-ui is a buildNpmPackage: `npm ci` from the committed
      # package-lock.json, then `tsc --noEmit && vite build`. So this step is
      # also the typecheck gate for admin-ui/app, and the one place in CI that
      # proves the npm dependency fetch still resolves. losos-handbook is the
      # same shape: `npm ci` then `docusaurus build` of handbook/, rooted at
      # /handbook/ for the box (the public site is handbook.yml's build of the
      # same source), and it fails on a broken link. LosOS Lab is the admin
      # UI's second page, so losos-admin-ui builds its Rust core for wasm32
      # (losos-lab-core) first, and copies in the Lab's libvirt client
      # (losos-lab-virt), built the same way, and the GPU canvas's two
      # modules (losos-lab-render). lab.yml builds the hosted copy with the
      # qemu-wasm engine.
      - run: nix build .#losos-registrar .#losos-admin-ui .#losos-handbook .#losos-lab-virt -L
      # The same crate linked statically against musl, for the operator's own
      # machine (the key ceremony, provisioning/edge-identity/README.md): the
      # glibc build above only runs where /nix/store exists. It is built here,
      # where the registrar's cargo vendor tarball is already realised, and
      # handed to the publish-tool job as a plain file: that job pushes it to
      # GHCR, and it needs packages: write, which this job - it runs on
      # fork pull requests - must not have.
      - run: nix build .#losos-registrar-static -o result-static -L
      - name: export the static losos-registrar for the publish-tool job
        run: |
          mkdir dev-machine
          cp -L result-static/bin/losos-registrar dev-machine/losos-registrar
      - uses: actions/upload-artifact@v7
        with:
          name: losos-registrar-dev-machine
          path: dev-machine
          retention-days: 1
      # The Playwright suite (admin-ui/app/tests/*.browser.mjs) against the
      # production bundle, in headless chromium from nixpkgs. No /dev/kvm
      # needed, unlike the VM tests. Reuses the npm deps built just above.
      - run: nix build .#checks.x86_64-linux.losos-admin-ui -L
      # Export the built SPA and the handbook for the iso job, exactly as the
      # losos-ctl job exports its crate and for the same reason. flake.nix
      # puts both in isoImage.storeContents, so without this the ISO job
      # would run `npm ci` + vite and docusaurus itself.
      #
      # A dist/ tree with no store references: about 1 MiB of page, plus the
      # GPU canvas's two WebAssembly modules (about 16 MiB each), which are
      # the bulk of it.
      #
      # This artifact is NOT gated on a secret: a fork's ISO job must still get
      # the bundle, or it goes red for want of a key the contributor cannot have.
      - name: export losos-registrar for the release-media job
        run: |
          nix copy --to "file://$PWD/registrar-cache" --no-check-sigs .#losos-registrar
          nix path-info .#losos-registrar > registrar-cache/store-paths
      - uses: actions/upload-artifact@v7
        with:
          name: losos-registrar-store
          path: registrar-cache
          retention-days: 1
          include-hidden-files: true
      - name: export the admin UI and the handbook for the iso job
        run: |
          nix copy --to "file://$PWD/ui-cache" --no-check-sigs .#losos-admin-ui .#losos-handbook
          nix path-info .#losos-admin-ui .#losos-handbook > ui-cache/store-paths
      - uses: actions/upload-artifact@v7
        with:
          name: losos-admin-ui-store
          path: ui-cache
          retention-days: 1
          # upload-artifact@v4 silently omits dotfiles. A binary cache that
          # arrives incomplete does not fail the iso job — it makes it rebuild
          # from source instead, quietly, which is the exact failure this
          # export exists to prevent.
          include-hidden-files: true

  images:
    name: "nix: OCI images for the local cluster"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # The cheap two thirds of devenv.nix's `build-images`.
      #
      # These are the images modules/defaults.nix wires into losos.workloads.*,
      # and the appliance is *required* to substitute them: it never builds an
      # image itself. A broken one therefore surfaces during system.autoUpgrade
      # at 03:00 on a repurposed mini-PC with a tmpfs root and no shell, three
      # hours before an unconditional reboot — which is to say it surfaces as a
      # box that stopped serving, with nothing to read. The eval job cannot
      # catch it: evaluation does not run the shellcheck that
      # writeShellApplication performs at build time, and does not notice a
      # buildEnv whose paths collide.
      #
      # Measured on a dev machine: losos-image-pause is a 51 MiB tarball over a
      # handful of paths, losos-image-forgejo a 585 MiB tarball over a 647 MiB /
      # 126-path content closure.
      - run: nix build .#losos-image-pause .#losos-image-forgejo -L
      - name: export images for the publisher
        if: github.event_name != 'pull_request' && vars.LOSOS_PROXY_URL != ''
        run: |
          nix copy --to "file://$PWD/images-cache" --no-check-sigs .#losos-image-pause .#losos-image-forgejo
          nix path-info .#losos-image-pause .#losos-image-forgejo > images-cache/store-paths
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && vars.LOSOS_PROXY_URL != ''
        with:
          name: losos-images-store
          path: images-cache
          retention-days: 1
          include-hidden-files: true
      # losos-image-nextcloud is not built here either; see the
      # image-nextcloud job below for what changed about that on this forge.

  publish-cache:
    name: "nix: publish built paths to proxy"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' && vars.LOSOS_PROXY_URL != '' && !inputs.release_tags
    needs: [losos-ctl, registrar-and-ui, images]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: losos-ctl-store
          path: ctl-cache
      - uses: actions/download-artifact@v8
        with:
          name: losos-registrar-store
          path: registrar-cache
      - uses: actions/download-artifact@v8
        with:
          name: losos-admin-ui-store
          path: ui-cache
      - uses: actions/download-artifact@v8
        with:
          name: losos-images-store
          path: images-cache
      - name: import the build jobs' store exports
        run: |
          xargs -r nix copy --from "file://$PWD/ctl-cache" --no-check-sigs < ctl-cache/store-paths
          xargs -r nix copy --from "file://$PWD/registrar-cache" --no-check-sigs < registrar-cache/store-paths
          xargs -r nix copy --from "file://$PWD/ui-cache" --no-check-sigs < ui-cache/store-paths
          xargs -r nix copy --from "file://$PWD/images-cache" --no-check-sigs < images-cache/store-paths
      - uses: ./.github/actions/proxy-push
        with:
          installables: ".#losos-ctl .#losos-registrar .#losos-admin-ui .#losos-handbook .#losos-image-pause .#losos-image-forgejo"
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      # The same paths as a static file cache, for the copy the GitHub Pages
      # site serves at /proxy when the LosOS proxy does not answer. The
      # handbook workflow picks up the newest of these from main and deploys
      # it with the handbook; see .github/scripts/pages-cache.sh for what it
      # holds and leaves out.
      - name: static copy of the cache for GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: >-
          .github/scripts/pages-cache.sh pages-cache
          .#losos-ctl .#losos-registrar .#losos-admin-ui .#losos-handbook
          .#losos-image-pause .#losos-image-forgejo
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: losos-pages-cache
          path: pages-cache
          retention-days: 30
          compression-level: 0

  # ── The dev-machine tool ───────────────────────────────────────────────────
  #
  # The static losos-registrar goes to GHCR as the OCI artifact
  # `ghcr.io/<owner>/<repo>/images:<channel>-x86_64`, one layer per file
  # (`losos-registrar`, `SHA256SUMS`), which is the shape the LosOS proxy's
  # `/updates/<channel>/<arch>/<file>` route serves: it picks the layer whose
  # `org.opencontainers.image.title` is the file name (oras sets that per
  # file) and redirects to GHCR's blob storage, SHA256SUMS inline. So an
  # operator fetches the binary with one curl, see
  # provisioning/edge-identity/README.md. The channel is `main` for pushes to
  # main, the tag for a release tag (which also moves `stable`), and the
  # branch name - lowercased, anything the proxy's channel grammar refuses
  # replaced by `-` - for a manual run on any other branch. Never on a pull
  # request: a pull request from a fork has no package write, and one from a
  # branch here must not move a tag an operator downloads from.
  publish-tool:
    name: "release: losos-registrar for the dev machine -> GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    needs: [registrar-and-ui]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: losos-registrar-dev-machine
          path: dev-machine
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: push the binary to GHCR as the proxy's images artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PROXY_URL: ${{ vars.LOSOS_PROXY_URL }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main) channel=main ;;
            refs/tags/*) channel="$REF_NAME" ;;
            *) channel=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9.-' '-' | cut -c1-32) ;;
          esac
          # The proxy accepts `[a-z0-9][a-z0-9.-]{0,31}` as a channel; a tag
          # outside it would be pushed and never served.
          if ! printf '%s' "$channel" | grep -Eq '^[a-z0-9][a-z0-9.-]{0,31}$'; then
            echo "::error::'$channel' is not a channel the proxy serves"
            exit 1
          fi
          cd dev-machine
          chmod 0755 losos-registrar
          sha256sum losos-registrar > SHA256SUMS
          cat SHA256SUMS
          repository="ghcr.io/${REPO,,}/images"
          trap 'oras logout ghcr.io || true' EXIT
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          oras push "${repository}:${channel}-x86_64" \
            --artifact-type application/vnd.losos.tool.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${REPO}" \
            --annotation "org.opencontainers.image.revision=${SHA}" \
            --annotation "org.opencontainers.image.version=${channel}" \
            losos-registrar:application/octet-stream SHA256SUMS:text/plain
          case "$REF" in
            refs/tags/*) oras tag "${repository}:${channel}-x86_64" stable-x86_64 ;;
          esac
          {
            echo "## losos-registrar for the dev machine"
            echo
            echo "- \`${repository}:${channel}-x86_64\`"
            if [ -n "$PROXY_URL" ]; then
              echo "- ${PROXY_URL}/updates/${channel}/x86_64/losos-registrar"
            fi
            echo "- $(cat SHA256SUMS)"
          } >> "$GITHUB_STEP_SUMMARY"
      # The same two files for the GitHub Pages copy of the proxy, which
      # serves them at /proxy/updates/main/x86_64/. Main only: that copy
      # carries one channel.
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: losos-pages-updates
          path: dev-machine
          retention-days: 30

  # ── The Nextcloud image ────────────────────────────────────────────────────
  #
  # The appliance is *required* to substitute this image: it never builds one.
  # So a cache that does not have it is worse than no cache at all — the box
  # discovers the gap during system.autoUpgrade at 03:00, on a mini-PC with a
  # tmpfs root and no shell, three hours before an unconditional reboot. It is
  # also the image most likely to break.
  #
  # On the retired Codeberg lane this was workflow_dispatch only, because of
  # the cap: the content closure is 2.3 GiB across 244 store paths
  # (nextcloud34 with ~30 apps, php-with-extensions, apacheHttpd) against
  # Forgejo's 647 MiB, so on a cold runner it fetches roughly 3.5x what the `images` job fetches, inside
  # ten minutes. That objection does not survive the move: this job may take an
  # hour here.
  #
  # So it also runs on the weekly schedule, which closes the hole that lane
  # documents as "a real hole and not an oversight" without putting a 2.3 GiB
  # fetch on every push. It is deliberately NOT folded into `images`: the one
  # number nobody has measured is what this costs a cold runner, and this
  # repository has been burned twice by guessing — doCheck stayed on until
  # `nix build .#losos-ctl` turned out to be a 7.7-10.3 minute coin flip, and
  # the ISO was excluded as fitting "neither the time nor the disk-as-RAM
  # budget" on a figure taken against zstd level 19 when flake.nix already sets
  # level 6. The weekly run prints its own timing; move it into `images` once
  # there are numbers, not before.
  image-nextcloud:
    name: "nix: Nextcloud image -> proxy"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Do not spend an hour building an image without somewhere to publish it.
      - uses: ./.github/actions/proxy-push
        if: vars.LOSOS_PROXY_URL != ''
        with:
          installables: ".#losos-image-nextcloud"
          build-args: "-L"
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  fmt-bot:
    name: "bot: cargo fmt, push back"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pushes to a BRANCH only. Two exclusions, both deliberate:
    #
    # Not pull requests: on one from a fork the automatic token is read-only,
    # and pushing to somebody else's branch is not this job's business anyway —
    # the clippy job checks formatting there instead.
    #
    # Not tags: a tag push is also a push event, and github.ref_name is then
    # the tag, so the commit-and-push below would try to move a tag rather than
    # a branch. Reformatting a released tag would be wrong even if it worked.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch, not the detached commit: a detached HEAD has
          # nothing to commit onto.
          ref: ${{ github.ref_name }}
          # Left at the default `persist-credentials: true` on purpose. It
          # stores GITHUB_TOKEN as a git http.extraheader, so the push below
          # needs no remote URL rewriting and no token ever appears in a URL or
          # in the log — which is what the Forgejo copy's `git remote set-url`
          # dance is working around.
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # Same toolchain as the clippy job and as buildRustPackage — devShells.ci
      # from this flake's pinned nixpkgs. Formatting with a different rustfmt
      # than CI checks with is how you get a bot that fights its own linter.
      - run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo fmt --manifest-path backend/Cargo.toml
            cargo fmt --manifest-path backend-registrar/Cargo.toml
            cargo fmt --manifest-path edge-vercel/Cargo.toml
            cargo fmt --manifest-path admin-ui/lab/core/Cargo.toml
            cargo fmt --manifest-path admin-ui/lab/virt-rpc/Cargo.toml
            cargo fmt --manifest-path admin-ui/lab/render/Cargo.toml
          '
      - name: commit and push if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already formatted; nothing to do"
            exit 0
          fi
          echo "rustfmt changed:"
          git --no-pager diff --stat

          git config user.name  "losos-fmt-bot"
          git config user.email "losos-fmt-bot@users.noreply.github.com"

          # [skip ci] is belt-and-braces rather than load-bearing: a push
          # authenticated with GITHUB_TOKEN does not trigger workflow runs at
          # all, so there is no loop to break here. It keeps working if this
          # job is ever moved to a PAT — which WOULD retrigger.
          git commit -am "style: cargo fmt [skip ci]"

          # A human push landing between checkout and here makes this a
          # non-fast-forward. Rebasing our one mechanical commit on top is
          # always safe: it touches only formatting.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          # If this fails with a protected-branch error, that is a repository
          # setting and not a bug here: either allow this workflow to push to
          # the branch, or drop this job and let the clippy job's rustfmt check
          # run on pushes too.
          git push origin "HEAD:${GITHUB_REF_NAME}"

  iso:
    name: "nix: build the installer ISO"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needs losos-ctl's store export. Without it this job would rebuild that
    # crate from source — ~9 minutes on its own.
    #
    # And registrar-and-ui's, for the same reason at smaller scale: flake.nix
    # carries losos-admin-ui in isoImage.storeContents, and since that stopped
    # being a file copy it is the second path in this closure cache.nixos.org
    # cannot serve.
    needs: [losos-ctl, registrar-and-ui]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: losos-ctl-store
          path: ctl-cache
      - uses: actions/download-artifact@v8
        with:
          name: losos-admin-ui-store
          path: ui-cache
      # --no-check-sigs because the exporting job signed nothing; the artifacts
      # came from sibling jobs in this same workflow run, not from a public
      # cache, so there is no third party to authenticate.
      # NOT `--all`. Enumerating a binary cache gives nix the store paths' hash
      # part but not their *name* part — it prints them as `<hash>-x`, which is
      # a placeholder, not a path that exists — and the copy then dies with
      # `error: path '/nix/store/...-libunistring-1.4.2' is not valid` after
      # appearing to copy every path. That is what broke this job on every run
      # from the day the lane landed.
      #
      # Importing the exact path the exporting job recorded copies its closure
      # in dependency order, which is the spelling nix actually supports. The
      # path list travels inside the artifact (`store-paths`), written by the
      # same step that wrote the cache, so the two cannot disagree.
      - name: import the sibling jobs' store exports
        run: |
          xargs -r nix copy --from "file://$PWD/ctl-cache" --no-check-sigs < ctl-cache/store-paths
          xargs -r nix copy --from "file://$PWD/ui-cache" --no-check-sigs < ui-cache/store-paths
      # NOT --offline. The other 766 paths come from cache.nixos.org, and
      # blocking the network would force nix to build them from source —
      # precisely the opposite of what the import above buys us.
      #
      # Disk, not time, is the constraint on this runner: an ubuntu-latest
      # image leaves roughly 20 GiB free, and this needs the ISO closure plus
      # ~4.7 GiB of build writes plus a 1.5 GB dereferenced copy for the
      # upload. It fits with room to spare. If it ever stops fitting, the first
      # lever is deleting the preinstalled Android SDK and .NET trees before
      # this step, not trimming the image.
      - run: nix build .#nixosConfigurations.iso.config.system.build.isoImage -L
      # Sign the medium's UEFI loader (modules/secure-boot.nix). The db key
      # is a repository secret, so this happens after the build, on a copy
      # outside the store, and only where the secret reaches: pushes to main
      # and tags. A fork's pull request has no key and boots unsigned, which
      # the legs below allow for. With no certificate committed yet there is
      # nothing to sign with either, and the ISO ships as `nix build` made
      # it. A failed sign or verify is a warning, not a red job: the boot
      # legs then run on the unsigned image and skip the enrolled leg.
      - name: sign the ISO's UEFI loader
        id: sign
        env:
          SECURE_BOOT_DB_KEY: ${{ secrets.SECURE_BOOT_DB_KEY }}
        run: |
          set -euo pipefail
          cp -L result/iso/*.iso installer.iso
          chmod u+w installer.iso
          if ! grep -q '^-----BEGIN CERTIFICATE-----' keys/secure-boot-db.pem; then
            echo "keys/secure-boot-db.pem carries no certificate yet: the ISO stays unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SECURE_BOOT_DB_KEY" ]; then
            echo "::notice::SECURE_BOOT_DB_KEY is not available here (fork or missing secret): the ISO stays unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          (
            set -euo pipefail
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$SECURE_BOOT_DB_KEY" > "$key"
            nix run .#losos-sign-iso -- sign --key "$key" --cert keys/secure-boot-db.pem installer.iso
            nix run .#losos-sign-iso -- verify --cert keys/secure-boot-db.pem installer.iso
          )
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::signing the ISO failed (exit ${status}): booting it unsigned"
            cp -L --remove-destination result/iso/*.iso installer.iso
            chmod u+w installer.iso
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Building the ISO says nothing about whether it boots: v0.1.1 built
      # green here and was then reported "not bootable in UEFI". So boot the
      # image just built (signed, where it was), from a virtual USB stick
      # under OVMF (UEFI) and SeaBIOS. tests/iso-boot.py passes once the
      # installer resolves github.com, which needs the whole chain to work,
      # from the firmware to root's autologin. The VM is killed within two
      # seconds of that query, and the disk it would install to is a sparse
      # temp file.
      #
      # Secure Boot has two legs. `uefi-sb-ms` is a stock PC: OVMF with only
      # Microsoft's keys must refuse the medium whether it is signed or not,
      # and the script passes on the firmware's "Access Denied". `uefi-sb`
      # adds the committed LosOS certificate to that same store, beside
      # Microsoft's certificates, as the handbook tells an owner to, and must
      # boot — only meaningful once the loader is signed, so it runs on main
      # and tags and is skipped on a fork's pull request.
      #
      # KVM: hosted Linux runners expose /dev/kvm but only to root until a
      # udev rule opens it. Without it the script falls back to TCG, which
      # still works, about ten times slower.
      - name: boot the ISO under UEFI, BIOS and Secure Boot
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          status=0
          for fw in uefi bios; do
            python3 tests/iso-boot.py --iso installer.iso --firmware "$fw" --media usb \
              --timeout 600 --out iso-boot || status=1
          done
          python3 tests/iso-boot.py --iso installer.iso --firmware uefi-sb-ms --media usb \
            --expect refused --timeout 300 --out iso-boot || status=1
          if [ "$SIGNED" = true ]; then
            nix shell --inputs-from . nixpkgs#python3Packages.virt-firmware -c \
              python3 tests/iso-boot.py --iso installer.iso --firmware uefi-sb --media usb \
                --enroll keys/secure-boot-db.pem --timeout 600 --out iso-boot || status=1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: iso-boot-screens
          path: iso-boot/*.png
          if-no-files-found: ignore

  # Which tags release-media builds. A tag push builds that tag. A manual run
  # with `release_tags` builds the tags it names, or with "missing" every
  # published release that carries no installer ISO. Tags from before the
  # edge gateway image (v0.1.0 to v0.1.6) cannot build the media and are
  # skipped with a notice.
  release-plan:
    name: "release: pick the tags to publish"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tags }}
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          WANT: ${{ inputs.release_tags }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WANT:-}" ]; then
            candidates="$GITHUB_REF_NAME"
          elif [ "$WANT" = missing ]; then
            candidates=$(gh api --paginate "repos/${REPO}/releases?per_page=100" --jq \
              '.[] | select(.draft | not) | select([.assets[].name | endswith(".iso")] | any | not) | .tag_name')
          else
            candidates="$WANT"
          fi
          picked=""
          for t in $candidates; do
            if ! git rev-parse -q --verify "refs/tags/${t}" >/dev/null; then
              echo "::error::${t} is not a tag in this repository"
              exit 1
            fi
            if ! git grep -q losos-disk-edge-qcow2 "refs/tags/${t}" -- flake.nix flake; then
              echo "::notice::${t} predates the release media and is skipped"
              continue
            fi
            picked="${picked}${t}"$'\n'
          done
          tags=$(printf '%s' "$picked" | jq -Rnc '[inputs | select(length > 0)]')
          echo "publishing: ${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

  release-media:
    name: "release: publish installer ISO, demo QCOW2 and edge gateway QCOW2"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A tag push needs its own run's builds; a manual run for older tags
    # builds everything from each tag's tree and needs none of them.
    if: >-
      ${{ !cancelled() && needs.release-plan.result == 'success'
        && needs.release-plan.outputs.tags != '[]'
        && (inputs.release_tags
          || (needs.iso.result == 'success' && needs.losos-ctl.result == 'success'
            && needs.registrar-and-ui.result == 'success')) }}
    needs: [release-plan, iso, losos-ctl, registrar-and-ui]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tag: ${{ fromJSON(needs.release-plan.outputs.tags || '[]') }}
    permissions:
      contents: write
      packages: write
    steps:
      # The tag's tree is what gets built. The workflow's own actions come
      # from this run's commit, checked out beside it in .ci, which nix's
      # git fetcher ignores because it is untracked.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ matrix.tag }}
      - uses: actions/checkout@v7
        with:
          path: .ci
      - uses: ./.ci/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-url: ${{ vars.LOSOS_PROXY_URL }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      - name: free runner disk for media builds
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      # Only a tag push has sibling builds to import; a manual run for older
      # tags builds them here.
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.release_tags }}
        with:
          name: losos-ctl-store
          path: ctl-cache
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.release_tags }}
        with:
          name: losos-admin-ui-store
          path: ui-cache
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.release_tags }}
        with:
          name: losos-registrar-store
          path: registrar-cache
      - name: import the sibling jobs' store exports
        if: ${{ !inputs.release_tags }}
        run: |
          xargs -r nix copy --from "file://$PWD/ctl-cache" --no-check-sigs < ctl-cache/store-paths
          xargs -r nix copy --from "file://$PWD/ui-cache" --no-check-sigs < ui-cache/store-paths
          xargs -r nix copy --from "file://$PWD/registrar-cache" --no-check-sigs < registrar-cache/store-paths
      # The media carry their own tag (flake/version.nix): written over the
      # committed value and staged, since nix's git fetcher reads staged
      # files. An installed box builds from the committed tree, so a tag the
      # file does not name gets a warning to bump it on main. Tags older than
      # the file are built as they are.
      - name: stamp the release tag
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if [ ! -f flake/version.nix ]; then
            echo "::notice::${TAG} has no flake/version.nix; its media show the version its tree carries"
            exit 0
          fi
          committed=$(nix eval --raw --file flake/version.nix)
          if [ "$committed" != "$TAG" ]; then
            echo "::warning::flake/version.nix says ${committed} but the tag is ${TAG}; bump it on main so installed boxes say ${TAG} too"
          fi
          printf '"%s"\n' "$TAG" > flake/version.nix
          git add flake/version.nix
      - run: nix build .#nixosConfigurations.iso.config.system.build.isoImage -L
      - run: mv result result-iso
      - run: nix build .#losos-disk-qcow2 -L
      - run: mv result result-qcow2
      # The edge gateway (wiki/Edge-Federation.md): small enough to be a
      # release asset, compressed here because make-disk-image writes a
      # sparse, uncompressed qcow2 and a download is neither.
      - run: nix build .#losos-disk-edge-qcow2 -L
      - run: mv result result-edge
      # Signing never holds a release back. Before the key ceremony there is
      # no certificate and the release says so. Once there is one, a missing
      # secret or a failed sign or verify leaves the ISO as `nix build` made
      # it, raises a warning on the run, and the release says *Not signed*
      # and why. The tag still publishes its media.
      #
      # The same key signs SHA256SUMS: the loader's Authenticode signature is
      # over a PE digest structure and this one is a plain PKCS#1 signature
      # over the text, so the two cannot be confused for each other, and one
      # certificate on the release page verifies both.
      - name: sign the ISO's UEFI loader and the checksum list
        id: sign
        env:
          SECURE_BOOT_DB_KEY: ${{ secrets.SECURE_BOOT_DB_KEY }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          iso="losos-installer-${TAG}.iso"
          qcow2="losos-demo-${TAG}.qcow2"
          edge="losos-edge-gateway-${TAG}.qcow2"
          cp -L result-iso/iso/*.iso "./${iso}"
          chmod u+w "./${iso}"
          cp -L result-qcow2/*.qcow2 "./${qcow2}"
          nix shell nixpkgs#qemu-utils -c qemu-img convert -c -O qcow2 result-edge/*.qcow2 "./${edge}"
          unsigned() {
            # $1 is why, for the release body; $2 the warning on the run.
            echo "::warning::$2"
            echo "### Release is not signed" >> "$GITHUB_STEP_SUMMARY"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            sha256sum "$iso" "$qcow2" "$edge" | tee SHA256SUMS
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "unsignedReason=$1" >> "$GITHUB_OUTPUT"
          }
          if ! grep -q '^-----BEGIN CERTIFICATE-----' keys/secure-boot-db.pem; then
            unsigned no-certificate "keys/secure-boot-db.pem carries no certificate: this release is unsigned (run provisioning/secure-boot/keygen.sh)"
            exit 0
          fi
          if [ -z "$SECURE_BOOT_DB_KEY" ]; then
            unsigned no-key "keys/secure-boot-db.pem is committed but the SECURE_BOOT_DB_KEY secret is missing: this release is unsigned"
            exit 0
          fi
          set +e
          (
            set -euo pipefail
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$SECURE_BOOT_DB_KEY" > "$key"
            nix run .#losos-sign-iso -- sign --key "$key" --cert keys/secure-boot-db.pem "./${iso}"
            nix run .#losos-sign-iso -- verify --cert keys/secure-boot-db.pem "./${iso}"
            sha256sum "$iso" "$qcow2" "$edge" | tee SHA256SUMS
            openssl dgst -sha256 -sign "$key" -out SHA256SUMS.sig SHA256SUMS
            openssl x509 -in keys/secure-boot-db.pem -out losos-secure-boot-db.pem
            openssl x509 -in keys/secure-boot-db.pem -outform DER -out losos-secure-boot-db.cer
            openssl dgst -sha256 -verify <(openssl x509 -pubkey -noout -in losos-secure-boot-db.pem) \
              -signature SHA256SUMS.sig SHA256SUMS
          )
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Sign works in place, so a failure part way may have left the
            # loader half written. Start again from the built image.
            rm -f SHA256SUMS SHA256SUMS.sig losos-secure-boot-db.pem losos-secure-boot-db.cer
            cp -L --remove-destination result-iso/iso/*.iso "./${iso}"
            unsigned failed "signing the ISO or SHA256SUMS failed (exit ${status}): this release is unsigned"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(openssl x509 -in losos-secure-boot-db.pem -noout -fingerprint -sha256 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: stage the media
        id: stage
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          iso="losos-installer-${TAG}.iso"
          qcow2="losos-demo-${TAG}.qcow2"
          edge="losos-edge-gateway-${TAG}.qcow2"
          sha256sum "$edge" | tee "${edge}.sha256"
          {
            echo "edgeName=${edge}"
            echo "edgeSize=$(stat -c%s "$edge")"
            echo "edgeSha256=$(cut -d' ' -f1 < "${edge}.sha256")"
            echo "edgeStorePath=$(readlink -f result-edge)"
          } >> "$GITHUB_OUTPUT"
          sha256sum "$iso" | tee "${iso}.sha256"
          sha256sum "$qcow2" | tee "${qcow2}.sha256"
          {
            echo "isoName=${iso}"
            echo "isoSize=$(stat -c%s "$iso")"
            echo "isoSha256=$(cut -d' ' -f1 < "${iso}.sha256")"
            echo "isoStorePath=$(readlink -f result-iso)"
            echo "qcow2Name=${qcow2}"
            echo "qcow2Size=$(stat -c%s "$qcow2")"
            echo "qcow2Sha256=$(cut -d' ' -f1 < "${qcow2}.sha256")"
            echo "qcow2StorePath=$(readlink -f result-qcow2)"
          } >> "$GITHUB_OUTPUT"
      - name: publish the media to GHCR
        id: ghcr
        env:
          TAG: ${{ matrix.tag }}
          ISO_NAME: ${{ steps.stage.outputs.isoName }}
          QCOW2_NAME: ${{ steps.stage.outputs.qcow2Name }}
          EDGE_NAME: ${{ steps.stage.outputs.edgeName }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GHCR wants a lowercase repository path. Each medium is its own
          # package so it can be pulled (and its retention managed) alone:
          #   ghcr.io/<owner>/<repo>-installer-iso:<tag>
          #   ghcr.io/<owner>/<repo>-demo-qcow2:<tag>
          base="ghcr.io/${REPO,,}"
          oras="nix run nixpkgs#oras --"
          echo "$GH_TOKEN" | $oras login ghcr.io -u "$ACTOR" --password-stdin
          push() {
            local pkg="$1" file="$2" type="$3"
            $oras push "${base}-${pkg}:${TAG}" \
              --artifact-type "$type" \
              --annotation "org.opencontainers.image.source=https://github.com/${REPO}" \
              --annotation "org.opencontainers.image.version=${TAG}" \
              "${file}:${type}" "${file}.sha256:text/plain"
          }
          push installer-iso "$ISO_NAME" application/vnd.losos.installer.iso.v1
          push demo-qcow2 "$QCOW2_NAME" application/vnd.losos.demo.qcow2.v1
          push edge-gateway-qcow2 "$EDGE_NAME" application/vnd.losos.edge-gateway.qcow2.v1
          {
            echo "isoRef=${base}-installer-iso:${TAG}"
            echo "qcow2Ref=${base}-demo-qcow2:${TAG}"
            echo "edgeRef=${base}-edge-gateway-qcow2:${TAG}"
          } >> "$GITHUB_OUTPUT"
      # The ISO's download is the GitHub release asset: at ~1.5 GB it fits under
      # GitHub's 2 GiB per-asset limit, which github-release checks before
      # uploading. The demo QCOW2 does not fit, so GHCR is its only home. The
      # asset URL is deterministic, so it can be written here before the upload.
      - name: compose release metadata
        id: meta
        env:
          TAG: ${{ matrix.tag }}
          REPO: ${{ github.repository }}
          ISO_NAME: ${{ steps.stage.outputs.isoName }}
          ISO_SIZE: ${{ steps.stage.outputs.isoSize }}
          ISO_SHA256: ${{ steps.stage.outputs.isoSha256 }}
          ISO_STORE_PATH: ${{ steps.stage.outputs.isoStorePath }}
          ISO_REF: ${{ steps.ghcr.outputs.isoRef }}
          QCOW2_NAME: ${{ steps.stage.outputs.qcow2Name }}
          QCOW2_SIZE: ${{ steps.stage.outputs.qcow2Size }}
          QCOW2_SHA256: ${{ steps.stage.outputs.qcow2Sha256 }}
          QCOW2_STORE_PATH: ${{ steps.stage.outputs.qcow2StorePath }}
          QCOW2_REF: ${{ steps.ghcr.outputs.qcow2Ref }}
          EDGE_NAME: ${{ steps.stage.outputs.edgeName }}
          EDGE_SIZE: ${{ steps.stage.outputs.edgeSize }}
          EDGE_SHA256: ${{ steps.stage.outputs.edgeSha256 }}
          EDGE_STORE_PATH: ${{ steps.stage.outputs.edgeStorePath }}
          EDGE_REF: ${{ steps.ghcr.outputs.edgeRef }}
        run: |
          set -euo pipefail
          iso_url="${GITHUB_SERVER_URL}/${REPO}/releases/download/${TAG}/${ISO_NAME}"
          edge_url="${GITHUB_SERVER_URL}/${REPO}/releases/download/${TAG}/${EDGE_NAME}"

          jq -n \
            --arg version "$TAG" \
            --arg iso "$ISO_NAME" \
            --arg isoSha "$ISO_SHA256" \
            --argjson isoSize "$ISO_SIZE" \
            --arg isoPath "$ISO_STORE_PATH" \
            --arg isoUrl "$iso_url" \
            --arg isoRef "$ISO_REF" \
            --arg qcow2 "$QCOW2_NAME" \
            --arg qcow2Sha "$QCOW2_SHA256" \
            --argjson qcow2Size "$QCOW2_SIZE" \
            --arg qcow2Path "$QCOW2_STORE_PATH" \
            --arg qcow2Ref "$QCOW2_REF" \
            --arg edge "$EDGE_NAME" \
            --arg edgeSha "$EDGE_SHA256" \
            --argjson edgeSize "$EDGE_SIZE" \
            --arg edgePath "$EDGE_STORE_PATH" \
            --arg edgeUrl "$edge_url" \
            --arg edgeRef "$EDGE_REF" \
            '{
               version:$version,
               iso:{name:$iso, sha256:$isoSha, size:$isoSize, storePath:$isoPath,
                    url:$isoUrl, oci:$isoRef},
               qcow2:{name:$qcow2, sha256:$qcow2Sha, size:$qcow2Size, storePath:$qcow2Path,
                      oci:$qcow2Ref},
               edgeGateway:{name:$edge, sha256:$edgeSha, size:$edgeSize, storePath:$edgePath,
                            url:$edgeUrl, oci:$edgeRef}
             }' > release.json
          cat release.json
          echo "isoUrl=${iso_url}" >> "$GITHUB_OUTPUT"
          echo "edgeUrl=${edge_url}" >> "$GITHUB_OUTPUT"
      - name: compose the release body
        id: body
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
          UNSIGNED_REASON: ${{ steps.sign.outputs.unsignedReason }}
          ISO_NAME: ${{ steps.stage.outputs.isoName }}
          ISO_REF: ${{ steps.ghcr.outputs.isoRef }}
          ISO_URL: ${{ steps.meta.outputs.isoUrl }}
          ISO_SUM: ${{ steps.stage.outputs.isoSha256 }}
          ISO_SIZE: ${{ steps.stage.outputs.isoSize }}
          ISO_STORE_PATH: ${{ steps.stage.outputs.isoStorePath }}
          QCOW2_NAME: ${{ steps.stage.outputs.qcow2Name }}
          QCOW2_REF: ${{ steps.ghcr.outputs.qcow2Ref }}
          QCOW2_SUM: ${{ steps.stage.outputs.qcow2Sha256 }}
          QCOW2_SIZE: ${{ steps.stage.outputs.qcow2Size }}
          QCOW2_STORE_PATH: ${{ steps.stage.outputs.qcow2StorePath }}
          EDGE_NAME: ${{ steps.stage.outputs.edgeName }}
          EDGE_URL: ${{ steps.meta.outputs.edgeUrl }}
          EDGE_SUM: ${{ steps.stage.outputs.edgeSha256 }}
          EDGE_SIZE: ${{ steps.stage.outputs.edgeSize }}
          EDGE_REF: ${{ steps.ghcr.outputs.edgeRef }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # GHCR package pages, one per medium, under the repository's Packages
          # tab. The package name is the image path after the owner, which the
          # GHCR step lowercases, so this does too.
          repo_name="${REPO#*/}"
          pkgs="${GITHUB_SERVER_URL}/${REPO}/pkgs/container"
          iso_pkg="${pkgs}/${repo_name,,}-installer-iso"
          qcow2_pkg="${pkgs}/${repo_name,,}-demo-qcow2"
          # oras pushes a single file as one raw layer, not a tarball, so the
          # layer's digest is the file's own sha256 and the blob URL can be
          # written without asking the registry. GHCR still wants a bearer
          # token for it, even for a public package; an anonymous one will do.
          qcow2_repo="${REPO,,}-demo-qcow2"
          qcow2_blob="https://ghcr.io/v2/${qcow2_repo}/blobs/sha256:${QCOW2_SUM}"
          iso_human=$(awk -v b="$ISO_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          qcow2_human=$(awk -v b="$QCOW2_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          release_dir="${ISO_URL%/*}"
          # The tag's commit, which on a manual run is not this run's.
          SHA=$(git rev-parse HEAD)
          if [ "$SIGNED" = true ]; then
            signing=$(cat <<SIGNED_EOF
          **Signed.** The ISO's UEFI loader carries a Secure Boot signature by
          the LosOS certificate (SHA-256 fingerprint \`${FINGERPRINT}\`), the
          same certificate that signs \`SHA256SUMS\`. Verify the checksum list
          and the medium with:

          \`\`\`sh
          curl -fsSLO ${release_dir}/SHA256SUMS
          curl -fsSLO ${release_dir}/SHA256SUMS.sig
          curl -fsSLO ${release_dir}/losos-secure-boot-db.pem
          openssl dgst -sha256 -verify <(openssl x509 -pubkey -noout -in losos-secure-boot-db.pem) \\
            -signature SHA256SUMS.sig SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          To boot it with Secure Boot on, enrol \`losos-secure-boot-db.cer\`
          (the same certificate in DER; the stick also carries it at
          \`EFI/losos/\`) into the firmware's \`db\`; the handbook's install
          page has the steps. A firmware with only the stock Microsoft keys
          refuses the stick, which is the signature working.
          SIGNED_EOF
          )
          elif [ "$UNSIGNED_REASON" = no-certificate ]; then
            signing=$(cat <<UNSIGNED_EOF
          **Not signed.** No Secure Boot certificate was committed when this
          tag was built, so the UEFI loader is unsigned: turn Secure Boot off
          to boot it. \`SHA256SUMS\` is here, unsigned.
          UNSIGNED_EOF
          )
          else
            signing=$(cat <<UNSIGNED_EOF
          **Not signed.** This tag could not be signed when it was built, so
          the UEFI loader is unsigned even though LosOS has a Secure Boot
          certificate: turn Secure Boot off to boot it, or use a signed
          release. \`SHA256SUMS\` is here, unsigned.
          UNSIGNED_EOF
          )
          fi
          edge_human=$(awk -v b="$EDGE_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          {
            echo "body<<RELEASE_BODY_EOF"
            cat <<BODY
          ### Installer ISO

          **[${ISO_NAME}](${ISO_URL})** — ${iso_human}

          \`\`\`
          sha256  ${ISO_SUM}
          \`\`\`

          Verify it with:

          \`\`\`sh
          curl -fsSLO ${ISO_URL}.sha256
          curl -fsSLO ${ISO_URL}
          sha256sum -c ${ISO_NAME}.sha256
          \`\`\`

          ${signing}

          Write it to a USB stick and boot the target machine; the installer
          partitions, encrypts and installs unattended. It needs a network
          connection, because it clones the flake at run time.

          Built from \`${SHA:0:7}\` by [this workflow run](${RUN_URL}).

          ### Demo QCOW2

          ${QCOW2_NAME} — ${qcow2_human}, too large for a GitHub release asset,
          so it lives on GHCR: [package page](${qcow2_pkg}).

          \`\`\`
          sha256  ${QCOW2_SUM}
          \`\`\`

          Download the layer directly with curl (the token is anonymous):

          \`\`\`sh
          token=\$(curl -fsS "https://ghcr.io/token?scope=repository:${qcow2_repo}:pull" | jq -r .token)
          curl -fL -H "Authorization: Bearer \$token" -o ${QCOW2_NAME} \\
            ${qcow2_blob}
          echo "${QCOW2_SUM}  ${QCOW2_NAME}" | sha256sum -c
          \`\`\`

          Or pull it with [oras](https://oras.land), which fetches the
          \`.sha256\` beside it:

          \`\`\`sh
          oras pull ${QCOW2_REF}
          sha256sum -c ${QCOW2_NAME}.sha256
          \`\`\`

          This image is for demos and development only. It does **not** carry the
          appliance's TPM-sealed encrypted disk layout, so anyone who can read
          the file can read its data.

          The installer ISO is on GHCR too ([package page](${iso_pkg})):
          \`oras pull ${ISO_REF}\`

          ### Edge gateway QCOW2

          **[${EDGE_NAME}](${EDGE_URL})** — ${edge_human}

          \`\`\`
          sha256  ${EDGE_SUM}
          \`\`\`

          A LosOS edge for your own network: boot it on Proxmox, libvirt or
          VirtualBox with a NIC on the LAN, and boxes installed from the ISO
          find it on their own and are reachable through it. Log in on its
          console as \`root\` (first password \`losos\`, changed at first
          login) and run \`losos-edge uplink set ...\` with the tenant row an
          official edge gave you to reach them from anywhere. See the
          [Edge federation](https://github.com/${REPO}/wiki/Edge-Federation)
          page. Also on GHCR: \`oras pull ${EDGE_REF}\`.

          ---

          Build the installer ISO from this tag instead:

          \`\`\`sh
          nix build .#nixosConfigurations.iso.config.system.build.isoImage
          \`\`\`

          Build the demo QCOW2 instead:

          \`\`\`sh
          nix build .#losos-disk-qcow2
          \`\`\`

          Build the edge gateway QCOW2 instead:

          \`\`\`sh
          nix build .#losos-disk-edge-qcow2
          \`\`\`

          BODY
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      # github-release refuses anything over 2 GiB before spending the upload,
      # so an ISO that outgrows the limit fails this step loudly rather than
      # producing a release without it.
      - uses: ./.ci/.github/actions/github-release
        with:
          tag: ${{ matrix.tag }}
          body: ${{ steps.body.outputs.body }}
          assets: |
            ${{ steps.stage.outputs.isoName }}
            ${{ steps.stage.outputs.isoName }}.sha256
            ${{ steps.stage.outputs.qcow2Name }}.sha256
            SHA256SUMS
            ${{ steps.sign.outputs.signed == 'true' && 'SHA256SUMS.sig' || '' }}
            ${{ steps.sign.outputs.signed == 'true' && 'losos-secure-boot-db.pem' || '' }}
            ${{ steps.sign.outputs.signed == 'true' && 'losos-secure-boot-db.cer' || '' }}
            ${{ steps.stage.outputs.edgeName }}
            ${{ steps.stage.outputs.edgeName }}.sha256
            release.json
          token: ${{ secrets.GITHUB_TOKEN }}
      # The curl download in the release notes only works once the GHCR
      # package is public. A package pushed with GITHUB_TOKEN can start out
      # private, and nothing else here would notice, so check the way a
      # stranger would: an anonymous token and a HEAD on the layer. A warning,
      # not a failure, because the release above is already published and
      # visibility is a one-time switch in the package's settings.
      - name: check the QCOW2 layer is publicly downloadable
        env:
          REPO: ${{ github.repository }}
          QCOW2_SUM: ${{ steps.stage.outputs.qcow2Sha256 }}
        run: |
          set -uo pipefail
          r="${REPO,,}-demo-qcow2"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${r}:pull" | jq -r '.token // empty')
          if [ -n "$token" ] && curl -fsSI -o /dev/null -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/${r}/blobs/sha256:${QCOW2_SUM}"; then
            echo "the QCOW2 layer is publicly downloadable"
          else
            echo "::warning::ghcr.io/${r} is not publicly readable, so the release notes' curl download will fail. Make the package public: ${GITHUB_SERVER_URL}/${REPO}/pkgs/container/${r#*/} -> Package settings -> Change visibility."
          fi
