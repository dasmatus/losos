name: edge-credentials

# Seals the edge's keys from this repository's Actions secrets. Each secret
# that is set is piped over SSH into `losos-seal-credential` on the edge
# (modules/edge-credentials.nix), which checks its shape, seals it with
# systemd-creds and restarts the unit that reads it. Nothing is written to
# disk on the runner, and the edge keeps only the sealed blob.
#
#   STRIPE_KEY             the platform's Stripe secret or restricted key.
#                          sk_test_/rk_test_ runs the market in test mode,
#                          sk_live_/rk_live_ in live mode; the edge reads the
#                          mode off the key.
#   STRIPE_WEBHOOK_SECRET  optional: the whsec_ signing secrets of the two
#                          webhook endpoints, one per line, from the same mode
#                          as the key
#   CLAUDE_KEY             the Claude API key (sk-ant-...)
#   EDGE_SSH_KEY           the private half of losos.edge.credentials.deployKey
#   EDGE_SSH_HOST          the edge's address (a secret or a variable)
#   EDGE_SSH_KNOWN_HOSTS   its line from `ssh-keyscan <host>`, checked so the
#                          keys only ever go to that machine (secret or variable)
#   EDGE_SSH_PORT          optional, 22 when unset (secret or variable)
#
# Run it from the Actions tab after adding or rotating a secret. It only runs
# on main, so a branch cannot send the keys anywhere else.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge-credentials
  cancel-in-progress: false

jobs:
  seal:
    name: "edge: seal keys with systemd-creds"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
      EDGE_SSH_KEY: ${{ secrets.EDGE_SSH_KEY }}
      EDGE_SSH_HOST: ${{ secrets.EDGE_SSH_HOST || vars.EDGE_SSH_HOST }}
      EDGE_SSH_KNOWN_HOSTS: ${{ secrets.EDGE_SSH_KNOWN_HOSTS || vars.EDGE_SSH_KNOWN_HOSTS }}
      EDGE_SSH_PORT: ${{ secrets.EDGE_SSH_PORT || vars.EDGE_SSH_PORT || '22' }}
    steps:
      - name: check the keys
        run: |
          set -euo pipefail
          # Only the mode is printed, never the key.
          case "$STRIPE_KEY" in
            "") echo "STRIPE_KEY is not set; the Stripe key is left as it is" ;;
            sk_test_?* | rk_test_?*) echo "STRIPE_KEY is a test key: the market will take test cards only" ;;
            sk_live_?* | rk_live_?*) echo "STRIPE_KEY is a live key: the market will charge real cards" ;;
            *)
              echo "::error::STRIPE_KEY is neither a test nor a live Stripe secret key (sk_test_, sk_live_, rk_test_ or rk_live_)"
              exit 1
              ;;
          esac
          case "$CLAUDE_KEY" in
            "") echo "CLAUDE_KEY is not set; the Claude key is left as it is" ;;
            sk-ant-?*) echo "CLAUDE_KEY is a Claude API key" ;;
            *)
              echo "::error::CLAUDE_KEY does not look like a Claude API key (sk-ant-...)"
              exit 1
              ;;
          esac
          for v in EDGE_SSH_KEY EDGE_SSH_HOST EDGE_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set; see the comment at the top of this workflow"
              exit 1
            fi
          done

      - name: seal them on the edge
        run: |
          set -euo pipefail
          umask 077
          known=$(mktemp)
          trap 'rm -f "$known"; ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$EDGE_SSH_KNOWN_HOSTS" >"$known"
          # The deploy key goes to an agent from stdin, never to a file.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$EDGE_SSH_KEY" | ssh-add - 2>/dev/null

          seal() {
            printf '%s' "$2" | ssh -p "$EDGE_SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known" \
              "root@$EDGE_SSH_HOST" "$1"
          }

          sealed=0
          if [ -n "$STRIPE_KEY" ]; then seal stripe-secret-key "$STRIPE_KEY"; sealed=$((sealed + 1)); fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then seal stripe-webhook-secret "$STRIPE_WEBHOOK_SECRET"; sealed=$((sealed + 1)); fi
          if [ -n "$CLAUDE_KEY" ]; then seal claude-key "$CLAUDE_KEY"; sealed=$((sealed + 1)); fi
          if [ "$sealed" -eq 0 ]; then
            echo "::warning::none of STRIPE_KEY, STRIPE_WEBHOOK_SECRET or CLAUDE_KEY is set; nothing was sealed"
          fi
