name: lockfile-updates

on:
  schedule:
    # ~04:17 UTC Mondays, offset from the main scheduled CI run.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: lockfile-updates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "bot: weekly lockfile refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR branch is pushed later with LOCKFILE_UPDATE_TOKEN so the
          # resulting push/PR can trigger downstream CI.
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # flake.lock and devenv.{yaml,lock} are coupled: the flake's nixpkgs rev
      # must be copied into devenv.yaml before devenv.lock is regenerated.
      - name: refresh lockfiles
        run: |
          set -euo pipefail

          devenv_source="$(python3 - <<'PY'
          import json
          from pathlib import Path

          original = json.loads(Path("devenv.lock").read_text())["nodes"]["devenv"]["original"]
          if original["type"] != "github":
              raise SystemExit("unsupported devenv source type")

          source = f'github:{original["owner"]}/{original["repo"]}'
          if "dir" in original:
              source = f'{source}?dir={original["dir"]}'
          print(source)
          PY
          )"

          nix flake update

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          rev = json.loads(Path("flake.lock").read_text())["nodes"]["nixpkgs"]["locked"]["rev"]
          path = Path("devenv.yaml")
          text = path.read_text()
          updated, count = re.subn(
              r"(^\s+url:\s+github:NixOS/nixpkgs/)[0-9a-f]{40}(\s*$)",
              rf"\g<1>{rev}\g<2>",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("failed to sync devenv.yaml nixpkgs revision")
          path.write_text(updated)
          PY

          nix run "$devenv_source" -- update

          devenv_locked_source="$(python3 - <<'PY'
          import json
          from pathlib import Path

          locked = json.loads(Path("devenv.lock").read_text())["nodes"]["devenv"]["locked"]
          if locked["type"] != "github":
              raise SystemExit("unsupported devenv source type")

          source = f'github:{locked["owner"]}/{locked["repo"]}/{locked["rev"]}'
          if "dir" in locked:
              source = f'{source}?dir={locked["dir"]}'
          print(source)
          PY
          )"
          nix run "$devenv_locked_source" -- update

          python3 - <<'PY'
          import json
          from pathlib import Path

          flake_rev = json.loads(Path("flake.lock").read_text())["nodes"]["nixpkgs"]["locked"]["rev"]
          devenv_rev = json.loads(Path("devenv.lock").read_text())["nodes"]["nixpkgs"]["locked"]["rev"]
          if flake_rev != devenv_rev:
              raise SystemExit(
                  f"devenv.lock drifted from flake.lock: {devenv_rev} != {flake_rev}"
              )
          PY

          nix develop -c bash -euo pipefail -c '
            cargo update --manifest-path backend/Cargo.toml
            cargo update --manifest-path backend-registrar/Cargo.toml
            npm update --prefix admin-ui/app --package-lock-only
            npm update --prefix admin-ui/design-system/react --package-lock-only
          '
      - name: open or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCKFILE_UPDATE_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LOCKFILE_UPDATE_TOKEN}" ]; then
            echo "LOCKFILE_UPDATE_TOKEN is required for branch pushes that trigger CI." >&2
            exit 1
          fi

          branch=bot/weekly-lockfile-updates
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          git add \
            flake.lock \
            devenv.yaml \
            devenv.lock \
            backend/Cargo.lock \
            backend-registrar/Cargo.lock \
            admin-ui/app/package-lock.json \
            admin-ui/design-system/react/package-lock.json

          if git diff --cached --quiet; then
            echo "lockfiles already up to date"
            exit 0
          fi

          body="$(mktemp)"
          cat >"$body" <<'EOF'
          ## Summary
          - refresh the repository lockfiles
          - keep `flake.lock`, `devenv.yaml` and `devenv.lock` in sync
          - refresh Cargo and npm lockfiles
          EOF
          git commit -m "chore: weekly lockfile updates"
          auth_header="$(
            printf 'x-access-token:%s' "$LOCKFILE_UPDATE_TOKEN" | base64 -w0
          )"
          remote_sha="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
              ls-remote origin "refs/heads/$branch" | awk '{print $1}'
          )"
          push_args=(origin "$branch")
          if [ -n "$remote_sha" ]; then
            push_args=(--force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch")
          fi
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push "${push_args[@]}"

          export GH_TOKEN="${LOCKFILE_UPDATE_TOKEN}"
          number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json number,headRefName,isCrossRepository \
              --jq \
              '.[] | select(.headRefName == "'"$branch"'" and (.isCrossRepository | not)) | .number' \
              | head -n1
          )"
          if [ -n "$number" ]; then
            gh pr edit "$number" \
              --title "chore: weekly lockfile updates" \
              --body-file "$body"
          else
            head_ref="${GITHUB_REPOSITORY_OWNER}:$branch"
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$head_ref" \
              --title "chore: weekly lockfile updates" \
              --body-file "$body"
          fi
