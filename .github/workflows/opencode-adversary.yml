name: opencode adversary

# ── What this is ────────────────────────────────────────────────────────────
#
# The red team the design in docs/superpowers/specs/2026-11-09-adversary-
# testing-design.md describes: on a schedule, an OpenCode agent attacks a
# running appliance built from main, and every boundary crossing it can
# DEMONSTRATE becomes a pull request to main. It is not a code-review bot;
# a finding is `status: confirmed` only with a reproducible request or
# script the report job can validate.
#
# Triggers and guards:
#
#   - Weekly cron plus a manual `workflow_dispatch`. Schedules are the cron;
#     pushes never re-run it. The dispatch input picks the scope; only the
#     `core` tier below is wired so far — dispatching anything else runs
#     `core` with a notice, until edge, mesh and stack tiers land on the
#     same pattern.
#   - The whole workflow is inert (green, with a notice) until
#     `OPENCODE_API_KEY` exists as an actions secret, exactly like
#     opencode-autofix.yml.
#   - The agent gets NO GitHub token and no secrets: the report job below is
#     what touches the repository, and it turns only the agent's
#     schema-validated findings into the PR body.
#   - The agent's blast radius is the runner, its checkout (writes confined
#     to adversary/ and adversary-tool/ by its brief) and the QEMU appliance
#     it attacks over the network, through the tap at 192.168.77.1/24.
#     There is no SSH, no shell, no root on the box; the design says the
#     adversary must never touch anything beyond this link.
#
# v1, core tier: the box boots UNCLAIMED (the discovery check's box), so the
# agent races the claim window itself; once it claims — which is the
# first-contact scenario the threat model admits — it works the sections,
# token and throttle boundaries as the brief says. The literal iso-install
# disk, the edge and mesh tiers and the browser-based stack tier are the
# design's next steps, noted in the design's "Left to the builder".

on:
  schedule:
    # Mondays 06:39 UTC: offset from lockfile-updates (04:17) and the
    # freshness check (05:23), far from ci.yml's own scheduled slot.
    - cron: "39 6 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "tier to run; core is the wired one"
        type: choice
        default: core
        options: [core, edge, mesh, stack, full]

permissions:
  contents: write
  pull-requests: write

env:
  # OpenCode Zen, free tier; the same pair opencode-autofix.yml runs, with
  # the same rotation caveat: check https://opencode.ai/models/#free-models
  # when one here disappears, and re-check zero-retention.
  OC_MODEL: opencode/glm-5.3-flash-free
  OC_FALLBACK_MODEL: opencode/deepseek-v4.1-flash-free

concurrency:
  # A manual dispatch supersedes a still-running scheduled week; the
  # schedule is weekly, so losing one run's tail costs coverage, not work.
  group: opencode-adversary
  cancel-in-progress: true

jobs:
  gate:
    name: "gate: does this run get to attack"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      tier: ${{ steps.decide.outputs.tier }}
    steps:
      - name: decide
        id: decide
        env:
          HAS_API_KEY: ${{ secrets.OPENCODE_API_KEY != '' }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          skip() { echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }
          [ "$HAS_API_KEY" = true ] || skip "OPENCODE_API_KEY is not set in the repository's actions secrets; the adversary stayed inert"
          tier="$SCOPE"
          if [ "$tier" != core ]; then
            echo "::notice::the '$tier' tier is not wired yet; running core (see the design's tiers)"
            tier=core
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  adversary:
    name: "adversary: boot the box, attack, report"
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      # The netboot box's build writes are heavy; clear the preloads first.
      - name: free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: free the KVM device to the user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: build the test box
        run: |
          set -o pipefail
          nix build .#losos-disk-discovery-box -L 2>&1 | tee "$RUNNER_TEMP/nix-build.log"

      - name: put the link up; the agent's LAN is the tap
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-system-x86 nmap jq socat
          sudo ip tuntap add dev tap0 mode tap user "$USER"
          sudo ip addr add 192.168.77.1/24 dev tap0
          sudo ip link set tap0 up

      - name: copy the box out of the Nix store
        run: |
          set -euo pipefail
          mkdir -p run
          cp -L result/* discovery-box/
          ls -la discovery-box

      # The driver waits for the appliance's own bring-up (up to half an
      # hour) and leaves QEMU alive for the steps that follow.
      - name: boot the box, unclaimed
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 nix/tests/adversary/boot.py boot \
            --box discovery-box --state run/state.json --kvm

      # The brief interpolates nothing the agent says or writes; only the
      # state file's path and the tier. The finding schema, the exclusions
      # and the budget live in the design the agent reads first.
      - name: OpenCode attacks the box
        id: oc
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ env.OC_MODEL }}
          # Sessions carry the brief and the findings; the share default for
          # a public repository would publish them.
          share: "false"
          use_github_token: false
          prompt: |
            You are the LosOS adversary: a red-team agent working on a GitHub
            Actions runner in a checkout of the losos repository at main.

            Read, in this order, before anything else:
            1. docs/superpowers/specs/2026-11-09-adversary-testing-design.md
               — your rules of engagement: the standing priorities, the
               brute-force lane's budget and its boundaries, the finding
               schema, and every documented weakness you must NOT report.
            2. docs/security-model.md — the appliance's own model of what
               holds. A finding is a boundary it claims and the box does
               not deliver; guesses and code-audit opinions are not
               findings.
            3. adversary/coverage.md — the ledger of past weeks: attempt
               boundaries it names as never-attempted oldest first, and
               append this run's verdicts to it when you are done.

            The target: a real appliance, booted UNCLAIMED at 192.168.77.2,
            on the LAN this runner hosts at 192.168.77.1/24 (a tap the agent
            owns; scanning this link and 127.0.0.1 is in scope, and nothing
            else on the network is). Everything you need is in the state
            file ${{ github.workspace }}/run/state.json — the base URL, the
            box's TLS certificate (use `curl --cacert`, or `-k` if that is
            simpler), QEMU's PID and log. Nobody has claimed the box: the
            first caller to POST /api/setup/claim becomes its owner, the
            caller's problem is getting there first.

            Work the rounds in order and stop any round when its budget is
            spent:
            1. THE CLAIM WINDOW, while the box is unclaimed: race the claim;
               the bodies and hosts the security model says the route
               refuses (not application/json, Host that is not the box's
               hostname or its IP, Origin that does not match Host);
               misbehaviour around the ready: false spine; the claimed
               fail-closed reads. Claim the box only when the race work is
               done — and note exactly when.
            2. SECTIONS AND AUTHORIZATION, claimed: in the people pane,
               create a person with only `losos-viewers`, then attack the
               section map (backend/sections.json): GET beyond their read
               lanes, writes from a viewer, the group they must never hold
               (`losos-owner`), removing yourself or the last administrator,
               and `X-Losos-As` honoured with no admin Bearer.
            3. THE SPARE KEY AND THE THROTTLE: 10 bad Bearer tokens, watch
               429 and Retry-After, the window doubling to the 5-minute
               cap, the correct token inside the window refused and outside
               it accepted, and the count cleared by a correct token after.
               Probe the API's port directly: the model says it answers
               127.0.0.1 only, with an owner's iptables rule behind it.
            4. THE LAN-ONLY GUARD: admin routes must not answer to anything
               the model calls outside-LAN or loopback-shaped: probe
               192.168.77.1 (the runner's tap), spoofed-forwarded headers
               (X-Forwarded-For is only trusted where the model says), the
               box's own address from the box's side you cannot reach, and
               the mesh's 10.42.0.0/16 catch. Keep to port 443 and the
               route paths the admin UI serves.
            5. BRUTE-FORCE SALVOS, budget 2,000 guesses across the whole
               run, short salvos only: Authelia's /auth/ regulation window,
               the throttle's jump from 1 s to 5 min, and whether a refused
               guess is ever accepted by a retry. Entropy is not a finding.

            Exclusions, NOT findings — the model already owns these
            weaknesses; a report that restates one is a waste of your run:
            the shared admin/apps origin and the XSS chain behind it; the
            LAN's first-visit TLS trust; the throttle's per-address (and so
            spoofable) counting; the TPM key binding to no PCRs; the
            hardening left-out list (strict rp_filter, user namespaces,
            /tmp noexec) — the design names every one with its reason.

            Rules of engagement:
            - Write as you go. Every belief becomes a full finding file the
              moment you hold it: adversary/findings/YYYY-MM-DD-<slug>.md,
              frontmatter exactly like the design's schema section
              (boundary, claim, severity, status, state — `state: fresh-claim`
              before you claim, `state: claimed-viewer` after), the evidence
              transcript, and for `status: confirmed` a repro under
              adversary/tooling/<slug>/ (a script or a curl history that
              re-derives the crossing). A suspicion stays `status:
              suspicion` and gets no repro.
            - edit ONLY adversary/ and your scratch dir adversary-tool/.
              Nothing in docs/, modules/, backend/, nix/, .github/, edge/ —
              and never anything outside the checkout.
            - Tools: curl, jq, python3, openssl, nmap, socat are installed;
              you may apt-get more as `sudo` works passwordless. Know that
              192.168.77.x is the whole target; never send a request
              anywhere else (no DNS lookups, no update checks, no
              opencensus of any host), and never SSH into the box — there
              is no listener, and the attempt would be out of scope.
            - Mind the budget: ~2,000 guesses total; nothing long enough to
              lag the box; if a salvo could take it down, stop and note it
              as skipped instead. If the box dies despite that, the run is
              over: write what worked so far and end cleanly.
            - At the end, rewrite adversary/coverage.md: one line per
              attempted boundary saying held / crossed <finding file> /
              skipped: reason / budget-hit — and one line for the week.

      - name: OpenCode again, on the fallback free model
        id: oc-fallback
        if: steps.oc.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ env.OC_FALLBACK_MODEL }}
          share: "false"
          use_github_token: false
          prompt: |
            (The same brief as the primary model's run above, which failed;
            work it exactly as it says and see its files if any exist.)

            You are the LosOS adversary: a red-team agent working on a GitHub
            Actions runner in a checkout of the losos repository at main.

            Read, in this order, before anything else:
            1. docs/superpowers/specs/2026-11-09-adversary-testing-design.md
            2. docs/security-model.md
            3. adversary/coverage.md

            A real appliance is up UNCLAIMED at 192.168.77.2 (LAN
            192.168.77.1/24); read
            ${{ github.workspace }}/run/state.json for the address, the
            certificate, QEMU's PID and log. Attack in the rounds the
            design's brief orders (claim window, sections and
            authorization, spare key and throttle, LAN-only guard,
            brute-force salvos within its 2,000-guess budget), write every
            finding at once to adversary/findings/YYYY-MM-DD-<slug>.md in
            the design's schema (confirmed needs a repro under
            adversary/tooling/<slug>/), edit only adversary/ and
            adversary-tool/, and never raise anything the security model or
            the design already admit (the shared origin, TLS first visit,
            per-address throttle spoofing, TPM PCRs, the hardening left-out
            list). End by rewriting adversary/coverage.md with this week's
            verdicts per boundary.

      - name: pull the run's report together
        id: report
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 nix/tests/adversary/report.py adversary/findings run/report.json
          cat run/report.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adversary-run-${{ github.run_number }}
          path: |
            run/
            adversary/findings/
            adversary-tool/
          retention-days: 14

      # Two arms, one rule: the ledger always gets the week's verdicts, and
      # only `status: confirmed` findings open a PR. The PR's body comes
      # from report.json — the agent's prose stays in the files, and the
      # validated fields are what the body renders.
      - name: open the findings PR, or just pin the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "losos-ci-bot"
          git config user.email "losos-ci-bot@users.noreply.github.com"
          git checkout -b "adversary/run-${GITHUB_RUN_NUMBER}"
          git add adversary/
          confirmed=$(jq '.findings | length' run/report.json)
          if [ "$confirmed" -gt 0 ]; then
            # The body renders the validated fields only; the agent's prose
            # lives in the files the table links to.
            {
              echo "### Adversary run ${GITHUB_RUN_NUMBER}: ${confirmed} confirmed boundary closed"
              echo
              echo "_This week's run ([run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Each file carries the full statement and its repro; the schema is in the design doc. Suspicions ride in the run artifact, never here._"
              echo
              echo '| file | boundary | claim | severity | state |'
              echo '| ---- | -------- | ----- | -------- | ----- |'
              jq -r '.findings[] | select(.status == "confirmed") |
                "| \(.file) | \(.boundary) | \(.claim) | \(.severity) | \(.state) |"' \
                run/report.json
            } > run/body.md
            git commit -m "adversary: report run ${GITHUB_RUN_NUMBER}'s confirmed findings"
            git push origin "HEAD:adversary/run-${GITHUB_RUN_NUMBER}"
            gh pr create \
              --head "adversary/run-${GITHUB_RUN_NUMBER}" \
              --title "adversary: ${confirmed} confirmed finding(s) of run ${GITHUB_RUN_NUMBER}" \
              --body-file run/body.md
            gh pr merge --auto --squash "adversary/run-${GITHUB_RUN_NUMBER}" \
              || echo "::warning::auto-merge would not register (the repository setting may be off); the findings PR waits for a human"
          else
            git commit -m "chore: adversary run ${GITHUB_RUN_NUMBER} held every boundary it challenged [skip ci]" \
              || echo "::notice::the ledger wants no line changed this week"
            git push origin "HEAD:main" || true
          fi

      - name: show the tail of QEMU's log
        if: always()
        continue-on-error: true
        run: |
          tail -c 2000 "$(jq -r .qemu_log run/state.json)" || true

      - name: tear the box down
        if: always()
        run: |
          python3 nix/tests/adversary/boot.py kill --state run/state.json || true
