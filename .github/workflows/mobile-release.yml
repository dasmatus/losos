name: Mobile release

# The phone app's production builds, on every version tag, beside the ISO
# the release lane publishes (.github/workflows/ci.yml's release-media
# job). This workflow does not create or publish the release: ci.yml owns
# the draft-then-publish flow (immutable releases want every asset
# attached before the one-way publish), so the jobs here wait for the
# tag's draft release to exist and attach their assets to it, publish
# untouched (attach-release-asset.sh carries the how).
#
# Android signs with the repo secrets ANDROID_KEYSTORE_BASE64 (the upload
# key's PKCS12 store), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD, decoded into the environment that
# admin-ui/app/plugins/with-release-signing.js reads at prebuild time. The
# key is the app's upload key: the store file and its password are the
# pair to keep safe — losing them means a new app identity, not an update
# path. No copy of the key lives in the tree; the owner keeps the only
# backup.
#
# iOS cannot be signed yet: Apple issues its distribution certificate and
# provisioning profile, which needs the paid Apple Developer account the
# eas.json header's TODO says nobody carries. The iOS job builds the
# release shell unsigned (CODE_SIGNING_ALLOWED=NO, the simulator job's
# trick, extended to a device build) and attaches the .app zip marked as
# such — an artifact to diff and a placeholder, not an installable app.
# When the account exists, this job is the place the certificate secrets
# (a .p12 and a provisioning profile) slot into.
#
# A workflow_dispatch with dry_run builds and uploads the artifacts and
# stops before any release interaction — the lane's own rehearsal, on
# whatever tree the run checks out (a tag when the input names one, the
# dispatched branch otherwise).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.7.0 (a tag whose release is still a draft, or has none yet). Omit to build this branch's tree instead."
        type: string
        required: false
      dry_run:
        description: "Build and upload artifacts only; never touch the tag's release."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: "android: signed release APK"
    runs-on: ubuntu-latest
    # The build is the expo-apk job's shape (~40 min) and the release
    # attach waits up to four hours for ci.yml's draft release, which only
    # appears after the ISO chain has built.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: skip cleanly when the signing secrets are not here
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice::the Android signing secrets are not available here (fork or missing secrets): the release APK is skipped until ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD land"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.sign == 'true'
        with:
          bun-version-file: admin-ui/app/package.json
      - name: the workspace (the lockfile's tree)
        if: steps.secrets.outputs.sign == 'true'
        working-directory: admin-ui/app
        run: bun install --frozen-lockfile --ignore-scripts
      # The keystore never touches the checkout: it is decoded into
      # RUNNER_TEMP and named by the environment the signing plugin reads,
      # so a failed run's cleanup carries it away with the runner. The
      # secrets reach Gradle only through the environment, never argv and
      # never a file in the tree.
      - name: decode the keystore, export the signing environment
        if: steps.secrets.outputs.sign == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/losos-upload.keystore"
          {
            echo "LOSOS_RELEASE_STORE_FILE=$RUNNER_TEMP/losos-upload.keystore"
            echo "LOSOS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "LOSOS_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "LOSOS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      # CNG: the android/ project is generated, never committed (the
      # config's own header says so). LOSOS_VERSION pins the version to the
      # tag rather than the tree's committed nix/version.nix — release.yml
      # tags the tree before version.yml syncs main, so the tag's own file
      # can lag one release (losos-version.cjs reads the variable first).
      - name: prebuild android (the signing plugin reads the environment)
        if: steps.secrets.outputs.sign == 'true'
        working-directory: admin-ui/app
        env:
          LOSOS_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          LOSOS_VERSION="${LOSOS_VERSION#v}" bunx expo prebuild --platform android --no-install
      # Java comes after the prebuild: setup-java's gradle cache resolves
      # against the generated gradle files, which exist only past it (the
      # expo-apk job's comment carries the same reasoning).
      - uses: actions/setup-java@v5
        if: steps.secrets.outputs.sign == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: gradle assembleRelease (the signed APK)
        if: steps.secrets.outputs.sign == 'true'
        working-directory: admin-ui/app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: stage the APK with its checksum
        if: steps.secrets.outputs.sign == 'true'
        id: stage
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          apk="losos-android-${TAG}.apk"
          cp admin-ui/app/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          {
            echo "apk=$apk"
            echo "sha=$(cut -d' ' -f1 < "$apk.sha256")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.sign == 'true'
        with:
          name: losos-android-release
          path: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14
      # ci.yml owns the release's life (draft, ISO, publish); this only
      # waits for the draft to exist and adds the APK to it. A dry run
      # stops at the artifact above.
      - name: attach the APK to the tag's draft release
        if: steps.secrets.outputs.sign == 'true' && !inputs.dry_run
        env:
          APK: ${{ steps.stage.outputs.apk }}
          APK_SHA: ${{ steps.stage.outputs.sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: |
            ### LosOS for Android

            **[${APK}](../releases/download/${TAG}/${APK})** — `sha256 ${APK_SHA}`

            Install it like any APK — it is not on a store yet.
        run: ./.github/scripts/attach-release-asset.sh android "$APK" "$APK.sha256"

  ios:
    name: "ios: unsigned release shell (pending an Apple Developer account)"
    runs-on: macos-15
    # Same shape as the android job's budget: the simulator lane builds in
    # ~90 and the attach waits up to four hours for the draft release.
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: admin-ui/app/package.json
      - name: the workspace (the lockfile's tree)
        working-directory: admin-ui/app
        run: bun install --frozen-lockfile --ignore-scripts
      # The Xcode 16 pin, the expo-ios-sim job's comment: RN 0.81's fmt
      # does not compile under Xcode 26's clang, and macos-15 carries a
      # 16.x for DEVELOPER_DIR to pick.
      - name: pick Xcode 16 (RN 0.81's supported clang)
        run: |
          xcode16=$(ls -d -- /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode16" ] || {
            echo "::error::no Xcode 16 on this runner image — RN 0.81's fmt does not compile under Xcode 26; pin a macos-15 runner (or the RN bump that carries a newer fmt) before this lane can build"
            exit 1
          }
          echo "DEVELOPER_DIR=$xcode16/Contents/Developer" >> "$GITHUB_ENV"
          echo "building with $(DEVELOPER_DIR=$xcode16/Contents/Developer xcodebuild -version)"
      - name: prebuild ios (cocoapods run by prebuild)
        working-directory: admin-ui/app
        env:
          LOSOS_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          LOSOS_VERSION="${LOSOS_VERSION#v}" bunx expo prebuild --platform ios --no-install
      - name: pod install
        working-directory: admin-ui/app/ios
        run: pod install
      # A device build without an identity: the simulator job's
      # CODE_SIGNING_ALLOWED=NO, with CODE_SIGNING_REQUIRED=NO beside it so
      # the device SDK stops asking too. The product is the raw .app — no
      # .ipa without signing, and no install on a phone without it.
      - name: xcodebuild (Release, device, unsigned)
        working-directory: admin-ui/app/ios
        run: |
          workspace=$(ls -d -- *.xcworkspace | head -1)
          echo "workspace: $workspace"
          listout=$(DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -list -json -workspace "$workspace")
          printf '%s\n' "$listout"
          scheme=$(jq -r '.workspace as $w |
            ($w.schemes | map(select(. == $w.name))[0])
            // ($w.schemes | map(select(test("^Pods-") | not))[0])' <<<"$listout")
          [ -n "$scheme" ] || { echo "::error::no app scheme in $workspace — the -list output is above"; exit 1; }
          echo "scheme: $scheme"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build
      - name: stage the unsigned .app zip with its checksum
        id: stage
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stage"
          zip_name="losos-ios-unsigned-${TAG}.zip"
          # The .app is inside the Release-iphoneos products dir; the zip is
          # -y (no ../ prefixes) so the unpack lands the .app itself.
          (cd admin-ui/app/ios/build/Build/Products/Release-iphoneos \
            && zip -r -y "$GITHUB_WORKSPACE/stage/$zip_name" "$(ls -d -- *.app | head -1)")
          cd "$GITHUB_WORKSPACE/stage"
          sha256sum "$zip_name" | tee "$zip_name.sha256"
          {
            echo "zip=$zip_name"
            echo "sha=$(cut -d' ' -f1 < "$zip_name.sha256")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: losos-ios-release-unsigned
          path: |
            ${{ github.workspace }}/stage/${{ steps.stage.outputs.zip }}
            ${{ github.workspace }}/stage/${{ steps.stage.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: attach the unsigned shell to the tag's draft release
        if: ${{ !inputs.dry_run }}
        env:
          ZIP: ${{ steps.stage.outputs.zip }}
          ZIP_SHA: ${{ steps.stage.outputs.sha }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: |
            ### LosOS for iOS (unsigned)

            **[${ZIP}](../releases/download/${TAG}/${ZIP})** — `sha256 ${ZIP_SHA}`

            Not installable yet: iOS needs Apple's own signing material,
            which needs a paid Apple Developer account (the eas.json TODO).
            This is the release shell, built and attached as the
            placeholder.
        run: ./.github/scripts/attach-release-asset.sh ios "$ZIP" "$ZIP.sha256"
