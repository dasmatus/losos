# Dioxus frontend (admin-ui/dioxus-app) — cross-platform checks.
# Verifies the single codebase builds for core, web/WASM, and Linux desktop
# (with webkit/gtk deps). Mobile bundling requires platform SDKs (see job notes).
name: Dioxus frontend

on:
  push:
    paths:
      - 'admin-ui/dioxus-app/**'
      - 'admin-ui/losos-client/**'
      - 'backend/access/**'
      - '.github/workflows/dioxus-frontend.yml'
      - 'devenv.nix'
      - 'flake.nix'
  pull_request:
    paths:
      - 'admin-ui/dioxus-app/**'
      - 'admin-ui/losos-client/**'
      - 'backend/access/**'
      - '.github/workflows/dioxus-frontend.yml'
      - 'devenv.nix'
      - 'flake.nix'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            admin-ui/dioxus-app -> target
            admin-ui/losos-client -> target
      - name: losos-client
        run: cargo test --manifest-path admin-ui/losos-client/Cargo.toml
      - name: Dioxus frontend core
        run: |
          cargo test --manifest-path admin-ui/dioxus-app/Cargo.toml --no-default-features
          cargo check --manifest-path admin-ui/dioxus-app/Cargo.toml --no-default-features
      - name: Dioxus frontend web (wasm32)
        run: cargo check --manifest-path admin-ui/dioxus-app/Cargo.toml --no-default-features --features gui,web --target wasm32-unknown-unknown

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Webview deps (reproducible desktop target)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-ui/dioxus-app -> target
      - name: Dioxus frontend desktop
        run: cargo check --manifest-path admin-ui/dioxus-app/Cargo.toml --no-default-features --features gui,desktop

  mobile-bundle:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked
      - name: Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
      - name: Bundle
        working-directory: admin-ui/dioxus-app
        env:
          # Android signing/SDK paths come from the runner/SDK setup; iOS needs Xcode on macos.
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            dx bundle --platform android --release
          else
            dx bundle --platform ios --release
          fi
