name: opencode dependency bump

# ── What this is ────────────────────────────────────────────────────────────
#
# An OpenCode agent (the full opencode CLI, running on the runner) that bumps
# the Cargo and Bun dependency lock files and then PROVES the result builds
# before a human ever sees a pull request:
#
#   1. bump    — the agent runs `cargo update` on the Cargo workspaces and
#                `bun update` on the Bun workspaces, exactly the commands
#                the lockfile-updates workflow uses. It changes lock files
#                and nothing else; the workflow itself recomputes the
#                vendored hashes (`fix-hashes.py`) after it, so a stale
#                hash cannot reach the pull request even if the agent
#                skipped that command.
#   2. build   — the workflow itself (never the agent) runs the build lane:
#                `cargo build` on the bumped workspaces in the CI dev shell,
#                frozen `bun install` plus the real admin-UI build on the Bun
#                side.
#   3. repair  — if the build is red, the failed log goes back to the agent,
#                which makes the smallest change that builds again (pin a
#                broken dependency back, or absorb a new-version API change).
#                Bounded: three build attempts, then the run fails instead of
#                opening a pull request.
#   4. report  — green builds get a branch and a pull request with the file
#                list and the agent's summary; red ones get nothing but a red
#                run.
#
# This file deliberately overlaps lockfile-updates.yml: that one also walks
# flake.lock and devenv.lock and does NOT build; this one does Cargo and Bun
# only and does. Run them on different days so the pull requests don't
# collide.
#
# The harness is OpenCode itself with the repository's OPENCODE_API_KEY
# actions secret (a free OpenCode Console key); the opencode CLI reads it
# natively and its identification is what routes the free-tier model ids.
# Until the secret exists the workflow is inert — the gate skips with a
# notice.
#
# Models: OpenCode Zen's free tier, the same ids the opencode-fix workflow
# runs on; the second is the fallback for when the primary is saturated. Free
# models rotate — see https://opencode.ai/models/#free-models.
#
# The bump agent gets write over lock files on the strength of a fixed
# command list, and the repair agent over source on the strength of a build
# log — both reach the agent as data through files, never through a shell.
# The build lane is run by the workflow, so the agent's claims are never the
# test.
#
# The pull request is pushed with LOCKFILE_UPDATE_TOKEN (the checkout's
# persisted GITHUB_TOKEN credentials would not trigger downstream CI), the
# same contract lockfile-updates.yml runs under.

on:
  schedule:
    # ~05:23 UTC Wednesdays, clear of lockfile-updates (Mondays 04:17).
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # OpenCode Zen, free tier. `opencode/<model-id>` for `opencode run
  # --model`, the same ids the opencode-fix workflow runs on.
  OC_MODEL: opencode/glm-5.3-flash-free
  OC_FALLBACK_MODEL: opencode/deepseek-v4.1-flash-free

concurrency:
  group: opencode-dependency-bump
  cancel-in-progress: false

jobs:
  gate:
    name: "gate: is there a key to run the agent with"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: decide
        id: decide
        env:
          # A secret cannot be read directly, but it CAN go into a step's
          # env (never into a run script): empty means the workflow runs
          # inert until someone adds OPENCODE_API_KEY in the settings.
          HAS_API_KEY: ${{ secrets.OPENCODE_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENCODE_API_KEY is not set in the repository's actions secrets; the bump stayed inert"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: "bump: OpenCode bumps, the lane build-tests"
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR branch is pushed later with LOCKFILE_UPDATE_TOKEN so the
          # resulting push/PR triggers downstream CI.
          persist-credentials: false

      - name: git identity
        run: |
          set -euo pipefail
          git config user.name "losos-ci-bot"
          git config user.email "losos-ci-bot@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/setup-nix

      # The lab bundles build wasm outside the nix dev shell, exactly as the
      # opencode-autofix workflow builds them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127

      # The opencode CLI: npm ships it to the runner. Nothing here is piped
      # to bash; the agent talks to OpenCode Zen with its own identification,
      # which is what makes the -free model ids route.
      - name: install opencode
        run: |
          set -euo pipefail
          npm install --global @opencode/cli
          opencode --version

      # The brief is written to a file and attached through `opencode run
      # --file`: it reaches the agent as data, never through a shell or an
      # interpolating heredoc. `.claude/CLAUDE.md` carries the repo's working
      # agreements; the agent reads it first.
      - name: write the bump brief
        run: |
          set -euo pipefail
          cat > /tmp/task.txt <<'BRIEF'
          You are the LosOS dependency-bump agent, working in a checkout of
          the repository's default branch.

          Read .claude/CLAUDE.md before anything else and follow it where it
          applies.

          Your one job: move the dependency lock files to their latest
          in-range versions by running, in order, exactly these commands from
          the repository root:

            cargo update --manifest-path backend/Cargo.toml
            cargo update --manifest-path edge/registrar/Cargo.toml
            (cd admin-ui/app && bun update --ignore-scripts)
            (cd admin-ui/design-system/react && bun update --ignore-scripts)
            python3 .github/scripts/fix-hashes.py --base HEAD

          Rules:

          - Run them as written. If one fails, stop and say so in your final
            answer — a failing bump is reported, not improvised around.
          - Touch nothing else: no source files, no version numbers inside
            Cargo.toml or package.json, no flake.lock or devenv.lock or
            devenv.yaml (another workflow owns those), no commits, no pushes,
            no pull requests, and no builds or tests — the workflow that ran
            you builds the result itself.
          - Leave every change unstaged in the working tree.
          - Final answer: one line per lock file that changed with a rough
            count of what moved, or "nothing to update" if the update
            commands changed nothing.
          BRIEF
          echo "brief: $(wc -c < /tmp/task.txt) bytes"

      # Free models rotate and saturate; when the primary can't run, a
      # second one on the same brief usually can. `--standalone` keeps the
      # run on its own private server; `--auto` approves the tools the brief
      # needs.
      - name: OpenCode bumps the dependencies (primary, then fallback)
        id: bump-agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          used=""
          for model in "$OC_MODEL" "$OC_FALLBACK_MODEL"; do
            echo "opencode run on $model"
            set +e
            opencode run --standalone --auto --model "$model" \
              "Your brief is the attached task.txt — read it in full, then do exactly what it says." \
              --file /tmp/task.txt \
              > /tmp/oc-answer.txt 2> /tmp/oc-run.log
            rc=$?
            set -e
            if [ "$rc" = 0 ] && [ -s /tmp/oc-answer.txt ]; then
              used="$model"
              break
            fi
            echo "::warning::opencode failed on $model (exit $rc):"
            tail -5 /tmp/oc-run.log || true
          done
          if [ -z "$used" ]; then
            echo "::error::both free models failed; no bump was made"
            exit 1
          fi
          echo "model=$used" >> "$GITHUB_OUTPUT"
          echo "answer: $(head -c 200 /tmp/oc-answer.txt)"

      # The brief has the agent run fix-hashes.py, but nothing in the build
      # lane tests the vendored hashes: a real `bun install` works fine on
      # a lock file whose Nix vendor hash went stale. Recompute them here,
      # where the run is a no-op when the agent already did, so the pull
      # request carries current hashes however the agent behaved.
      - name: refresh the vendored hashes
        run: python3 .github/scripts/fix-hashes.py --base HEAD

      # The agent's state (`.opencode/`) lives inside the checkout; it is its
      # private state, not part of the bump, and must not enter the commit.
      - name: take stock of the changes
        id: stock
        run: |
          set -euo pipefail
          rm -rf .opencode
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          files=$(git diff --cached --name-only | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "file_count=$(git diff --cached --name-only | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          git reset >/dev/null

      # The build lane, run by the workflow — the agent never gets to claim a
      # green build. On a red build the failed log goes back to the agent for
      # a bounded repair, then the lane runs again.
      #
      #   - Rust: the two workspaces the bump moved, in the CI dev shell
      #     (the flake's pinned rustc, sccache warm), the same lane the
      #     `ci` workflow's test job runs.
      #   - Bun: frozen installs in both bumped workspaces, then the admin
      #     UI's real build — the lab bundles first (core, virt, mdx; render
      #     is stubbed exactly as opencode-autofix stubs it), build.ts last.
      - name: build test, with OpenCode repairing red builds
        id: build
        if: steps.stock.outputs.changed == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          # The render stub, exactly as opencode-autofix builds it: render is
          # large and only the Lab page needs it, and the .d.ts stand-in
          # keeps the build typechecking while the screens run without the
          # GPU canvas.
          cd admin-ui/app
          mkdir -p src/lab/render-pkg/webgl2 src/lab/render-pkg/webgpu
          for api in webgl2 webgpu; do
            echo "export default {};" > "src/lab/render-pkg/$api/losos_lab_render.js"
            {
              echo 'export default function init(opts?: any): Promise<any>;'
              echo 'export declare const Lab: any;'
              echo 'export declare class LabCanvas { constructor(...args: any[]); [key: string]: any; static [key: string]: any; }'
            } > "src/lab/render-pkg/$api/losos_lab_render.d.ts"
            touch "src/lab/render-pkg/$api/losos_lab_render_bg.wasm"
          done
          cd "$GITHUB_WORKSPACE"

          ok=false
          for attempt in 1 2 3; do
            log="/tmp/build-$attempt.log"
            : > "$log"
            echo "── build attempt $attempt (log: $log)"

            if ! nix develop .#ci -c bash -euo pipefail -c '
                cargo build --manifest-path backend/Cargo.toml
                cargo build --manifest-path edge/registrar/Cargo.toml
              ' >>"$log" 2>&1; then
              echo "   rust lane red"
            elif ! (cd admin-ui/design-system/react \
                    && bun install --frozen-lockfile --ignore-scripts) >>"$log" 2>&1; then
              echo "   design-system install red"
            elif ! (cd admin-ui/app \
                    && bun install --frozen-lockfile --ignore-scripts \
                    && bun run lab:core && bun run lab:virt && bun run mdx \
                    && bun build.ts) >>"$log" 2>&1; then
              echo "   admin-ui lane red"
            else
              ok=true
              break
            fi

            # Red, and the budget is spent: the run fails, no pull request.
            if [ "$attempt" = 3 ]; then break; fi

            # Hand the capped failure log to the agent as data.
            head -c 60000 "$log" > /tmp/build-failure.log
            {
              cat <<'BRIEF'
          You are the LosOS dependency-bump repair agent, working in a
          checkout that carries a routine dependency bump (`cargo update` /
          `bun update` over the lock files) that fails to build.

          Read .claude/CLAUDE.md before anything else and follow it where it
          applies.

          The failed build log is at the end of this file. Diagnose the
          failure and make the SMALLEST change that builds again:

          - A dependency whose new version is broken or incompatible: pin it
            back to the last working version (`cargo update
            --manifest-path <workspace>/Cargo.toml --precise <version>
            <crate>`, or a devDependency override for a Bun package) and say
            so in your final answer.
          - A new-version API change the code must absorb: make the minimal
            code change and say so in your final answer.

          Do not hand-edit Cargo.lock or bun.lock. Do not run builds or tests
          yourself (they are expensive on this runner); reason from the log.
          Do not commit; leave the changes in the working tree — the workflow
          that ran you refreshes the vendored hashes, rebuilds, and commits.
          BRIEF
              echo
              echo "── failed build log ──"
              cat /tmp/build-failure.log
            } > /tmp/fix-task.txt

            for model in "$OC_MODEL" "$OC_FALLBACK_MODEL"; do
              echo "   opencode repair on $model"
              set +e
              opencode run --standalone --auto --model "$model" \
                "Your brief is the attached fix-task.txt — read it in full, then do exactly what it says." \
                --file /tmp/fix-task.txt \
                > /tmp/oc-fix-answer.txt 2> /tmp/oc-fix-run.log
              rc=$?
              set -e
              if [ "$rc" = 0 ] && [ -s /tmp/oc-fix-answer.txt ]; then
                cat /tmp/oc-fix-answer.txt >> /tmp/oc-repairs.md
                echo >> /tmp/oc-repairs.md
                break
              fi
              echo "::warning::opencode repair failed on $model (exit $rc)"
              tail -5 /tmp/oc-fix-run.log || true
            done

            # A repair that moved a lock file stales the vendored hashes
            # again; refresh them (a no-op when nothing lock-shaped moved).
            python3 .github/scripts/fix-hashes.py --base HEAD
          done

          if [ "$ok" != "true" ]; then
            echo "::error::the build lane is still red after 3 attempts and 2 repairs; no pull request is opened"
            tail -40 /tmp/build-3.log || true
            exit 1
          fi
          echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
          echo "build lane green on attempt $attempt"

      - name: commit the bump
        if: steps.stock.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rm -rf .opencode
          git add -A
          git commit -m "chore: bump Cargo and Bun dependencies (OpenCode)"

      - name: open or update the pull request
        if: steps.stock.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCKFILE_UPDATE_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN }}
          MODEL: ${{ steps.bump-agent.outputs.model }}
          ATTEMPTS: ${{ steps.build.outputs.attempts }}
          FILES: ${{ steps.stock.outputs.files }}
          FILE_COUNT: ${{ steps.stock.outputs.file_count }}
        run: |
          set -euo pipefail
          if [ -z "${LOCKFILE_UPDATE_TOKEN}" ]; then
            echo "LOCKFILE_UPDATE_TOKEN is required for branch pushes that trigger CI." >&2
            exit 1
          fi

          branch=bot/opencode-dependency-bump
          git checkout -B "$branch"

          {
            echo "## Dependency bumps (OpenCode)"
            echo
            echo "_${MODEL} ran \`cargo update\` on the Cargo workspaces and \`bun update\` on the Bun workspaces, and the build lane passed${ATTEMPTS:+ on build attempt $ATTEMPTS}._"
            if [ -s /tmp/oc-repairs.md ]; then
              echo
              echo "The first build was red; the agent repaired it:"
              echo
              head -c 2000 /tmp/oc-repairs.md
              echo
            fi
            echo
            echo "Touched (${FILE_COUNT} file(s)):"
            for f in $FILES; do echo "- \`$f\`"; done
            echo
            echo "Cargo and Bun only — flake.lock and devenv.lock are lockfile-updates' business."
          } > /tmp/pr-body.md

          auth_header="$(
            printf 'x-access-token:%s' "$LOCKFILE_UPDATE_TOKEN" | base64 -w0
          )"
          remote_sha="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
              ls-remote origin "refs/heads/$branch" | awk '{print $1}'
          )"
          push_args=(origin "$branch")
          if [ -n "$remote_sha" ]; then
            push_args=(--force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch")
          fi
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push "${push_args[@]}"

          export GH_TOKEN="${LOCKFILE_UPDATE_TOKEN}"
          number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json number,headRefName,isCrossRepository \
              --jq \
              '.[] | select(.headRefName == "'"$branch"'" and (.isCrossRepository | not)) | .number' \
              | head -n1
          )"
          title="chore: dependency bumps (OpenCode)"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file /tmp/pr-body.md
          else
            head_ref="${GITHUB_REPOSITORY_OWNER}:$branch"
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$head_ref" \
              --title "$title" \
              --body-file /tmp/pr-body.md
          fi

      - name: report an empty bump
        if: steps.stock.outputs.changed != 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dependency bumps (OpenCode)"
            echo
            echo "Everything was already up to date; nothing to do."
          } >> "$GITHUB_STEP_SUMMARY"
