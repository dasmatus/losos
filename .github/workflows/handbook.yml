name: handbook

# Builds the owner's handbook (handbook/, Docusaurus) and publishes it to the
# GitHub Pages site on every push to main. Pull requests only build, which is
# the gate: `docusaurus build` fails on a broken link.
#
# The site is deployed through Actions (actions/deploy-pages), not from a
# branch: the repository's Pages source has to be set to "GitHub Actions"
# once, under Settings → Pages. The custom domain (losos.dasmat.us) is kept
# in the same settings; handbook/static/CNAME repeats it for a branch deploy.
#
# The same site carries a static copy of the LosOS binary cache at /proxy
# (https://losos.dasmat.us/proxy), for when the proxy on Vercel does not
# answer. ci.yml's publish-cache and publish-tool jobs leave it as the
# artifacts losos-pages-cache and losos-pages-updates on every push to main;
# this workflow runs again when ci finishes on main and deploys the newest of
# each under /proxy. The handbook has no page there, so nothing collides.
#
# The box's own copy at /handbook/ is a separate build of the same source
# (flake/packages.nix, losos-handbook), built by ci.yml's registrar-and-ui
# job on every push and pull request, next to the admin UI; this workflow is
# only the public site.

on:
  push:
    branches: [main]
    paths:
      - "handbook/**"
      - ".github/workflows/handbook.yml"
      # The one file the handbook's checks read from the admin UI: the error
      # map (check:links). The palette is the desktop's now (handbook's
      # scripts/derisk-theme.sh), no longer the admin UI's tokens.css.
      - "admin-ui/app/src/lib/handbook.ts"
  pull_request:
    paths:
      - "handbook/**"
      - ".github/workflows/handbook.yml"
      - "admin-ui/app/src/lib/handbook.ts"
  # Picks up the cache copy a ci run on main just published.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Reading ci's artifacts for the cache copy.
  actions: read

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "docusaurus: build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: handbook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The admin UI's "What to do" links must all land on a page.
      - run: npm run check
      - run: npm run build
      - name: add the cache copy at /proxy
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The newest unexpired artifact of that name from a run on this
          # repository's main, whatever the run's other jobs did.
          newest() {
            gh api "repos/$REPO/actions/artifacts?name=$1&per_page=30" --jq \
              '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty'
          }
          fetch() {
            local id
            id=$(newest "$1")
            if [ -z "$id" ]; then
              echo "::notice::no $1 artifact from main yet; the site goes out without it"
              return 0
            fi
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$1.zip"
            mkdir -p "$2"
            unzip -q -o "$RUNNER_TEMP/$1.zip" -d "$2"
            echo "$1: artifact $id"
          }
          fetch losos-pages-cache build/proxy
          fetch losos-pages-updates build/proxy/updates/main/x86_64
          du -sh build build/proxy 2>/dev/null || true
      # The public site is rooted at / on losos.dasmat.us; the box's copy is
      # rooted at /handbook/ and is built by nix, not here.
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: handbook/build

  deploy:
    name: "pages: deploy"
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
