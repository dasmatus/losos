name: handbook-screens

# Regenerates the handbook's UI screenshots when the admin UI changes.
#
# On pull requests: builds the UI, takes the shots, and posts a comment with
# before/after for any that differ from main. The images themselves are hidden
# inside a collapsible <details> summary so the PR timeline stays readable.
# On main: takes the shots and commits any that changed, so the handbook
# stays in step with the UI.
#
# The shots come from admin-ui/app/tests/handbook-screens.ts (stubbed lososd,
# no box required). A change to a shot's name, path or fixture in that file,
# or to the admin UI it photographs, is what this watches.

on:
  pull_request:
    paths:
      - "admin-ui/app/**"
      - "admin-ui/app/tests/handbook-screens.ts"
      - ".github/workflows/handbook-screens.yml"
  push:
    branches: [main]
    paths:
      - "admin-ui/app/**"
      - "admin-ui/app/tests/handbook-screens.ts"
      - ".github/workflows/handbook-screens.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: handbook-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: "handbook screenshots"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: admin-ui/app/package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: build lab packages
        working-directory: admin-ui/app
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run lab:core
          bun run lab:virt
          bun run mdx
          # render is large and only needed for the Lab page; stub it for
          # screens. The build typechecks now, and tsc reads the stub's .d.ts
          # (not its .js), so the stand-in keeps the surfaces the page imports:
          # the init, Lab and LabCanvas (render.ts, bevy-canvas.tsx).
          mkdir -p src/lab/render-pkg/webgl2 src/lab/render-pkg/webgpu
          for api in webgl2 webgpu; do
            echo "export default {};" > "src/lab/render-pkg/$api/losos_lab_render.js"
            {
              echo 'export default function init(opts?: any): Promise<any>;'
              echo 'export declare const Lab: any;'
              echo 'export declare class LabCanvas { constructor(...args: any[]); [key: string]: any; static [key: string]: any; }'
            } > "src/lab/render-pkg/$api/losos_lab_render.d.ts"
            touch "src/lab/render-pkg/$api/losos_lab_render_bg.wasm"
          done

      - name: build admin UI
        working-directory: admin-ui/app
        run: bun run build

      - name: install Playwright Chromium
        working-directory: admin-ui/app
        run: bun --bun x playwright install chromium --with-deps

      - name: take screenshots
        working-directory: admin-ui/app
        run: bun tests/handbook-screens.ts /tmp/handbook-screens

      - name: collect changed shots
        id: changes
        run: |
          mkdir -p /tmp/before /tmp/after
          # Current images on the branch (before the new shots)
          if [ -d handbook/docs/img ]; then
            cp handbook/docs/img/*.png /tmp/before/ 2>/dev/null || true
          fi
          cp /tmp/handbook-screens/*.png /tmp/after/
          # Diff
          changed=""
          for f in /tmp/after/*.png; do
            base=$(basename "$f")
            if [ ! -f "/tmp/before/$base" ] || ! cmp -s "$f" "/tmp/before/$base"; then
              changed="$changed $base"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed: $changed"

      - name: upload screenshots
        if: steps.changes.outputs.changed != ''
        uses: actions/upload-artifact@v7
        with:
          name: handbook-screens
          path: /tmp/handbook-screens/*.png
          retention-days: 7

      - name: publish temporary screenshots for the comment
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed != ''
        id: publish
        run: |
          # Forks cannot be pushed to with the default token.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skipping image publish on fork PR"
            exit 0
          fi
          mkdir -p .github/screenshots/pr-temp
          # shellcheck disable=SC2086
          for f in ${{ steps.changes.outputs.changed }}; do
            cp "/tmp/handbook-screens/$f" ".github/screenshots/pr-temp/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/screenshots/pr-temp
          if git diff --cached --quiet; then
            echo "no images to publish"
            exit 0
          fi
          git commit -m "chore: temporary handbook screenshots for PR comment"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: comment on PR (before/after)
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed != ''
        uses: actions/github-script@v9
        env:
          PUBLISH_SHA: ${{ steps.publish.outputs.sha }}
        with:
          script: |
            const changed = `${{ steps.changes.outputs.changed }}`.trim().split(/\s+/).filter(Boolean);
            const sha = process.env.PUBLISH_SHA || context.sha;
            const afterBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${sha}/.github/screenshots/pr-temp`;
            const beforeBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/handbook/docs/img`;
            const rows = changed.map(f => {
              const before = `![before](${beforeBase}/${encodeURIComponent(f)})`;
              const after = `![after](${afterBase}/${encodeURIComponent(f)})`;
              return `| \`${f}\` | ${before} | ${after} |`;
            });
            const body = [
              '### Handbook screenshots',
              '',
              `These ${changed.length} shot${changed.length === 1 ? '' : 's'} differ from the ones currently in \`handbook/docs/img\`.`,
              '',
              '<details>',
              `<summary>View changed screenshots</summary>`,
              '',
              '| File | Before | After |',
              '| ---- | ------ | ----- |',
              ...rows,
              '',
              '</details>',
              '',
              'The full set is in the `handbook-screens` artifact. On merge to main this workflow will commit the updated images.',
              '',
              process.env.PUBLISH_SHA
                ? 'Temporary copies of the new shots live on this branch under `.github/screenshots/pr-temp/` so they can be embedded; feel free to remove that directory before merging.'
                : 'Images could not be published (fork PR or no changes to commit). Download the artifact to see them.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: commit updated screenshots on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/handbook-screens/*.png handbook/docs/img/
          git add handbook/docs/img
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "handbook: update UI screenshots"
          git push
