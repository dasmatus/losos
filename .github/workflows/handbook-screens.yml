name: handbook-screens

# Regenerates the handbook's UI screenshots when the admin UI changes.
#
# Platform matrix: the same screenshot set is attempted per platform target
# introduced for admin surfaces (web, tv, windows, visionos). `web` is the
# existing Playwright/web-admin render path. `tv` runs the same harness with
# EXPO_TV=1 as a leanback render marker. `windows` and `visionos` are native
# shells that cannot be rendered headlessly on ubuntu-latest in this harness;
# those matrix entries run but record a documented skip/reason (and do not
# fail the job) so every platform is shown explicitly rather than dropped.
# Outputs are written per platform under /tmp/handbook-screens/<platform>/.
#
# On pull requests: builds the UI, takes shots per platform, uploads artifacts,
# attempts to commit changed shots to the PR branch and posts a comment with
# before/after images embedded via raw URLs pinned to the pushed commit SHA
# (falls back to artifact-only text if the branch push is refused, e.g. fork
# PRs/rulesets, stating why embeds are unavailable).
# On main: takes shots and opens a PR with any changed images, embedding each
# changed image in the PR body via raw URL pinned to the bot commit (main's
# ruleset rejects a direct bot push - required status checks, CodeQL).
#
# The shots come from admin-ui/app/tests/handbook-screens.ts (stubbed lososd,
# no box required). A change to a shot's name, path or fixture in that file,
# or to the admin UI it photographs, is what this watches.

on:
  pull_request:
    paths:
      - "admin-ui/app/**"
      - "admin-ui/app/tests/handbook-screens.ts"
      - ".github/workflows/handbook-screens.yml"
  push:
    branches: [main]
    paths:
      - "admin-ui/app/**"
      - "admin-ui/app/tests/handbook-screens.ts"
      - ".github/workflows/handbook-screens.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: handbook-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: "handbook screenshots (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            can_render: "true"
            note: "existing Playwright web-admin render path"
          - platform: tv
            can_render: "true"
            note: "Playwright harness with EXPO_TV=1 leanback marker"
          - platform: windows
            can_render: "false"
            note: "react-native-windows native shell cannot be rendered headlessly on ubuntu; code-only/skipped"
          - platform: visionos
            can_render: "false"
            note: "react-native-visionos native shell requires Apple visionOS tooling; code-only/skipped on ubuntu"
    continue-on-error: ${{ matrix.can_render != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: admin-ui/app/package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: build lab packages
        working-directory: admin-ui/app
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run lab:core
          bun run lab:virt
          bun run mdx
          # render is large and only needed for the Lab page; stub it for
          # screens. The build typechecks now, and tsc reads the stub's .d.ts
          # (not its .js), so the stand-in keeps the surfaces the page imports:
          # the init, Lab and LabCanvas (render.ts, bevy-canvas.tsx).
          mkdir -p src/lab/render-pkg/webgl2 src/lab/render-pkg/webgpu
          for api in webgl2 webgpu; do
            echo "export default {};" > "src/lab/render-pkg/$api/losos_lab_render.js"
            {
              echo 'export default function init(opts?: any): Promise<any>;'
              echo 'export declare const Lab: any;'
              echo 'export declare class LabCanvas { constructor(...args: any[]); [key: string]: any; static [key: string]: any; }'
            } > "src/lab/render-pkg/$api/losos_lab_render.d.ts"
            touch "src/lab/render-pkg/$api/losos_lab_render_bg.wasm"
          done

      - name: build admin UI
        working-directory: admin-ui/app
        run: bun build.ts

      - name: install Playwright Chromium
        working-directory: admin-ui/app
        run: bun --bun x playwright install chromium --with-deps

      - name: take screenshots
        working-directory: admin-ui/app
        env:
          SCREENSHOT_PLATFORM: ${{ matrix.platform }}
          EXPO_TV: ${{ matrix.platform == 'tv' && '1' || '' }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/handbook-screens/${{ matrix.platform }}"
          if [ "${{ matrix.can_render }}" != "true" ]; then
            echo "skip ${{ matrix.platform }}: ${{ matrix.note }}" | tee "/tmp/handbook-screens/${{ matrix.platform }}/SKIPPED.txt"
            exit 0
          fi
          bun tests/handbook-screens.ts /tmp/handbook-screens "" "${{ matrix.platform }}" 

      - name: collect changed shots
        id: changes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/before /tmp/after "/tmp/handbook-screens/$PLATFORM"
          if [ -f "/tmp/handbook-screens/$PLATFORM/SKIPPED.txt" ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=${{ matrix.note }}" >> "$GITHUB_OUTPUT"
            echo "Skipped: $PLATFORM (${{ matrix.note }})"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          # Baseline per platform (if present) else legacy flat web baseline.
          base_dir="handbook/docs/img/$PLATFORM"
          if [ "$PLATFORM" = "web" ] && [ ! -d "$base_dir" ] && [ -d handbook/docs/img ]; then
            base_dir="handbook/docs/img"
          fi
          if [ -d "$base_dir" ]; then
            find "$base_dir" -maxdepth 1 -type f -name '*.png' -exec cp {} /tmp/before/ \; 2>/dev/null || true
          fi
          find "/tmp/handbook-screens/$PLATFORM" -maxdepth 1 -type f -name '*.png' -exec cp {} /tmp/after/ \; 2>/dev/null || true
          changed=""
          for f in /tmp/after/*.png; do
            base=$(basename "$f")
            if [ ! -f "/tmp/before/$base" ] || ! cmp -s "$f" "/tmp/before/$base"; then
              changed="$changed $base"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed ($PLATFORM): $changed" 

      - name: upload screenshots
        if: steps.changes.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: handbook-screens-${{ matrix.platform }}
          path: /tmp/handbook-screens/${{ matrix.platform }}/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: commit changed shots to PR branch (for embedded images)
        id: prpush
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed != '' && steps.changes.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "handbook/docs/img/$PLATFORM"
          cp /tmp/handbook-screens/"$PLATFORM"/*.png "handbook/docs/img/$PLATFORM"/
          git add "handbook/docs/img/$PLATFORM"
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
            exit 0
          fi
          # Fork PRs / protected refs may refuse pushes; degrade gracefully.
          git fetch origin "$PR_HEAD_REF" || true
          git checkout -B "$PR_HEAD_REF" "origin/$PR_HEAD_REF" 2>/dev/null || git checkout "$PR_HEAD_REF"
          mkdir -p "handbook/docs/img/$PLATFORM"
          cp /tmp/handbook-screens/"$PLATFORM"/*.png "handbook/docs/img/$PLATFORM"/
          git add "handbook/docs/img/$PLATFORM"
          git commit -m "handbook: update $PLATFORM screenshots (bot)"
          if git push origin "HEAD:$PR_HEAD_REF"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "push refused (fork PR or ruleset); falling back to artifact-only comment"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: comment on PR (before/after)
        if: github.event_name == 'pull_request' && (steps.changes.outputs.changed != '' || steps.changes.outputs.skipped == 'true')
        uses: actions/github-script@v9
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          SKIPPED: ${{ steps.changes.outputs.skipped }}
          SKIP_REASON: ${{ steps.changes.outputs.skip_reason }}
          PUSHED: ${{ steps.prpush.outputs.pushed }}
          HEAD_SHA: ${{ steps.prpush.outputs.head_sha }}
        with:
          script: |
            const platform = process.env.PLATFORM;
            const changed = (process.env.CHANGED || '').trim().split(/\s+/).filter(Boolean);
            const skipped = process.env.SKIPPED === 'true';
            const skipReason = process.env.SKIP_REASON || '';
            const pushed = process.env.PUSHED === 'true';
            const headSha = process.env.HEAD_SHA || context.payload.pull_request.head.sha;
            const baseSha = context.payload.pull_request.base.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const raw = (sha, path) => `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/${path}`;
            let body;
            if (skipped) {
              body = [
                `### Handbook screenshots (${platform})`,
                '',
                `Skipped: ${skipReason}`,
                '',
                `Artifact: \`handbook-screens-${platform}\` (if produced).`,
              ].join('\n');
            } else if (changed.length === 0) {
              body = `### Handbook screenshots (${platform})\n\nNo changed screenshots.`;
            } else if (pushed) {
              const rows = changed.map((f) => {
                const afterPath = `handbook/docs/img/${platform}/${f}`;
                const beforePath = `handbook/docs/img/${platform}/${f}`;
                const beforeUrl = raw(baseSha, beforePath);
                const afterUrl = raw(headSha, afterPath);
                return `| \`${f}\` | ![${f} before](${beforeUrl}) | ![${f} after](${afterUrl}) |`;
              });
              body = [
                `### Handbook screenshots (${platform})`,
                '',
                '<details>',
                '<summary>Before / after (changed screenshots)</summary>',
                '',
                '| Screen | Before | After |',
                '| --- | --- | --- |',
                ...rows,
                '',
                `Artifact fallback: \`handbook-screens-${platform}\`.`,
                '',
                '</details>',
              ].join('\n');
            } else {
              body = [
                `### Handbook screenshots (${platform})`,
                '',
                '<details>',
                '<summary>Changed screenshots (images not embedded)</summary>',
                '',
                'The bot could not push rendered screenshots to the PR branch (fork PR or ruleset), so images are not embedded here.',
                '',
                ...changed.map((f) => `- \`${f}\``),
                '',
                `Artifact: \`handbook-screens-${platform}\`.`,
                '',
                '</details>',
              ].join('\n');
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body,
            });

      - name: "commit updated screenshots (a PR - main only takes PRs)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.changed != '' && steps.changes.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "handbook/docs/img/$PLATFORM"
          cp /tmp/handbook-screens/"$PLATFORM"/*.png "handbook/docs/img/$PLATFORM"/
          git add "handbook/docs/img/$PLATFORM"
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          branch="handbook-screens/auto-${PLATFORM}-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$branch"
          git commit -m "handbook: update ${PLATFORM} UI screenshots"
          git push origin "$branch"
          head_sha=$(git rev-parse HEAD)
          changed="${{ steps.changes.outputs.changed }}"
          {
            echo "### Handbook screenshots (${PLATFORM})"
            echo ""
            echo "Automated refresh from the \`handbook-screens\` workflow for commit ${{ github.sha }}."
            echo ""
            for f in $changed; do
              echo "![${PLATFORM}/${f}](https://raw.githubusercontent.com/${{ github.repository }}/$head_sha/handbook/docs/img/$PLATFORM/$f)"
              echo ""
            done
            echo "Merging lands the images the workflow could not push to main directly."
          } > /tmp/screens-pr.md
          gh pr create --base main --head "$branch" \
            --title "handbook: update ${PLATFORM} UI screenshots" \
            --body-file /tmp/screens-pr.md
