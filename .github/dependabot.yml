# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# - Weekly version updates for every package ecosystem in this repository
# - Minor/patch updates grouped into a single PR per ecosystem; majors stay separate
# - Security updates grouped per ecosystem
# - 3-day cooldown so brand-new releases settle before a PR is opened
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/backend"
      - "/edge/registrar"
      - "/edge/vercel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"
    cooldown:
      default-days: 3
    # Two dev-dependencies hand an RNG to a crate that takes rand_core 0.6:
    # rand in backend (rPGP 0.21's key generation) and rand_core in
    # edge/registrar (rsa 0.9). A newer major of either does not compile
    # until pgp and rsa move to a newer rand_core, so it waits for them.
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "bun"
    directories:
      - "/admin-ui/app"
      - "/admin-ui/design-system/react"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(bun)"
    cooldown:
      default-days: 3
    # playwright moves with nixpkgs' playwright-driver, never ahead of it:
    # nix/tests/admin-ui.nix and nix/tests/design-system.nix assert the two
    # versions match, so a Dependabot bump of it can only fail CI.
    ignore:
      - dependency-name: "playwright"
    groups:
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(github-actions)"
    cooldown:
      default-days: 3
    groups:
      githubactions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      githubactions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      githubactions-security:
        applies-to: security-updates
        patterns: ["*"]
